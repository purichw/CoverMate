ปี\",\"en\":\"Protect household spending for several years\",\"wth\":\"ใส่ค่าใช้จ่ายจำเป็นต่อเดือนและจำนวนปีที่อยากให้ครอบครัวยืนต่อได้ แล้วค่อยหักเงินสำรองหรือทุนเดิมที่กันไว้แล้ว\",\"wen\":\"Enter essential monthly spending and the years your family needs support, then subtract liquid assets and existing cover.\"},{\"th\":\"หนี้และค่าเรียนควรถูกนับแยก\",\"en\":\"Debts and education should be explicit\",\"wth\":\"หนี้บ้าน รถ หรือภาระอนาคตควรเป็นตัวเลขแยกจากค่าใช้จ่ายรายเดือน เพื่อไม่ให้ทุนชีวิตต่ำกว่าภาระจริง\",\"wen\":\"Mortgage, car debt and future obligations should be entered separately from monthly spending so life need is not understated.\"},{\"th\":\"โรคร้ายแรงคือเงินพักฟื้น\",\"en\":\"Critical illness is a recovery buffer\",\"wth\":\"เงินก้อนโรคร้ายแรงในเครื่องมือนี้อิงเดือนพักฟื้น ไม่ได้ผูกโรคใดโรคหนึ่งกับทุนตายตัว\",\"wen\":\"The CI figure is based on recovery months, not a disease-to-sum-insured shortcut.\"}]},\"business\":{\"th\":\"เจ้าของธุรกิจ\",\"en\":\"Business owner\",\"icon\":\"briefcase\",\"recs\":[{\"th\":\"แยกภาระบ้านกับภาระธุรกิจ\",\"en\":\"Separate household and business obligations\",\"wth\":\"ภาระธุรกิจที่ครอบครัวต้องรับต่อควรถูกใส่เป็นภาระอนาคต ไม่รวมปนกับค่าใช้จ่ายประจำบ้าน\",\"wen\":\"Business obligations that would fall to the family should be added as future obligations, not blended into household spending.\"},{\"th\":\"เงินสดสำรองช่วยลดช่องว่างได้\",\"en\":\"Earmarked liquidity reduces the gap\",\"wth\":\"เงินสำรองที่ตั้งใจใช้เพื่อครอบครัวหรือธุรกิจในกรณีฉุกเฉินสามารถนำมาหักได้ แต่เงินทุนหมุนเวียนที่ต้องใช้ทำงานไม่ควรนับซ้ำ\",\"wen\":\"Earmarked emergency liquidity can reduce the gap, but working capital needed by the business should not be double-counted.\"},{\"th\":\"ตรวจ health limit แยกจากทุนชีวิต\",\"en\":\"Review health limits separately from life cover\",\"wth\":\"ค่ารักษาไม่ควรถูกนำไปคูณเป็นทุนชีวิต แต่ควรตรวจเป็น room gap และเงื่อนไขกรมธรรม์แยกต่างหาก\",\"wen\":\"Medical costs should not drive life cover. Review room gap and 3\",\"note\":\"\",\"value\":\"เหมาะกับรถใช้งานมานาน หรือรถที่มูลค่าไม่สูงและต้องการความคุ้มครองพื้นฐาน\"},\"en\":{\"label\":\"Class 3\",\"note\":\"\",\"value\":\"Suitable for older or lower-value cars where basic protection is enough\"}}]},{\"id\":\"claim\",\"type\":\"claim\",\"on\":true,\"bg\":\"dark\",\"cols\":4,\"th\":{\"kicker\":\"เก็บหน้านี้ไว้ · สำหรับกรณีเกิดอุบัติเหตุ\",\"title\":\"เกิดอุบัติเหตุ\\nทำอะไรก่อน\",\"body\":\"เมื่อเกิดอุบัติเหตุ การจัดลำดับสิ่งที่ต้องทำอาจไม่ง่าย เราจึงสรุปขั้นตอนสำคัญไว้ให้ทำตามทีละข้อ จากนั้นสามารถติดต่อเราเพื่อช่วยประสานงานกับบริษัทประกันภัยต่อได้\",\"note\":\"หากไม่แน่ใจว่าควรดำเนินการอย่างไร สามารถติดต่อเราเพื่อสอบถามขั้นตอนเบื้องต้นได้โดยไม่มีค่าใช้จ่าย แม้ยังไม่ได้เป็นลูกค้าของ CoverMate\"},\"en\":{\"kicker\":\"Keep this page · for accident situations\",\"title\":\"An accident just\\nhappened — do this\",\"body\":\"In an accident, it can be hard to decide what to do first. We have set out the key steps in order, then you can contact us for help coordinating with the insurer.\",\"note\":\"If you are unsure what to do, you can contact us for initial guidance at no charge, even if you are not yet a CoverMate client.\"},\"items\":[{\"icon\":\"alert\",\"th\":{\"title\":\"ดูคนก่อนดูรถ\",\"body\":\"มีใครเจ็บไหม ถ้าเจ็บโทร 1669 ทันที ย้ายรถออกจากช่องทางเดินรถถ้าขยับได้ เปิดไฟฉุกเฉิน ตั้งสามเหลี่ยม อย่ายืนอยู่บนถนน\"},\"en\":{\"title\":\"People before cars\",\"body\":\"Anyone hurt? Call 1669 immediately. Move the car out of live traffic if it can be moved, turn hazards on, set a warning triangle and avoid standing in the road.\"}},{\"icon\":\"camera\",\"th\":{\"title\":\"ถ่ายรูปก่อนขยับ\",\"body\":\"ถ่ายให้เห็นตำแหน่งรถทั้งสองคันพร้อมกัน ป้ายทะเบียนคู่กรณี ความเสียหายทุกด้าน และภาพกว้างให้เห็นถนนกับสัญญาณไฟ\"},\"en\":{\"title\":\"Photograph before moving\",\"body\":\"Take photos showing both vehicles in position, the other plate, all visible damage, and a wide view of the road and traffic signals.\"}},{\"icon\":\"phone\",\"th\":{\"title\":\"แจ้งบริษัทประกัน\",\"body\":\"โทรสายด่วนบริษัทที่หน้ากรมธรรม์ แจ้งเลขกรมธรรม์กับสถานที่ รอเจ้าหน้าที่มาออกใบเคลม อย่าตกลงจ่ายเงินสดกันเองข้างถนน\"},\"en\":{\"title\":\"Notify the insurer\",\"body\":\"Call the hotline shown on your policy with the policy number and location, then wait for the surveyor or claim slip. Avoid settling in cash at the roadside.\"}},{\"icon\":\"chat\",\"th\":{\"title\":\"ส่งเอกสารให้เรา\",\"body\":\"ส่งภาพถ่ายและใบเคลมทาง LINE เราจะช่วยติดตามและประสานงานกับบริษัทประกันภัยในประเด็นที่เกี่ยวข้อง เช่น อู่ซ่อม รถใช้ระหว่างซ่อม และค่าเสียหายส่วนแรกตามเงื่อนไขกรมธรรม์\"},\"en\":{\"title\":\"Send the documents to us\",\"body\":\"Send the photos and claim slip on LINE. We can help follow up and coordinate with the insurer on relevant issues such as garages, courtesy cars and excess amounts under the policy conditions.\"}}],\"cards\":[{\"th\":{\"kicker\":\"เจ็บ · ฉุกเฉิน\",\"title\":\"1669\",\"body\":\"ศูนย์การแพทย์ฉุกเฉิน · ฟรี ตลอด 24 ชม.\"},\"en\":{\"kicker\":\"Injury · emergency\",\"title\":\"1669\",\"body\":\"Emergency medical services · free, 24 hours\"}},{\"th\":{\"kicker\":\"ตำรวจ\",\"title\":\"191\",\"body\":\"เมื่อมีข้อพิพาท คู่กรณีหนี หรือต้องลงบันทึกประจำวัน\"},\"en\":{\"kicker\":\"Police\",\"title\":\"191\",\"body\":\"For disputes, a driver leaving the scene, or a police report\"}},{\"th\":{\"kicker\":\"อุบัติเหตุบนทางหลวง\",\"title\":\"1586\",\"body\":\"สายด่วนกรมทางหลวง · แจ้งเหตุและขอความช่วยเหลือบนถนน\"},\"en\":{\"kicker\":\"Highway incidents\",\"title\":\"1586\",\"body\":\"Department of Highways hotline · road incidents and assistance\"}},{\"th\":{\"kicker\":\"ร้องเรียนเรื่องประกัน\",\"title\":\"1186\",\"body\":\"สายด่วน คปภ. · เมื่อบริษัทประกันปฏิเสธหรือประวิงเวลา\"},\"en\":{\"kicker\":\"Insurance complaints\",\"title\":\"1186\",\"body\":\"OIC hotline · when an insurer refuses or delays\"}}]},{\"id\":\"renew\",\"type\":\"renew\",\"on\":true,\"bg\":\"sage\",\"cols\":3,\"th\":{\"kicker\":\"เตือนล่วงหน้า · ยกเลิกได้ทุกเมื่อ\",\"title\":\"ไม่ต้องกังวลเรื่องวันหมดอายุ\\nให้เราช่วยเตือนล่วงหน้า\",\"body\":\"แจ้งประเภทกรมธรรม์และเดือนที่หมดอายุไว้กับเรา เราจะเตือนล่วงหน้า 60 วัน และสำหรับประกันรถยนต์จะช่วยเปรียบเทียบข้อเสนอใหม่เพื่อให้คุณพิจารณาว่าควรต่ออายุที่เดิมหรือเปลี่ยนทางเลือก โดยยังไม่ต้องส่งเอกสารในขั้นตอนนี้\",\"note\":\"เราใช้ข้อมูลนี้เพื่อแจ้งเตือนเฉพาะเรื่องที่คุณขอ ไม่ส่งโปรโมชั่น และคุณสามารถยกเลิกการแจ้งเตือนได้ทุกเมื่อ\"},\"en\":{\"kicker\":\"Advance reminders · stop any time\",\"title\":\"Let us keep track of\\nyour renewal dates\",\"body\":\"Tell us the policy type and expiry month. We will remind you 60 days in advance and, for motor insurance, provide a fresh comparison for the coming renewal. No documents are required at this stage.\",\"note\":\"We use the information only for the reminders you request. We do not send promotional messages, and you can stop reminders at any time.\"},\"items\":[{\"icon\":\"bell\",\"th\":{\"title\":\"เตือน 60 วันก่อน\",\"body\":\"มีเวลาพอสำหรับเปรียบเทียบข้อเสนอ ต่ออายุ หรือเปลี่ยนบริษัทประกันโดยไม่เร่งรีบ\"},\"en\":{\"title\":\"Sixty days ahead\",\"body\":\"Enough time to compare options, renew or switch insurers without rushing.\"}},{\"icon\":\"compare\",\"th\":{\"title\":\"มาพร้อมข้อมูลใหม่\",\"body\":\"สำหรับประกันรถยนต์ เราจะช่วยเปรียบเทียบข้อเสนอใหม่ในแต่ละปี เพราะราคาและเงื่อนไขอาจเปลี่ยนได้\"},\"en\":{\"title\":\"With updated options\",\"body\":\"For motor insurance, we can compare fresh offers each year because premiums and conditions may change.\"}},{\"icon\":\"lock\",\"th\":{\"title\":\"ใช้ข้อมูลเท่าที่จำเป็น\",\"body\":\"เริ่มจากประเภทกรมธรรม์ เดือนที่หมดอายุ และช่องทางติดต่อ โดยยังไม่ต้องส่งเลขกรมธรรม์หรือเลขบัตรประชาชน\"},\"en\":{\"title\":\"Only necessary data\",\"body\":\"We start with the policy type, expiry month and contact channel. No policy number or ID card number is needed at this stage.\"}}]},{\"id\":\"guides\",\"type\":\"guides\",\"on\":true,\"bg\":\"surface\",\"cols\":2,\"th\":{\"kicker\":\"อ่านก่อนตัดสินใจ\",\"title\":\"สี่เรื่องที่ควรรู้\\nก่อนเลือกประกัน\",\"body\":\"สรุปประเด็นสำคัญที่มักถูกมองข้าม เพื่อช่วยให้คุณตั้งคำถามและตรวจสอบเงื่อนไขก่อนตัดสินใจ\"},\"en\":{\"kicker\":\"Read before you decide\",\"title\":\"Four things to know\\nbefore choosing cover\",\"body\":\"Key points that are often missed, written to help you ask better questions and review conditions before deciding.\"},\"items\":[{\"th\":{\"label\":\"สุขภาพ\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ค่าห้องที่เลือกไว้ อาจไม่พอกับโรงพยาบาลที่คุณจะไปจริง\",\"body\":\"เวลาซื้อประกันสุขภาพ หลายคนเลือกค่าห้องตามเบี้ยที่จ่ายไหว แต่เมื่อป่วยจริง เรามักเลือกโรงพยาบาลที่ใกล้บ้านหรือแพทย์ที่ไว้วางใจ ไม่ใช่โรงพยาบาลที่ค่าห้องพอดีกับกรมธรรม์\\n\\nวิธีตรวจง่าย ๆ คือดูค่าห้องเดี่ยวต่อคืนของโรงพยาบาลที่คุณมีแนวโน้มใช้ แล้วเทียบกับตัวเลขในกรมธรรม์ หากกรมธรรม์ให้ 4,000 บาท แต่ค่าห้องจริง 6,500 บาท ส่วนต่าง 2,500 บาทต่อคืนอาจเป็นค่าใช้จ่ายที่ผู้เอาประกันต้องรับผิดชอบเอง ทั้งนี้ขึ้นอยู่กับเงื่อนไขกรมธรรม์\\n\\nแบบเหมาจ่ายด้วยวงเงินรวมช่วยลดข้อจำกัดจากการเพิ่มค่าห้องทีละขั้น เพราะไม่ต้องแยกดูวงเงินย่อยของแต่ละรายการมากเท่าเดิม\"},\"en\":{\"label\":\"Health\",\"meta\":\"2 min read\",\"title\":\"Your room benefit may not match the hospital you would actually use\",\"body\":\"When buying health insurance, many people choose a room benefit around the premium they can afford. But when illness happens, you usually choose the hospital near home or the doctor you trust, not the hospital whose room rate happens to match your policy.\\n\\nA simple check is to look up the private room rate at the hospital you are likely to use, then compare it with the figure on your policy. If the policy pays ฿4,000 and the room is ฿6,500, the ฿2,500 difference per night may be your responsibility, depending on policy terms.\\n\\nAn aggregate-limit plan can address this more directly than increasing the room benefit one step at a time, because fewer item-by-item caps need to be checked.\"}},{\"th\":{\"label\":\"รถยนต์\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ชั้น 3+ ไม่ได้คุ้มครองทุกการชน และนี่คือจุดที่มักพลาด\",\"body\":\"ประกันชั้น 3+ คุ้มครองความเสียหายต่อรถของคุณเมื่อชนกับ “ยานพาหนะทางบกที่มีคู่กรณีระบุได้” เงื่อนไขนี้สั้น แต่ตัดหลายเหตุการณ์ออกไป\\n\\nชนเสาไฟ ชนขอบทาง ถอยชนกำแพงบ้าน ชนสัตว์ที่วิ่งตัดหน้า หรือคู่กรณีหลบหนีและไม่สามารถระบุได้ อาจไม่เข้าเงื่อนไขความคุ้มครองรถของผู้เอาประกัน ส่วนความเสียหายต่อคู่กรณียังเป็นอีกเงื่อนไขหนึ่งตามกรมธรรม์\\n\\nหากรถยังผ่อนอยู่ หรือเป็นรถคันหลักที่ใช้ทำงาน ส่วนต่างเบี้ยระหว่างชั้น 3+ กับชั้น 1 อาจน้อยกว่าค่าซ่อมครั้งเดียวที่ต้องรับผิดชอบเอง ควรเปรียบเทียบตัวเลขจริงก่อนตัดสินใจ\"},\"en\":{\"label\":\"Motor\",\"meta\":\"2 min read\",\"title\":\"Class 3+ does not cover every collision — here is the common gap\",\"body\":\"Class 3+ covers damage to your car when it collides with an identified land vehicle. That condition is short, but it excludes many situations.\\n\\nHitting a lamp post, kerb or wall, striking an animal, or being hit by a driver who cannot be identified may fall outside own-car damage cover. Third-party liability is assessed under its own policy conditions.\\n\\nIf the car is still financed or is essential for work, the premium gap between Class 3+ and Class 1 may be smaller than one repair bill you would otherwise pay yourself. It is worth comparing the actual numbers before deciding.\"}},{\"th\":{\"label\":\"ชีวิต\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ทุนประกันชีวิตควรสะท้อนภาระทางการเงินและระยะเวลาที่ครอบครัวต้องพึ่งพารายได้\",\"body\":\"คำถามที่ตอบง่ายกว่า “ควรทำทุนเท่าไหร่” คือ “ถ้ารายได้หายไปพรุ่งนี้ คนที่บ้านต้องใช้เวลานานแค่ไหนก่อนยืนได้ด้วยตัวเอง”\\n\\nนำค่าใช้จ่ายบ้านต่อเดือนคูณจำนวนเดือนที่ต้องการดูแลต่อ บวกหนี้ที่ยังเหลือ เช่น บ้าน รถ และค่าเรียนของลูกที่ยังต้องจ่าย ตัวเลขนี้คือฐานสำหรับพิจารณาทุนประกัน ไม่จำเป็นต้องเป็นเลขกลมหรือเลขสวย\\n\\nหลายคนที่คำนวณแบบนี้พบว่าทุนเดิมอาจยังไม่พอ แต่ก็อาจพบว่าแบบชั่วระยะเวลา (term) ช่วยเติมส่วนที่ขาดได้ด้วยเบี้ยที่เข้าถึงได้กว่าที่คิด\"},\"en\":{\"label\":\"Life\",\"meta\":\"2 min read\",\"title\":\"A life sum assured should reflect debt and the time your family needs support\",\"body\":\"A more useful starting question is: if household income stopped tomorrow, how long would the family need before standing on its own?\\n\\nTake the household’s monthly costs, multiply by the number of months to protect, then add outstanding debts such as mortgage, car finance and future education costs. That figure is the starting point for the sum assured. It does not need to be round.\\n\\nMany people who calculate this way find their existing cover may be short, but term cover can often fill the gap for a more accessible premium than expected.\"}},{\"th\":{\"label\":\"ภาษี\",\"meta\":\"อ่าน 1 นาที\",\"title\":\"สิทธิลดหย่อนประกันมีสองกลุ่มหลัก คนมักใช้ไม่ครบ\",\"body\":\"เบี้ยประกันชีวิตทั่วไปลดหย่อนได้ถึง 100,000 บาท และเบี้ยประกันสุขภาพตนเองรวมอยู่ในเพดานนี้ได้ไม่เกิน 25,000 บาท\\n\\nประกันบำนาญเป็นอีกกลุ่มหนึ่งที่แยกออกมา ลดหย่อนเพิ่มได้ถึง 200,000 บาท โดยไม่เกิน 15% ของเงินได้ และเมื่อรวมกับ RMF กองทุนสำรองเลี้ยงชีพ และ กบข. ต้องไม่เกิน 500,000 บาท\\n\\nผู้ที่ใช้สิทธิ 100,000 บาทเต็มแล้วและยังต้องการวางแผนภาษีเพิ่มเติม มักไม่รู้ว่าสิทธิบำนาญยังอาจเหลืออยู่ ตัวเลขและเงื่อนไขของแต่ละปีควรตรวจสอบกับกรมสรรพากรก่อนยื่นภาษี\"},\"en\":{\"label\":\"Tax\",\"meta\":\"1 min read\",\"title\":\"Insurance-related tax deductions fall into two main categories\",\"body\":\"Ordinary life premiums are deductible up to ฿100,000, and your own health premiums can be included within that ceiling up to ฿25,000.\\n\\nAnnuity cover sits in a separate category: a further ฿200,000, capped at 15% of income and at ฿500,000 when combined with RMF and provident-fund contributions.\\n\\nPeople who have already used the ฿100,000 allowance and still want additional tax planning often do not realise the annuity allowance may remain available. Confirm the current-year figures and conditions with the Revenue Department before filing.\"}}]},{\"id\":\"voices\",\"type\":\"stories\",\"on\":false,\"bg\":\"bg\",\"cols\":3,\"th\":{\"kicker\":\"ประสบการณ์จากลูกค้า\",\"title\":\"ความคิดเห็นจากลูกค้า\",\"body\":\"เราจะเผยแพร่ความคิดเห็นจากลูกค้าที่ได้รับอนุญาตให้นำมาใช้ โดยไม่เปิดเผยข้อมูลส่วนบุคคลเกินความจำเป็น\",\"note\":\"ความคิดเห็นและผลลัพธ์ของแต่ละกรณีแตกต่างกัน และไม่ถือเป็นการรับประกันผลลัพธ์สำหรับกรณีอื่น\"},\"en\":{\"kicker\":\"Client experiences\",\"title\":\"What clients say\",\"body\":\"Client feedback will be published here only with permission and with appropriate protection of personal information.\",\"note\":\"Individual experiences and outcomes vary and do not guarantee the same result in another case.\"},\"items\":[{\"th\":{\"label\":\"รอความคิดเห็นจริง\",\"value\":\"เผยแพร่เมื่อได้รับอนุญาต\",\"valueNote\":\"ไม่เปิดเผยข้อมูลเกินจำเป็น\",\"title\":\"ความคิดเห็นจากลูกค้าจะเผยแพร่ที่นี่เมื่อได้รับอนุญาต\",\"body\":\"เราจะไม่ใช้ชื่อ รูปภาพ หรือรายละเอียดส่วนบุคคลโดยไม่ได้รับความยินยอม\",\"meta\":\"ตัวอย่างโครงสร้าง\"},\"en\":{\"label\":\"Awaiting real feedback\",\"value\":\"Published with permission\",\"valueNote\":\"Personal details protected\",\"title\":\"Client feedback will appear here once permission is granted.\",\"body\":\"We will not use names, photographs or personal details without consent.\",\"meta\":\"Placeholder structure\"}},{\"th\":{\"label\":\"รอความคิดเห็นจริง\",\"value\":\"เผยแพร่เมื่อได้รับอนุญาต\",\"valueNote\":\"ไม่เปิดเผยข้อมูลเกินจำเป็น\",\"title\":\"ความคิดเห็นจากลูกค้าจะเผยแพร่ที่นี่เมื่อได้รับอนุญาต\",\"body\":\"เราจะไม่ใช้ชื่อ รูปภาพ หรือรายละเอียดส่วนบุคคลโดยไม่ได้รับความยินยอม\",\"meta\":\"ตัวอย่างโครงสร้าง\"},\"en\":{\"label\":\"Awaiting real feedback\",\"value\":\"Published with permission\",\"valueNote\":\"Personal details protected\",\"title\":\"Client feedback will appear here once permission is granted.\",\"body\":\"We will not use names, photographs or personal details without consent.\",\"meta\":\"Placeholder structure\"}},{\"th\":{\"label\":\"รอความคิดเห็นจริง\",\"value\":\"เผยแพร่เมื่อได้รับอนุญาต\",\"valueNote\":\"ไม่เปิดเผยข้อม ue\":\"ไทย · English\"},\"en\":{\"label\":\"Languages\",\"value\":\"Thai · English\"}},{\"th\":{\"label\":\"พื้นที่ดูแล\",\"value\":\"กรุงเทพฯ และปริมณฑล\"},\"en\":{\"label\":\"Area\",\"value\":\"Bangkok & surrounding\"}}]},{\"id\":\"faq\",\"type\":\"faq\",\"on\":true,\"bg\":\"bg\",\"cols\":1,\"th\":{\"kicker\":\"คำถามที่ถูกถามบ่อย\",\"title\":\"คำถามที่พบบ่อย\",\"body\":\"\"},\"en\":{\"kicker\":\"Asked most often\",\"title\":\"Questions, answered plainly\",\"body\":\"\"},\"items\":[{\"th\":{\"q\":\"ต้องจ่ายค่าที่ปรึกษาให้ CoverMate ไหม\",\"a\":\"ไม่มีค่าที่ปรึกษาเพิ่มเติมจาก CoverMate ค่าตอบแทนในการให้บริการมาจากบริษัทประกันภัยเมื่อมีการออกกรมธรรม์ โดยเบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบริษัทประกันภัย\"},\"en\":{\"q\":\"Does CoverMate charge a consultation fee?\",\"a\":\"No additional consultation fee is charged by CoverMate. Compensation comes from the insurer when a policy is issued, and premiums follow the insurer’s filed rates and conditions.\"}},{\"th\":{\"q\":\"มีประกันอยู่แล้ว ย้ายมาให้ดูแลได้ไหม\",\"a\":\"สำหรับประกันรถยนต์สามารถเปลี่ยนนายหน้าได้เมื่อต่ออายุ ส่วนประกันชีวิตที่มีอยู่แล้วยังคงอยู่กับตัวแทนเดิม แต่เราสามารถช่วยตรวจทานกรมธรรม์เดิมให้โดยไม่มีค่าใช้จ่าย\"},\"en\":{\"q\":\"Can existing cover be transferred for review?\",\"a\":\"For motor insurance, the broker can usually be changed at renewal. Existing life policies remain with the original agent, but we can review them for gaps or overlap at no charge.\"}},{\"th\":{\"q\":\"จะถูกติดต่อซ้ำ ๆ หรือไม่\",\"a\":\"เราจะให้ข้อมูลที่เกี่ยวข้องและให้คุณตัดสินใจตามจังหวะของคุณ หากยังไม่ประสงค์ดำเนินการต่อ เราจะไม่ติดต่อเพื่อติดตามการขาย เว้นแต่คุณขอให้เราแจ้งเตือน\"},\"en\":{\"q\":\"Will CoverMate follow up repeatedly?\",\"a\":\"We provide the relevant information and let you decide at your own pace. If you prefer not to proceed, we will not follow up for sales unless you ask for a reminder.\"}},{\"th\":{\"q\":\"เบี้ยผ่าน CoverMate แพงกว่าซื้อออนไลน์ไหม\",\"a\":\"เบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบ
