ust started working\",\"icon\":\"sprout\",\"recs\":[{\"th\":\"เริ่มจากค่ารักษาและอุบัติเหตุ\",\"en\":\"Start with health and accident cover\",\"wth\":\"ช่วงเริ่มทำงานควรรักษาสภาพคล่องไว้ก่อน เครื่องมือนี้จึงแยกเงินก้อนชีวิตออกจากค่ารักษาและเงินพักฟื้น\",\"wen\":\"Early-career planning should protect cash flow first, so this tool separates life need, medical room gap and recovery buffer.\"},{\"th\":\"เพิ่มทุนชีวิตเมื่อมีคนพึ่งพารายได้\",\"en\":\"Increase life cover when others depend on you\",\"wth\":\"ทุนชีวิตควรอิงค่าใช้จ่ายจำเป็นและจำนวนปีที่ต้องดูแล ไม่ใช่ตัวคูณรายได้แบบตายตัว\",\"wen\":\"Life cover should follow essential spending and support years, not a fixed salary multiplier.\"},{\"th\":\"เช็กค่าห้องกับโรงพยาบาลที่ใช้จริง\",\"en\":\"Check room benefits against likely hospitals\",\"wth\":\"ส่วนต่างค่าห้องเป็นข้อมูลอ้างอิง ไม่ใช่จำนวนเงินที่ต้องจ่ายแน่นอน เพราะขึ้นกับเงื่อนไขกรมธรรม์\",\"wen\":\"The room gap is a reference, not a guaranteed bill, because policy terms decide the actual outcome.\"}]},\"family\":{\"th\":\"มีครอบครัว มีลูก\",\"en\":\"Family with kids\",\"icon\":\"users\",\"recs\":[{\"th\":\"คุ้มครองรายจ่ายบ้านหลายปี\",\"en\":\"Protect household spending for several years\",\"wth\":\"ใส่ค่าใช้จ่ายจำเป็นต่อเดือนและจำนวนปีที่อยากให้ครอบครัวยืนต่อได้ แล้วค่อยหักเงินสำรองหรือทุนเดิมที่กันไว้แล้ว\",\"wen\":\"Enter essential monthly spending and the years your family needs support, then subtract liquid assets and existing cover.\"},{\"th\":\"หนี้และค่าเรียนควรถูกนับแยก\",\"en\":\"Debts and education should be explicit\",\"wth\":\"หนี้บ้าน รถ หรือภาระอนาคตควรเป็นตัวเลขแยกจากค่าใช้จ่ายรายเดือน เพื่อไม่ให้ทุนชีวิตต่ำกว่าภาระจริง\",\"wen\":\"Mortgage, car debt and future obligations should be entered separately from monthly spending so life need is not understated.\"},{\"th\":\"โรคร้ายแรงคือเงินพักฟื้น\",\"en\":\"Critical illness is a recovery buffer\",\"wth\":\"เงินก้อนโรคร้ายแรงในเครื่องมือนี้อิงเดือนพักฟื้น ไม่ได้ผูกโรคใดโรคหนึ่งกับทุนตายตัว\",\"wen\":\"T \",\"body\":\"In an accident, it can be hard to decide what to do first. We have set out the key steps in order, then you can contact us for help coordinating with the insurer.\",\"note\":\"If you are unsure what to do, you can contact us for initial guidance at no charge, even if you are not yet a CoverMate client.\"},\"items\":[{\"icon\":\"alert\",\"th\":{\"title\":\"ดูคนก่อนดูรถ\",\"body\":\"มีใครเจ็บไหม ถ้าเจ็บโทร 1669 ทันที ย้ายรถออกจากช่องทางเดินรถถ้าขยับได้ เปิดไฟฉุกเฉิน ตั้งสามเหลี่ยม อย่ายืนอยู่บนถนน\"},\"en\":{\"title\":\"People before cars\",\"body\":\"Anyone hurt? Call 1669 immediately. Move the car out of live traffic if it can be moved, turn hazards on, set a warning triangle and avoid standing in the road.\"}},{\"icon\":\"camera\",\"th\":{\"title\":\"ถ่ายรูปก่อนขยับ\",\"body\":\"ถ่ายให้เห็นตำแหน่งรถทั้งสองคันพร้อมกัน ป้ายทะเบียนคู่กรณี ความเสียหายทุกด้าน และภาพกว้างให้เห็นถนนกับสัญญาณไฟ\"},\"en\":{\"title\":\"Photograph before moving\",\"body\":\"Take photos showing both vehicles in position, the other plate, all visible damage, and a wide view of the road and traffic signals.\"}},{\"icon\":\"phone\",\"th\":{\"title\":\"แจ้งบริษัทประกัน\",\"body\":\"โทรสายด่วนบริษัทที่หน้ากรมธรรม์ แจ้งเลขกรมธรรม์กับสถานที่ รอเจ้าหน้าที่มาออกใบเคลม อย่าตกลงจ่ายเงินสดกันเองข้างถนน\"},\"en\":{\"title\":\"Notify the insurer\",\"body\":\"Call the hotline shown on your policy with the policy number and location, then wait for the surveyor or claim slip. Avoid settling in cash at the roadside.\"}},{\"icon\":\"chat\",\"th\":{\"title\":\"ส่งเอกสารให้เรา\",\"body\":\"ส่งภาพถ่ายและใบเคลมทาง LINE เราจะช่วยติดตามและประสานงานกับบริษัทประกันภัยในประเด็นที่เกี่ยวข้อง เช่น อู่ซ่อม รถใช้ระหว่างซ่อม และค่าเสียหายส่วนแรกตามเงื่อนไขกรมธรรม์\"},\"en\":{\"title\":\"Send the documents to us\",\"body\":\"Send the photos and claim slip on LINE. We can help follow up and coordinate with the insurer on relevant issues such as garages, courtesy cars and excess amounts under the policy conditions.\"}}],\"cards\":[{\"th\":{\"kicker\":\"เจ็บ · ฉุกเฉิน\",\"title\":\"1669\",\"body\":\"ศูนย์การแพทย์ฉุกเฉิน · ฟรี ตลอด 24 ชม.\"},\"en\":{\"kicker\":\"Injury · emergency\",\"title\":\"1669\",\"body\":\"Emergency medical services · free, 24 hours\"}},{\"th\":{\"kicker\":\"ตำรวจ\",\"title\":\"191\",\"body\":\"เมื่อมีข้อพิพาท คู่กรณีหนี หรือต้องลงบันทึกประจำวัน\"},\"en\":{\"kicker\":\"Police\",\"title\":\"191\",\"body\":\"For disputes, a driver leaving the scene, or a police report\"}},{\"th\":{\"kicker\":\"อุบัติเหตุบนทางหลวง\",\"title\":\"1586\",\"body\":\"สายด่วนกรมทางหลวง · แจ้งเหตุและขอความช่วยเหลือบนถนน\"},\"en\":{\"kicker\":\"Highway incidents\",\"title\":\"1586\",\"body\":\"Department of Highways hotline · road incidents and assistance\"}},{\"th\":{\"kicker\":\"ร้องเรียนเรื่องประกัน\",\"title\":\"1186\",\"body\":\"สายด่วน คปภ. · เมื่อบริษัทประกันปฏิเสธหรือประวิงเวลา\"},\"en\":{\"kicker\":\"Insurance complaints\",\"title\":\"1186\",\"body\":\"OIC hotline · when an insurer refuses or delays\"}}]},{\"id\":\"renew\",\"type\":\"renew\",\"on\":true,\"bg\":\"sage\",\"cols\":3,\"th\":{\"kicker\":\"เตือนล่วงหน้า · ยกเลิกได้ทุกเมื่อ\",\"title\":\"ไม่ต้องกังวลเรื่องวันหมดอายุ\\nให้เราช่วยเตือนล่วงหน้า\",\"body\":\"แจ้งประเภทกรมธรรม์และเดือนที่หมดอายุไว้กับเรา เราจะเตือนล่วงหน้า 60 วัน และสำหรับประกันรถยนต์จะช่วยเปรียบเทียบข้อเสนอใหม่เพื่อให้คุณพิจารณาว่าควรต่ออายุที่เดิมหรือเปลี่ยนทางเลือก โดยยังไม่ต้องส่งเอกสารในขั้นตอนนี้\",\"note\":\"เราใช้ข้อมูลนี้เพื่อแจ้งเตือนเฉพาะเรื่องที่คุณขอ ไม่ส่งโปรโมชั่น และคุณสามารถยกเลิกการแจ้งเตือนได้ทุกเมื่อ\"},\"en\":{\"kicker\":\"Advance reminders · stop any time\",\"title\":\"Let us keep track of\\nyour renewal dates\",\"body\":\"Tell us the policy type and expiry month. We will remind you 60 days in advance and, for motor insurance, provide a fresh comparison for the coming renewal. No documents are required at this stage.\",\"note\":\"We use the information only for the reminders you request. We do not send promotional messages, and you can stop reminders at any time.\"},\"items\":[{\"icon\":\"bell\",\"th\":{\"title\":\"เตือน 60 วันก่อน\",\"body\":\"มีเวลาพอสำหรับเปรียบเทียบข้อเสนอ ต่ออายุ หรือเปลี่ยนบริษัทประกันโดยไม่เร่งรีบ\"},\"en\":{\"title\":\"Sixty days ahead\",\"body\":\"Enough time to compare options, renew or switch insurers without rushing.\"}},{\"icon\":\"compare\",\"th\":{\"title\":\"มาพร้อมข้อมูลใหม่\",\"body\":\"สำหรับประกันรถยนต์ เราจะช่วยเปรียบเทียบข้อเสนอใหม่ในแต่ละปี เพราะราคาและเงื่อนไขอาจเปลี่ยนได้\"},\"en\":{\"title\":\"With updated options\",\"body\":\"For motor insurance, we can compare fresh offers each year because premiums and conditions may change.\"}},{\"icon\":\"lock\",\"th\":{\"title\":\"ใช้ข้อมูลเท่าที่จำเป็น\",\"body\":\"เริ่มจากประเภทกรมธรรม์ เดือนที่หมดอายุ และช่องทางติดต่อ โดยยังไม่ต้องส่งเลขกรมธรรม์หรือเลขบัตรประชาชน\"},\"en\":{\"title\":\"Only necessary data\",\"body\":\"We start with the policy type, expiry month and contact channel. No policy number or ID card number is needed at this stage.\"}}]},{\"id\":\"guides\",\"type\":\"guides\",\"on\":true,\"bg\":\"surface\",\"cols\":2,\"th\":{\"kicker\":\"อ่านก่อนตัดสินใจ\",\"title\":\"สี่เรื่องที่ควรรู้\\nก่อนเลือกประกัน\",\"body\":\"สรุปประเด็นสำคัญที่มักถูกมองข้าม เพื่อช่วยให้คุณตั้งคำถามและตรวจสอบเงื่อนไขก่อนตัดสินใจ\"},\"en\":{\"kicker\":\"Read before you decide\",\"title\":\"Four things to know\\nbefore choosing cover\",\"body\":\"Key points that are often missed, written to help you ask better questions and review conditions before deciding.\"},\"items\":[{\"th\":{\"label\":\"สุขภาพ\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ค่าห้องที่เลือกไว้ อาจไม่พอกับโรงพยาบาลที่คุณจะไปจริง\",\"body\":\"เวลาซื้อประกันสุขภาพ หลายคนเลือกค่าห้องตามเบี้ยที่จ่ายไหว แต่เมื่อป่วยจริง เรามักเลือกโรงพยาบาลที่ใกล้บ้านหรือแพทย์ที่ไว้วางใจ ไม่ใช่โรงพยาบาลที่ค่าห้องพอดีกับกรมธรรม์\\n\\nวิธีตรวจง่าย ๆ คือดูค่าห้องเดี่ยวต่อคืนของโรงพยาบาลที่คุณมีแนวโน้มใช้ แล้วเทียบกับตัวเลขในกรมธรรม์ หากกรมธรรม์ให้ 4,000 บาท แต่ค่าห้องจริง 6,500 บาท ส่วนต่าง 2,500 บาทต่อคืนอาจเป็นค่าใช้จ่ายที่ผู้เอาประกันต้องรับผิดชอบเอง ทั้งนี้ขึ้นอยู่กับเงื่อนไขกรมธรรม์\\n\\nแบบเหมาจ่ายด้วยวงเงินรวมช่วยลดข้อจำกัดจากการเพิ่มค่าห้องทีละขั้น เพราะไม่ต้องแยกดูวงเงินย่อยของแต่ละรายการมากเท่าเดิม\"},\"en\":{\"label\":\"Health\",\"meta\":\"2 min read\",\"title\":\"Your room benefit may not match the hospital you would actually use\",\"body\":\"When buying health insurance, many people choose a room benefit around the premium they can afford. But when illness happens, you usually choose the hospital near home or the doctor you trust, not the hospital whose room rate happens to match your policy.\\n\\nA simple check is to look up the private room rate at the hospital you are likely to use, then compare it with the figure on your policy. If the policy pays ฿4,000 and the room is ฿6,500, the ฿2,500 difference per night may be your responsibility, depending on policy terms.\\n\\nAn aggregate-limit plan can address this more directly than increasing the room benefit one step at a time, because fewer item-by-item caps need to be checked.\"}},{\"th\":{\"label\":\"รถยนต์\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ชั้น 3+ ไม่ได้คุ้มครองทุกการชน และนี่คือจุดที่มักพลาด\",\"body\":\"ประกันชั้น 3+ คุ้มครองความเสียหายต่อรถของคุณเมื่อชนกับ “ยานพาหนะทางบกที่มีคู่กรณีระบุได้” เงื่อนไขนี้สั้น แต่ตัดหลายเหตุการณ์ออกไป\\n\\nชนเสาไฟ ชนขอบทาง ถอยชนกำแพงบ้าน ชนสัตว์ที่วิ่งตัดหน้า หรือคู่กรณีหลบหนีและไม่สามารถระบุได้ อาจไม่เข้าเงื่อนไขความคุ้มครองรถของผู้เอาประกัน ส่วนความเสียหายต่อคู่กรณียังเป็นอีกเงื่อนไขหนึ่งตามกรมธรรม์\\n\\nหากรถยังผ่อนอยู่ หรือเป็นรถคันหลักที่ใช้ทำงาน ส่วนต่างเบี้ยระหว่างชั้น 3+ กับชั้น 1 อาจน้อยกว่าค่าซ่อมครั้งเดียวที่ต้องรับผิดชอบเอง ควรเปรียบเทียบตัวเลขจริงก่อนตัดสินใจ\"},\"en\":{\"label\":\"Motor\",\"meta\":\"2 min read\",\"title\":\"Class 3+ does not cover every collision — here is the common gap\",\"body\":\"Class 3+ covers damage to your car when it collides with an identified land vehicle. That condition is short, but it excludes many situations.\\n\\nHitting a lamp post, kerb or wall, striking an animal, or being hit by a driver who cannot be identified may fall outside own-car damage cover. Third-party liability is assessed under its own policy conditions.\\n\\nIf the car is still financed or is essential for work, the premium gap between Class 3+ and Class 1 may be smaller than one repair bill you would otherwise pay yourself. It is worth comparing the actual numbers before deciding.\"}},{\"th\":{\"label\":\"ชีวิต\",\"meta\":\"อ่าน 2 นาที\",\"title\":\"ทุนประกันชีวิตควรสะท้อนภาระทางการเงินและระยะเวลาที่ครอบครัวต้องพึ่งพารายได้\",\"body\":\"คำถามที่ตอบง่ายกว่า “ควรทำทุนเท่าไหร่” คือ “ถ้ารายได้หายไปพรุ่งนี้ คนที่บ้านต้องใช้เวลานานแค่ไหนก่อนยืนได้ด้วยตัวเอง”\\n\\nนำค่าใช้จ่ายบ้านต่อเดือนคูณจำนวนเดือนที่ต้องการดูแลต่อ บวกหนี้ที่ยังเหลือ เช่น บ้าน รถ และค่าเรียนของลูกที่ยังต้องจ่าย ตัวเลขนี้คือฐานสำหรับพิจารณาทุนประกัน ไม่จำเป็นต้องเป็นเลขกลมหรือเลขสวย\\n\\nหลายคนที่คำนวณแบบนี้พบว่าทุนเดิมอาจยังไม่พอ แต่ก็อาจพบว่าแบบชั่วระยะเวลา (term) ช่วยเติมส่วนที่ขาดได้ด้วยเบี้ยที่เข้าถึงได้กว่าที่คิด\"},\"en\":{\"label\":\"Life\",\"meta\":\"2 min read\",\"title\":\"A life sum assured should reflect debt and the time your family needs support\",\"body\":\"A more useful starting question is: if household income stopped tomorrow, how long would the family need before standing on its own?\\n\\nTake the household’s monthly costs, multiply by the number of months to protect, then add outstanding debts such as mortgage, car finance and future education costs. That figure is the starting point for the sum assured. It does not need to be round.\\n\\nMany people who calculate this way find their existing cover may be short, but term cover can often fill the gap for a more accessible premium than expected.\"}},{\"th\":{\"label\":\"ภาษี\",\"meta\":\"อ่าน 1 นาที\",\"title\":\"สิทธิลดหย่อนประกันมีสองกลุ่มหลัก คนมักใช้ไม่ครบ\",\"body\":\"เบี้ยประกันชีวิตทั่วไปลดหย่อนได้ถึง 100,000 บาท และเบี้ยประกันสุขภาพตนเองรวมอยู่ในเพดานนี้ได้ไม่เกิน 25,000 บาท\\n\\nประกันบำนาญเป็นอีกกลุ่มหนึ่งที่แยกออกมา ลดหย่อนเพิ่มได้ถึง 200,000 บาท โดยไม่เกิน 15% ของเงินได้ และเมื่อรวมกับ RMF กองทุนสำรองเลี้ยงชีพ และ กบข. ต้องไม่เกิน 500,000 บาท\\n\\nผู้ที่ใช้สิทธิ 100,000 บาทเต็มแล้วและยังต้องการวางแผนภาษีเพิ่มเติม มักไม่รู้ว่าสิทธิบำนาญยังอาจเหลืออยู่ ตัวเลขและเงื่อนไขของแต่ละปีควรตรวจสอบกับกรมสรรพากรก่อนยื่นภาษี\"},\"en\":{\"label\":\"Tax\",\"meta\":\"1 min read\",\"title\":\"Insurance-related tax deductions fall into two main categories\",\"body\":\"Ordinary life premiums are deductible up to ฿100,000, and your own health premiums can be included within that ceiling up to ฿25,000.\\n\\nAnnuity cover sits in a separate category: a further ฿200,000, capped at 15% of income and at ฿500,000 when combined with RMF and provident-fund contributions.\\n\\nPeople who have already used the ฿100,000 allowance and still want additional tax planning often do not realise the annuity allowance may remain available. Confirm the current-year figures and conditions with the Revenue Department before filing.\"}}]},{\"id\":\"voices\",\"type\":\"stories\",\"on\":false,\"bg\":\"bg\",\"cols\":3,\"th\":{\"kicker\":\"ประสบการณ์จากลูกค้า\",\"title\":\"ความคิดเห็นจากลูกค้า\",\"body\":\"เราจะเผยแพร่ความคิดเห็นจากลูกค้าที่ได้รับอนุญาตให้นำมาใช้ โดยไม่เปิดเผยข้อมูลส่วนบุคคลเกินความจำเป็น\",\"note\":\"ความคิดเห็นและผลลัพธ์ของแต่ละกรณีแตกต่างกัน และไม่ถือเป็นการรับประกันผลลัพธ์สำหรับกรณีอื่น\"},\"en\":{\"kicker\":\"Client experiences\",\"title\":\"What clients say\",\"body\":\"Client feedback will be published here only with permission and with appropriate protection of personal information.\",\"note\":\"Individual experiences and outcomes vary and do not guarantee the same result in another case.\"},\"items\":[{\"th\":{\"label\":\"รอความคิดเห็นจริง\",\"value\":\"เผยแพร่เมื่อได้รับอนุญาต\",\"valueNote\":\"ไม่เปิดเผยข้อมูลเกินจำเป็น\",\"title\":\"ความคิดเห็นจากลูกค้าจะเผยแพร่ที่นี่เมื่อได้รับอนุญาต\",\"body\":\"เราจะไม่ใช้ชื่อ รูปภาพ หรือรายล งเลือก เงื่อนไข และข้อจำกัดให้ชัดเจน เพื่อให้คุณมีข้อมูลเพียงพอก่อนตัดสินใจ\\n\\nประกันชีวิตและสุขภาพดำเนินการผ่าน AIA ส่วนประกันรถยนต์ให้บริการในฐานะนายหน้า โดยเปรียบเทียบทางเลือกจากบริษัทประกันภัยตามความเหมาะสม\"},\"en\":{\"kicker\":\"About CoverMate\",\"title\":\"A considered approach\\nto protection\",\"body\":\"CoverMate was created after seeing how often people discover, only when they need to claim, that their cover does not match what they understood. Our approach is to explain options, conditions and limitations clearly so you have enough information before deciding.\\n\\nFor life and health insurance, we arrange cover through AIA. For motor insurance, we act in a broker capacity and compare suitable insurer options.\"},\"items\":[{\"th\":{\"label\":\"ความเชี่ยวชาญ\",\"value\":\"ชีวิต สุขภาพ และรถยนต์\"},\"en\":{\"label\":\"Focus\",\"value\":\"Life, health and motor\"}},{\"th\":{\"label\":\"ใบอนุญาต\",\"value\":\"ตัวแทนประกันชีวิต 6401006221 · นายหน้าประกันวินาศภัย 6804008544\"},\"en\":{\"label\":\"Licences\",\"value\":\"Life agent No. 6401006221 · Non-life broker No. 6804008544\"}},{\"th\":{\"label\":\"ภาษา\",\"value\":\"ไทย · English\"},\"en\":{\"label\":\"Languages\",\"value\":\"Thai · English\"}},{\"th\":{\"label\":\"พื้นที่ดูแล\",\"value\":\"กรุงเทพฯ และปริมณฑล\"},\"en\":{\"label\":\"Area\",\"value\":\"Bangkok & surrounding\"}}]},{\"id\":\"faq\",\"type\":\"faq\",\"on\":true,\"bg\":\"bg\",\"cols\":1,\"th\":{\"kicker\":\"คำถามที่ถูกถามบ่อย\",\"title\":\"คำถามที่พบบ่อย\",\"body\":\"\"},\"en\":{\"kicker\":\"Asked most often\",\"title\":\"Questions, answered plainly\",\"body\":\"\"},\"items\":[{\"th\":{\"q\":\"ต้องจ่ายค่าที่ปรึกษาให้ CoverMate ไหม\",\"a\":\"ไม่มีค่าที่ปรึกษาเพิ่มเติมจาก CoverMate ค่าตอบแทนในการให้บริการมาจากบริษัทประกันภัยเมื่อมีการออกกรมธรรม์ โดยเบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบริษัทประกันภัย\"},\"en\":{\"q\":\"Does CoverMate charge a consultation fee?\",\"a\":\"No additional consultation fee is charged by CoverMate. Compensation comes from the insurer when a policy is issued, and premiums follow the insurer’s filed rates and conditions.\"}},{\"th\":{\"q\":\"มีประกันอยู่แล้ว ย้ายมาให้ดูแลได้ไหม\",\"a\":\"สำหรับประกันรถยนต์สามารถเปลี่ยนนายหน้าได้เมื่อต่ออายุ ส่วนประกันชีวิตที่มีอยู่แล้วยังคงอยู่กับตัวแทนเดิม แต่เราสามารถช่วยตรวจทานกรมธรรม์เดิมให้โดยไม่มีค่าใช้จ่าย\"},\"en\":{\"q\":\"Can existing cover be transferred for review?\",\"a\":\"For motor insurance, the broker can usually be changed at renewal. Existing life policies remain with the original agent, but we can review them for gaps or overlap at no charge.\"}},{\"th\":{\"q\":\"จะถูกติดต่อซ้ำ ๆ หรือไม่\",\"a\":\"เราจะให้ข้อมูลที่เกี่ยวข้องและให้คุณตัดสินใจตามจังหวะของคุณ หากยังไม่ประสงค์ดำเนินการต่อ เราจะไม่ติดต่อเพื่อติดตามการขาย เว้นแต่คุณขอให้เราแจ้งเตือน\"},\"en\":{\"q\":\"Will CoverMate follow up repeatedly?\",\"a\":\"We provide the relevant information and let you decide at your own pace. If you prefer not to proceed, we will not follow up for sales unless you ask for a reminder.\"}},{\"th\":{\"q\":\"เบี้ยผ่าน CoverMate แพงกว่าซื้อออนไลน์ไหม\",\"a\":\"เบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบริษัทประกันภัย การใช้บริการผ่าน CoverMate ไม่มีค่าที่ปรึกษาเพิ่มเติม และเราช่วยเปรียบเทียบเงื่อนไขให้ก่อนตัดสินใจ\"},\"en\":{\"q\":\"Is it more expensive than buying online?\",\"a\":\"Premiums follow the insurer’s rates and conditions. Using CoverMate adds no separate consultation fee, and we help compare the conditions before you decide.\"}},{\"th\":{\"q\":\"เคลมยากไหม ถ้าเคลมแล้วไม่ได้ล่ะ\",\"a\":\"เมื่อเกิดการเคลม เราช่วยตรวจสอบเอกสารและประสานงานกับบริษัทประกันภัยตามขั้นตอน หากมีการปฏิเสธการเคลม เราสามารถช่วยตรวจสอบเหตุผลและประสานงานเรื่องการทบทวนหรืออุทธรณ์ตามช่องทางที่เกี่ยวข้อง\"},\"en\":{\"q\":\"What if a claim gets refused?\",\"a\":\"When a claim occurs, we can help check documents and coordinate with the insurer through the required process. If a claim is refused, we can review the reason and help with the relevant review or appeal channel.\"}}]},{\"id\":\"fees\",\"type\":\"fees\",\"on\":true,\"bg\":\"surface\",\"cols\":3,\"th\":{\"kicker\":\"โครงสร้างค่าตอบแทน · อธิบายอย่างชัดเจน\",\"title\":\"ค่าตอบแทนในการให้บริการ\\nมาจากไหน\",\"body\":\"ความโปร่งใสเรื่องค่าตอบแทนเป็นส่วนสำคัญของการให้คำแนะนำ เราจึงอธิบายไว้ล่วงหน้าว่าค่าตอบแทนในการให้บริการมาจากช่องทางใด\",\"note\":\"เบี้ยประกันเป็นอัตราที่บริษัทประกันภัยยื่นและได้รับความเห็นชอบจาก คปภ. การใช้บริการผ่าน CoverMate ไม่มีค่าที่ปรึกษาเพิ่มเติม\"},\"en\":{\"kicker\":\"Compensation structure · explained clearly\",\"title\":\"Where our\\nservice compensation comes from\",\"body\":\"Transparency about compensation is part of giving trustworthy advice. We explain in advance how CoverMate is compensated for the service.\",\"note\":\"Premiums are filed with and approved by the OIC. Using CoverMate adds no separate consultation fee.\"},\"cards\":[{\"n\":\"1\",\"th\":{\"kicker\":\"คุณจ่าย\",\"title\":\"เบี้ยประกัน\",\"body\":\"ชำระเบี้ยประกันให้บริษัทประกันภัยโดยตรง โดยไม่มีค่าที่ปรึกษาแยกต่างหากจาก CoverMate\"},\"en\":{\"kicker\":\"You pay\",\"title\":\"The premium\",\"body\":\"Premiums are paid to the insurer directly, with no separate advisory fee from CoverMate.\"}},{\"n\":\"2\",\"th\":{\"kicker\":\"บริษัทประกันภัยจ่าย\",\"title\":\"ค่าตอบแทนการให้บริการ\",\"body\":\"บริษัทประกันภัยเป็นผู้จ่ายค่าตอบแทนตามโครงสร้างของผลิตภัณฑ์ ซึ่งรวมอยู่ในอัตราเบี้ยประกันตามเงื่อนไขที่เกี่ยวข้อง\"},\"en\":{\"kicker\":\"The insurer pays\",\"title\":\"Service compensation\",\"body\":\"The insurer pays compensation according to the product structure, already reflected in the applicable premium rate.\"}},{\"n\":\"3\",\"th\":{\"kicker\":\"แปลว่า\",\"title\":\"ไม่มีค่าที่ปรึกษาเพิ่ม\",\"body\":\"การใช้บริการผ่าน CoverMate ไม่มีค่าที่ปรึกษาเพิ่มเติม และเรายังคงช่วยดูแลเรื่องการต่ออายุและการประสานงานเมื่อเกิดการเคลม\"},\"en\":{\"kicker\":\"Which means\",\"title\":\"No extra advisory fee\",\"body\":\"Using CoverMate adds no separate advisory fee, while we continue helping with umstances. Consider your goals, health, age and existing cover before choosing a plan.\"],[\"method\",\"ดูวิธีคำนวณ\",\"How this is calculated\"],[\"methodBody\",\"ตัวเลขแสดงตามค่าที่คำนวณได้ ไม่ปัดเป็นหลักแสน ผลลัพธ์ไม่ต่ำกว่าศูนย์ เป็นแนวทางวางแผน ไม่ใช่การรับประกันความเพียงพอ\",\"Amounts are calculated without rounding to a lump sum and cannot be negative. This is a planning guide, not a guarantee of sufficient cover.\"],[\"cta\",\"ให้ CoverMate ช่วยดูต่อ\",\"Talk it through with CoverMate\"],[\"baht\",\"บาท\",\"THB\"],[\"perMonth\",\"บาท/เดือน\",\"THB/mo\"],[\"years\",\"ปี\",\"years\"],[\"months\",\"เดือน\",\"months\"],[\"perDay\",\"บาท/วัน\",\"THB/day\"],[\"spendingHelp\",\"ค่าใช้จ่ายจำเป็นของครอบครัวที่ต้องการให้มีเงินรองรับ ไม่ใช่รายได้ทั้งหมด\",\"Essential household spending to support, not your total income.\"],[\"yearsHelp\",\"เลือกระยะเวลาจากตัวเลือกที่กำหนดไว้สำหรับการวางแผน\",\"Choose a planning period from the configured options.\"],[\"debtHelp\",\"รวมยอดหนี้คงเหลือและภาระในอนาคตที่ต้องการเตรียมไว้\",\"Remaining debt and future obligations you want to fund.\"],[\"resourcesHelp\",\"รวมเงินสำรองและทุนประกันเดิมที่กันไว้ใช้กับความต้องการนี้ โดยไม่หักซ้ำ\",\"Earmarked assets and existing cover for this need. Do not deduct them twice.\"],[\"roomHelp\",\"ค่าห้องต่อวันที่กรมธรรม์เดิมมีสิทธิคุ้มครองตามเงื่อนไข\",\"Eligible daily room benefit under your existing policy terms.\"],[\"recoveryHelp\",\"จำนวนเดือนที่ต้องการให้เงินรองรับค่าใช้จ่ายระหว่างพักฟื้น\",\"Months of essential spending you want to fund during recovery.\"],[\"photoAlt\",\"\",\"\"],[\"lifeResult\",\"ทุนประกันชีวิตส่วนที่ยังขาด\",\"Life cover shortfall\"],[\"ciResult\",\"เงินก้อนโรคร้ายแรงส่วนที่ยังขาด\",\"Critical illness funding shortfall\"],[\"healthResult\",\"ภาพรวมความคุ้มครองสุขภาพของคุณ\",\"Your health cover overview\"],[\"netMonthlyNeed\",\"ค่าใช้จ่ายสุทธิต่อเดือน\",\"Net monthly spending\"],[\"roomGap\",\"ส่วนต่างค่าห้องต่อวัน\",\"Daily room difference\"],[\"monthlyNeed\",\"ค่าใช้จ่ายที overed conditions, disease stages and each policy's terms.\"],[\"healthQuestions\",\"สิ่งที่ควรถามต่อ\",\"Questions to review\"],[\"lifeMethod\",\"ค่าใช้จ่ายสุทธิ = ค่าใช้จ่ายต่อเดือน หักรายได้ที่ยังได้รับ (ขั้นต่ำ 0) คูณ 12 และจำนวนปี บวกหนี้และภาระเงินก้อน แล้วหักสินทรัพย์และทุนชีวิตเดิม ไม่รวมเงินเฟ้อ ผลตอบแทน หรือภาระที่ไม่ได้กรอก\",\"Net spending is monthly spending minus continuing income, with a floor of 0. Multiply by 12 and years, add debt and additional obligations, then deduct earmarked assets and existing life cover. Inflation, investment returns and unentered obligations are excluded.\"],[\"ciMethod\",\"ค่าใช้จ่ายต่อเดือน หักรายได้ที่ยังได้รับ (ขั้นต่ำ 0) คูณจำนวนเดือน บวกค่าใช้จ่ายเพิ่มเติม แล้วหักเงินสำรองและเงินก้อนโรคร้ายแรงเดิม ไม่ได้ประมาณค่ารักษาหรือสิทธิการเคลม\",\"Subtract continuing support from monthly spending (minimum 0), multiply by months, add extra recovery costs, then deduct available funds and existing critical illness cover. This does not predict treatment bills or claim eligibility.\"],[\"healthMethod\",\"เทียบค่าห้องอ้างอิงกับสิทธิค่าห้องเดิมเท่านั้น หากมีส่วนต่างหรือร่วมจ่าย ควรตรวจเพิ่ม หากข้อมูลไม่ครบ ยังสรุปไม่ได้ เงินที่พร้อมจ่ายเองไม่ถูกหักจากค่าห้องต่อวัน เพราะเป็นคนละหน่วย\",\"Compare the reference room rate with existing daily room benefits. A gap or cost-sharing prompts further review; missing details prevent a conclusion. A per-episode budget is not deducted from a daily room rate.\"],[\"privacy\",\"คำนวณได้โดยไม่ต้องให้ข้อมูลติดต่อ ข้อมูลอยู่บนหน้านี้เท่านั้น หากขอคำแนะนำต่อ สรุปจะถูกแนบไว้และส่งเมื่อคุณยินยอมและกดส่งฟอร์ม\",\"No contact details are needed to calculate. Figures stay on this page. Continuing prepares an attachment that is sent only when you consent and submit the contact form.\"],[\"pending\",\"กำลังคำนวณ\",\"Updating estimate\"],[\"completePrompt\",\"กรอกข้อมูลหลักให้ครบเพื่อดูผลประเมิน\",\"Complete the core fields to see your estimate\"],[\"invalid\",\"กรุณาใส่ตัวเลขจำนวนเต็ม\",\"Please enter a whole nu
