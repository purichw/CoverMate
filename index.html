document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }
  const BOOT_ATTR = 'data-covermate-booting';
  const BOOT_GUARD_ID = 'covermate-hydration-guard';
  const FIRST_BOOT_REVEAL_MS = 4500;
  const SWAPPED_BOOT_REVEAL_MS = 1200;
  const PUBLIC_REMOTE_TIMEOUT_MS = 1500;
  const OWNER_REMOTE_TIMEOUT_MS = 9000;
  let revealTimer = 0;
  function scheduleReveal(ms) {
    try { if (revealTimer) window.clearTimeout(revealTimer); } catch (err) {}
    revealTimer = window.setTimeout(revealCoverMate, ms);
  }
  function revealCoverMate() {
    try { if (revealTimer) window.clearTimeout(revealTimer); } catch (err) {}
    revealTimer = 0;
    try {
      const guard = document.getElementById(BOOT_GUARD_ID);
      if (guard) guard.remove();
      if (document.documentElement) document.documentElement.removeAttribute(BOOT_ATTR);
      if (document.body) {
        document.body.style.removeProperty('visibility');
        document.body.style.removeProperty('color');
      }
    } catch (err) {
      /* Keep fallback reveal non-fatal. */
    }
  }
  scheduleReveal(FIRST_BOOT_REVEAL_MS);
  function installTemplateGuard(source) {
    const guard =
      '<style id="' + BOOT_GUARD_ID + '">' +
      'html,body{min-height:100%;background:#f5ead8!important}' +
      'html[data-covermate-booting="true"] body{visibility:hidden!important;color:transparent!important}' +
      'html[data-covermate-booting="true"] body>*{visibility:hidden!important}' +
      '</style>';
    const headOpen = source.match(/<head[^>]*>/i);
    if (!headOpen) return guard + source;
    const i = headOpen.index + headOpen[0].length;
    return source.slice(0, i) + guard + source.slice(i);
  }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 "Google Sans","Google Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    function restoreTemplateResourceRefs(value) {
      return value.replace(/__COVERMATE_RESOURCE_([0-9A-F]{8})_([0-9A-F]{4})_([0-9A-F]{4})_([0-9A-F]{4})_([0-9A-F]{12})__/g,
        function(_, a, b, c, d, e) { return [a, b, c, d, e].join('-').toLowerCase(); });
    }
    function restoreManifestResourceRefs(value) {
      const out = {};
      Object.keys(value || {}).forEach(function(key) {
        out[restoreTemplateResourceRefs(key)] = value[key];
      });
      return out;
    }

    const manifest = restoreManifestResourceRefs(JSON.parse(manifestEl.textContent));
    let template = JSON.parse(templateEl.textContent);
    template = restoreTemplateResourceRefs(template)
      .replace(/__COVERMATE_SCRIPT_OPEN__/g, '<script')
      .replace(/__COVERMATE_SCRIPT_SRC_ATTR__/g, 'src');
    async function hydrateCoverMateContent() {
      if (!/^https?:$/.test(window.location.protocol)) return;
      const contract = window.CoverMateContract || {};
      const ownerPaths = contract.ADMIN_OWNER_PATHS || ['/admin/content', '/admin/edit', '/admin/preview'];
      const ownerHashes = contract.OWNER_HASHES ? Array.from(contract.OWNER_HASHES) : ['#admin', '#edit', '#preview'];
      const normalizedPath = (window.location.pathname || '').replace(/\/+$/, '') || '/';
      const ownerPath = contract.isOwnerPath
        ? contract.isOwnerPath(window.location.pathname)
        : ownerPaths.indexOf(normalizedPath) >= 0;
      const ownerHash = contract.isOwnerHash
        ? contract.isOwnerHash(window.location.hash)
        : ownerHashes.indexOf(window.location.hash) >= 0;
      const owner = ownerPath || ownerHash;
      if (owner) {
        const session = contract.readAdminSession
          ? contract.readAdminSession()
          : (() => {
              try {
                const raw = window.localStorage.getItem('covermate-admin-session');
                const parsed = raw ? JSON.parse(raw) : null;
                return parsed && Number(parsed.exp || 0) > Date.now() ? parsed : null;
              } catch (err) {
                return null;
              }
            })();
        if (!session) {
          window.location.replace('/admin/login');
          return new Promise(() => {});
        }
      } else if (contract.clearAdminChromeState) {
        contract.clearAdminChromeState();
      }
      const timeoutMs = owner ? OWNER_REMOTE_TIMEOUT_MS : PUBLIC_REMOTE_TIMEOUT_MS;
      let timeoutId = 0;
      const timeout = new Promise((resolve) => {
        timeoutId = window.setTimeout(() => resolve({ timedOut: true }), timeoutMs);
      });
      const remote = (async () => {
        setStatus('Loading latest content...');
        await import(window.location.origin + '/covermate-firebase.js');
        if (window.CoverMateFirebase && window.CoverMateFirebase.hydrateLocalContent) {
          return window.CoverMateFirebase.hydrateLocalContent({ draft: owner, versions: owner });
        }
        return null;
      })();
      try {
        const result = await Promise.race([remote, timeout]);
        if (result && result.timedOut) {
          window.__covermateRemoteContent = { source: 'timeout', timeoutMs };
          remote.then((lateResult) => {
            if (!lateResult || (!lateResult.live && !lateResult.draft)) return;
            window.__covermateLateRemoteContent = lateResult;
            window.dispatchEvent(new CustomEvent('covermate:remote-content-ready', { detail: lateResult }));
          }).catch(() => {});
          console.warn('[covermate] Remote content still loading; rendering temporary local cache.');
        }
      } catch (err) {
        window.__covermateRemoteContent = { source: 'fallback', error: err && err.message ? err.message : String(err) };
        console.warn('[covermate] Remote content unavailable; using local cold-start cache.', err);
      } finally {
        if (timeoutId) window.clearTimeout(timeoutId);
      }
    }
    await hydrateCoverMateContent();

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent).map(restoreTemplateResourceRefs) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows third-party preview hosts to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);

\n        \"kicker\": \"เตือนล่วงหน้า · ยกเลิกได้ทุกเมื่อ\",\n        \"title\": \"ไม่ต้องกังวลเรื่องวันหมดอายุ\\nให้เราช่วยเตือนล่วงหน้า\",\n        \"body\": \"แจ้งประเภทกรมธรรม์และเดือนที่หมดอายุไว้กับเรา เราจะเตือนล่วงหน้า 60 วัน และสำหรับประกันรถยนต์จะช่วยเปรียบเทียบข้อเสนอใหม่เพื่อให้คุณพิจารณาว่าควรต่ออายุที่เดิมหรือเปลี่ยนทางเลือก โดยยังไม่ต้องส่งเอกสารในขั้นตอนนี้\",\n        \"note\": \"เราใช้ข้อมูลนี้เพื่อแจ้งเตือนเฉพาะเรื่องที่คุณขอ ไม่ส่งโปรโมชั่น และคุณสามารถยกเลิกการแจ้งเตือนได้ทุกเมื่อ\"\n      },\n      \"en\": {\n        \"kicker\": \"Advance reminders · stop any time\",\n        \"title\": \"Let us keep track of\\nyour renewal dates\",\n        \"body\": \"Tell us the policy type and expiry month. We will remind you 60 days in advance and, for motor insurance, provide a fresh comparison for the coming renewal. No documents are required at this stage.\",\n        \"note\": \"We use the information only for the reminders you request. We do not send promotional messages, and you can stop reminders at any time.\"\n      },\n      \"items\": [\n        {\n          \"icon\": \"bell\",\n          \"th\": {\n            \"title\": \"เตือน 60 วันก่อน\",\n            \"body\": \"มีเวลาพอสำหรับเปรียบเทียบข้อเสนอ ต่ออายุ หรือเปลี่ยนบริษัทประกันโดยไม่เร่งรีบ\"\n          },\n          \"en\": {\n            \"title\": \"Sixty days ahead\",\n            \"body\": \"Enough time to compare options, renew or switch insurers without rushing.\"\n          }\n        },\n        {\n          \"icon\": \"compare\",\n          \"th\": {\n            \"title\": \"มาพร้อมข้อมูลใหม่\",\n            \"body\": \"สำหรับประกันรถยนต์ เราจะช่วยเปรียบเทียบข้อเสนอใหม่ในแต่ละปี เพราะราคาและเงื่อนไขอาจเปลี่ยนได้\"\n          },\n          \"en\": {\n            \"title\": \"With updated options\",\n            \"body\": \"For motor insurance, we can compare fresh offers each year because premiums and conditions may change.\"\n          }\n        },\n        {\n          \"icon\": \"lock\",\n          \"th\": {\n            \"title\": \"ใช้ข้อมูลเท่าที่จำเป็น\",\n            \"body\": \"เริ่มจากประเภทกรมธรรม์ เดือนที่หมดอายุ และช่องทางติดต่อ โดยยังไม่ต้องส่งเลขกรมธรรม์หรือเลขบัตรประชาชน\"\n          },\n          \"en\": {\n            \"title\": \"Only necessary data\",\n            \"body\": \"We start with the policy type, expiry month and contact channel. No policy number or ID card number is needed at this stage.\"\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"guides\",\n      \"type\": \"guides\",\n      \"on\": true,\n      \"bg\": \"surface\",\n      \"cols\": 2,\n      \"th\": {\n        \"kicker\": \"อ่านก่อนตัดสินใจ\",\n        \"title\": \"สี่เรื่องที่ควรรู้\\nก่อนเลือกประกัน\",\n        \"body\": \"สรุปประเด็นสำคัญที่มักถูกมองข้าม เพื่อช่วยให้คุณตั้งคำถามและตรวจสอบเงื่อนไขก่อนตัดสินใจ\"\n      },\n      \"en\": {\n        \"kicker\": \"Read before you decide\",\n        \"title\": \"Four things to know\\nbefore choosing cover\",\n        \"body\": \"Key points that are often missed, written to help you ask better questions and review conditions before deciding.\"\n      },\n      \"items\": [\n        {\n          \"th\": {\n            \"label\": \"สุขภาพ\",\n            \"meta\": \"อ่าน 2 นาที\",\n            \"title\": \"ค่าห้องที่เลือกไว้ อาจไม่พอกับโรงพยาบาลที่คุณจะไปจริง\",\n            \"body\": \"เวลาซื้อประกันสุขภาพ หลายคนเลือกค่าห้องตามเบี้ยที่จ่ายไหว แต่เมื่อป่วยจริง เรามักเลือกโรงพยาบาลที่ใกล้บ้านหรือแพทย์ที่ไว้วางใจ ไม่ใช่โรงพยาบาลที่ค่าห้องพอดีกับกรมธรรม์\\n\\nวิธีตรวจง่าย ๆ คือดูค่าห้องเดี่ยวต่อคืนของโรงพยาบาลที่คุณมีแนวโน้มใช้ แล้วเทียบกับตัวเลขในกรมธรรม์ หากกรมธรรม์ให้ 4,000 บาท แต่ค่าห้องจริง 6,500 บาท ส่วนต่าง 2,500 บาทต่อคืนอาจเป็นค่าใช้จ่ายที่ผู้เอาประกันต้องรับผิดชอบเอง ทั้งนี้ขึ้นอยู่กับเงื่อนไขกรมธรรม์\\n\\nแบบเหมาจ่ายด้วยวงเงินรวมช่วยลดข้อจำกัดจากการเพิ่มค่าห้องทีละขั้น เพราะไม่ต้องแยกดูวงเงินย่อยของแต่ละรายการมากเท่าเดิม\"\n          },\n          \"en\": {\n            \"label\": \"Health\",\n            \"meta\": \"2 min read\",\n            \"title\": \"Your room benefit may not match the hospital you would actually use\",\n            \"body\": \"When buying health insurance, many people choose a room benefit around the premium they can afford. But when illness happens, you usually choose the hospital near home or the doctor you trust, not the hospital whose room rate happens to match your policy.\\n\\nA simple check is to look up the private room rate at the hospital you are likely to use, then compare it with the figure on your policy. If the policy pays ฿4,000 and the room is ฿6,500, the ฿2,500 difference per night may be your responsibility, depending on policy terms.\\n\\nAn aggregate-limit plan can address this more directly than increasing the room benefit one step at a time, because fewer item-by-item caps need to be checked.\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"รถยนต์\",\n            \"meta\": \"อ่าน 2 นาที\",\n            \"title\": \"ชั้น 3+ ไม่ได้คุ้มครองทุกการชน และนี่คือจุดที่มักพลาด\",\n            \"body\": \"ประกันชั้น 3+ คุ้มครองความเสียหายต่อรถของคุณเมื่อชนกับ “ยานพาหนะทางบกที่มีคู่กรณีระบุได้” เงื่อนไขนี้สั้น แต่ตัดหลายเหตุการณ์ออกไป\\n\\nชนเสาไฟ ชนขอบทาง ถอยชนกำแพงบ้าน ชนสัตว์ที่วิ่งตัดหน้า หรือคู่กรณีหลบหนีและไม่สามารถระบุได้ อาจไม่เข้าเงื่อนไขความคุ้มครองรถของผู้เอาประกัน ส่วนความเสียหายต่อคู่กรณียังเป็นอีกเงื่อนไขหนึ่งตามกรมธรรม์\\n\\nหากรถยังผ่อนอยู่ หรือเป็นรถคันหลักที่ใช้ทำงาน ส่วนต่างเบี้ยระหว่างชั้น 3+ กับชั้น 1 อาจน้อยกว่าค่าซ่อมครั้งเดียวที่ต้องรับผิดชอบเอง ควรเปรียบเทียบตัวเลขจริงก่อนตัดสินใจ\"\n          },\n          \"en\": {\n            \"label\": \"Motor\",\n            \"meta\": \"2 min read\",\n            \"title\": \"Class 3+ does not cover every collision — here is the common gap\",\n            \"body\": \"Class 3+ covers damage to your car when it collides with an identified land vehicle. That condition is short, but it excludes many situations.\\n\\nHitting a lamp post, kerb or wall, striking an animal, or being hit by a driver who cannot be identified may fall outside own-car damage cover. Third-party liability is assessed under its own policy conditions.\\n\\nIf the car is still financed or is essential for work, the premium gap between Class 3+ and Class 1 may be smaller than one repair bill you would otherwise pay yourself. It is worth comparing the actual numbers before deciding.\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"ชีวิต\",\n            \"meta\": \"อ่าน 2 นาที\",\n            \"title\": \"ทุนประกันชีวิตควรสะท้อนภาระทางการเงินและระยะเวลาที่ครอบครัวต้องพึ่งพารายได้\",\n            \"body\": \"คำถามที่ตอบง่ายกว่า “ควรทำทุนเท่าไหร่” คือ “ถ้ารายได้หายไปพรุ่งนี้ คนที่บ้านต้องใช้เวลานานแค่ไหนก่อนยืนได้ด้วยตัวเอง”\\n\\nนำค่าใช้จ่ายบ้านต่อเดือนคูณจำนวนเดือนที่ต้องการดูแลต่อ บวกหนี้ที่ยังเหลือ เช่น บ้าน รถ และค่าเรียนของลูกที่ยังต้องจ่าย ตัวเลขนี้คือฐานสำหรับพิจารณาทุนประกัน ไม่จำเป็นต้องเป็นเลขกลมหรือเลขสวย\\n\\nหลายคนที่คำนวณแบบนี้พบว่าทุนเดิมอาจยังไม่พอ แต่ก็อาจพบว่าแบบชั่วระยะเวลา (term) ช่วยเติมส่วนที่ขาดได้ด้วยเบี้ยที่เข้าถึงได้กว่าที่คิด\"\n          },\n          \"en\": {\n            \"label\": \"Life\",\n            \"meta\": \"2 min read\",\n            \"title\": \"A life sum assured should reflect debt and the time your family needs support\",\n            \"body\": \"A more useful starting question is: if household income stopped tomorrow, how long would the family need before standing on its own?\\n\\nTake the household’s monthly costs, multiply by the number of months to protect, then add outstanding debts such as mortgage, car finance and future education costs. That figure is the starting point for the sum assured. It does not need to be round.\\n\\nMany people who calculate this way find their existing cover may be short, but term cover can often fill the gap for a more accessible premium than expected.\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"ภาษี\",\n            \"meta\": \"อ่าน 1 นาที\",\n            \"title\": \"สิทธิลดหย่อนประกันมีสองกลุ่มหลัก คนมักใช้ไม่ครบ\",\n            \"body\": \"เบี้ยประกันชีวิตทั่วไปลดหย่อนได้ถึง 100,000 บาท และเบี้ยประกันสุขภาพตนเองรวมอยู่ในเพดานนี้ได้ไม่เกิน 25,000 บาท\\n\\nประกันบำนาญเป็นอีกกลุ่มหนึ่งที่แยกออกมา ลดหย่อนเพิ่มได้ถึง 200,000 บาท โดยไม่เกิน 15% ของเงินได้ และเมื่อรวมกับ RMF กองทุนสำรองเลี้ยงชีพ และ กบข. ต้องไม่เกิน 500,000 บาท\\n\\nผู้ที่ใช้สิทธิ 100,000 บาทเต็มแล้วและยังต้องการวางแผนภาษีเพิ่มเติม มักไม่รู้ว่าสิทธิบำนาญยังอาจเหลืออยู่ ตัวเลขและเงื่อนไขของแต่ละปีควรตรวจสอบกับกรมสรรพากรก่อนยื่นภาษี\"\n          },\n          \"en\": {\n            \"label\": \"Tax\",\n            \"meta\": \"1 min read\",\n            \"title\": \"Insurance-related tax deductions fall into two main categories\",\n            \"body\": \"Ordinary life premiums are deductible up to ฿100,000, and your own health premiums can be included within that ceiling up to ฿25,000.\\n\\nAnnuity cover sits in a separate category: a further ฿200,000, capped at 15% of income and at ฿500,000 when combined with RMF and provident-fund contributions.\\n\\nPeople who have already used the ฿100,000 allowance and still want additional tax planning often do not realise the annuity allowance may remain available. Confirm the current-year figures and conditions with the Revenue Department before filing.\"\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"voices\",\n      \"type\": \"stories\",\n      \"on\": false,\n      \"bg\": \"bg\",\n      \"cols\": 3,\n      \"th\": {\n        \"kicker\": \"ประสบการณ์จากลูกค้า\",\n        \"title\": \"ความคิดเห็นจากลูกค้า\",\n        \"body\": \"เราจะเผยแพร่ความคิดเห็นจากลูกค้าที่ได้รับอนุญาตให้นำมาใช้ โดยไม่เปิดเผยข้อมูลส่วนบุคคลเกินความจำเป็น\",\n        \"note\": \"ความคิดเห็นและผลลัพธ์ของแต่ละกรณีแตกต่างกัน และไม่ถือเป็นการรับประกันผลลัพธ์สำหรับกรณีอื่น\"\n      },\n      \"en\": {\n        \"kicker\": \"Cl s and limitations clearly so you have enough information before deciding.\\n\\nFor life and health insurance, we arrange cover through AIA. For motor insurance, we act in a broker capacity and compare suitable insurer options.\"\n      },\n      \"items\": [\n        {\n          \"th\": {\n            \"label\": \"ความเชี่ยวชาญ\",\n            \"value\": \"ชีวิต สุขภาพ และรถยนต์\"\n          },\n          \"en\": {\n            \"label\": \"Focus\",\n            \"value\": \"Life, health and motor\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"ใบอนุญาต\",\n            \"value\": \"ตัวแทนประกันชีวิต 6401006221 · นายหน้าประกันวินาศภัย 6804008544\"\n          },\n          \"en\": {\n            \"label\": \"Licences\",\n            \"value\": \"Life agent No. 6401006221 · Non-life broker No. 6804008544\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"ภาษา\",\n            \"value\": \"ไทย · English\"\n          },\n          \"en\": {\n            \"label\": \"Languages\",\n            \"value\": \"Thai · English\"\n          }\n        },\n        {\n          \"th\": {\n            \"label\": \"พื้นที่ดูแล\",\n            \"value\": \"กรุงเทพฯ และปริมณฑล\"\n          },\n          \"en\": {\n            \"label\": \"Area\",\n            \"value\": \"Bangkok & surrounding\"\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"faq\",\n      \"type\": \"faq\",\n      \"on\": true,\n      \"bg\": \"bg\",\n      \"cols\": 1,\n      \"th\": {\n        \"kicker\": \"คำถามที่ถูกถามบ่อย\",\n        \"title\": \"คำถามที่พบบ่อย\",\n        \"body\": \"\"\n      },\n      \"en\": {\n        \"kicker\": \"Asked most often\",\n        \"title\": \"Questions, answered plainly\",\n        \"body\": \"\"\n      },\n      \"items\": [\n        {\n          \"th\": {\n            \"q\": \"ต้องจ่ายค่าที่ปรึกษาให้ CoverMate ไหม\",\n            \"a\": \"ไม่มีค่าที่ปรึกษาเพิ่มเติมจาก CoverMate ค่าตอบแทนในการให้บริการมาจากบริษัทประกันภัยเมื่อมีการออกกรมธรรม์ โดยเบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบริษัทประกันภัย\"\n          },\n          \"en\": {\n            \"q\": \"Does CoverMate charge a consultation fee?\",\n            \"a\": \"No additional consultation fee is charged by CoverMate. Compensation comes from the insurer when a policy is issued, and premiums follow the insurer’s filed rates and conditions.\"\n          }\n        },\n        {\n          \"th\": {\n            \"q\": \"มีประกันอยู่แล้ว ย้ายมาให้ดูแลได้ไหม\",\n            \"a\": \"สำหรับประกันรถยนต์สามารถเปลี่ยนนายหน้าได้เมื่อต่ออายุ ส่วนประกันชีวิตที่มีอยู่แล้วยังคงอยู่กับตัวแทนเดิม แต่เราสามารถช่วยตรวจทานกรมธรรม์เดิมให้โดยไม่มีค่าใช้จ่าย\"\n          },\n          \"en\": {\n            \"q\": \"Can existing cover be transferred for review?\",\n            \"a\": \"For motor insurance, the broker can usually be changed at renewal. Existing life policies remain with the original agent, but we can review them for gaps or overlap at no charge.\"\n          }\n        },\n        {\n          \"th\": {\n            \"q\": \"จะถูกติดต่อซ้ำ ๆ หรือไม่\",\n            \"a\": \"เราจะให้ข้อมูลที่เกี่ยวข้องและให้คุณตัดสินใจตามจังหวะของคุณ หากยังไม่ประสงค์ดำเนินการต่อ เราจะไม่ติดต่อเพื่อติดตามการขาย เว้นแต่คุณขอให้เราแจ้งเตือน\"\n          },\n          \"en\": {\n            \"q\": \"Will CoverMate follow up repeatedly?\",\n            \"a\": \"We provide the relevant information and let you decide at your own pace. If you prefer not to proceed, we will not follow up for sales unless you ask for a reminder.\"\n          }\n        },\n        {\n          \"th\": {\n            \"q\": \"เบี้ยผ่าน CoverMate แพงกว่าซื้อออนไลน์ไหม\",\n            \"a\": \"เบี้ยประกันเป็นไปตามอัตราและเงื่อนไขของบริษัทประกันภัย การใช้บริการผ่าน CoverMate ไม่มีค่าที่ปรึกษาเพิ่มเติม และเราช่วยเปรียบเทียบเงื่อนไขให้ก่อนตัดสินใจ\"\n          },\n          \"en\": {\n            \"q\": \"Is it more expensive than buying online?\",\n            \"a\": \"Premiums follow the insurer’s rates and conditions. Using CoverMate adds no separate consultation fee, and we help compare the conditions before you decide.\"\n          }\n        },\n        {\n          \"th\": {\n            \"q\": \"เคลมยากไหม ถ้าเคลมแล้วไม่ได้ล่ะ\",\n            \"a\": \"เมื่อเกิดการเคลม เราช่วยตรวจสอบเอกสารและประสานงานกับบริษัทประกันภัยตามขั้นตอน หากมีการปฏิเสธการเคลม เราสามารถช่วยตรวจสอบเหตุผลและประสานงานเรื่องการทบทวนหรืออุทธรณ์ตามช่องทางที่เกี่ยวข้อง\"\n          },\n          \"en\": {\n            \"q\": \"What if a claim gets refused?\",\n            \"a\": \"When a claim occurs, we can help check documents and coordinate with the insurer through the required process. If a claim is refused, we can review the reason and help with the relevant review or appeal channel.\"\n          }\n        }\n      ]\n    },\n    {\n      \"id\": \"fees\",\n      \"type\": \"fees\",\n      \"on\": true,\n      \"bg\": \"surface\",\n      \"cols\": 3,\n      \"th\": {\n        \"kicker\": \"โครงสร้างค่าตอบแทน · อธิบายอย่างชัดเจน\",\n        \"title\": \"ค่าตอบแทนในการให้บริการ\\nมาจากไหน\",\n        \"body\": \"ความโปร่งใสเรื่องค่าตอบแทนเป็นส่วนสำคัญของการให้คำแนะนำ เราจึงอธิบายไว้ล่วงหน้าว่าค่าตอบแทนในการให้บริการมาจากช่องทางใด\",\n        \"note\": \"เบี้ยประกันเป็นอัตราที่บริษัทประกันภัยยื่นและได้รับความเห็นชอบจาก คปภ. การใช้บริการผ่าน CoverMate ไม่มีค่าที่ปรึกษาเพิ่มเติม\"\n      },\n      \"en\": {\n        \"kicker\": \"Compensation structure · explained clearly\",\n        \"title\": \"Where our\\nservice compensation comes from\",\n        \"body\": \"Transparency about compensation is part of giving trustworthy advice. We explain in advance how CoverMate is compensated for the service.\",\n        \"note\": \"Premiums are filed with and approved by the OIC. Using CoverMate adds no separate consultation fee.\"\n      },\n      \"cards\": [\n        {\n          \"n\": \"1\",\n          \"th\": {\n            \"kicker\":
