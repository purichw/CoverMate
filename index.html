r-neutral-700);text-transform:capitalize\">{{ accentName }}</span>\n</div>\n\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:var(--space-3)\">SEO</div>\n<label style=\"display:flex;flex-direction:column;gap:5px\"><span style=\"font-size:11.5px;font-weight:700;color:var(--color-neutral-700)\">ชื่อหน้าในผลค้นหา</span><input data-admin-seo-title=\"true\" value=\"{{ seoTitle }}\" sc-camel-on-change=\"{{ onSeoTitle }}\" style=\"font:inherit;font-size:14px;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--color-neutral-300);background:var(--color-surface);color:var(--color-text)\" style-focus=\"border-color:{{ A_base }}\"></label>\n<label style=\"display:flex;flex-direction:column;gap:5px\"><span style=\"font-size:11.5px;font-weight:700;color:var(--color-neutral-700)\">Meta description</span><textarea data-admin-seo-description=\"true\" rows=\"3\" value=\"{{ seoDescription }}\" sc-camel-on-change=\"{{ onSeoDescription }}\" style=\"font:inherit;font-size:14px;line-height:1.5;padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--color-neutral-300);background:var(--color-surface);color:var(--color-text);resize:vertical\" style-focus=\"border-color:{{ A_base }}\"></textarea></label>\n<div data-admin-seo-guard=\"true\" style=\"display:flex;flex-direction:column;gap:5px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--color-surface);border:1px solid var(--color-neutral-300)\"><span style=\"font-size:11.5px;font-weight:700;color:var(--color-neutral-700)\">Canonical / robots</span><span style=\"font-size:12.5px;line-height:1.55;color:var(--color-neutral-800)\">{{ seoCanonical }}</span><span style=\"font-size:12.5px;line-height:1.55;color:var(--color-neutral-800)\">{{ seoRobots }}</span></div>\n\n<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700);padding-top:var(--space-3)\">สำรองและกู้คืน</div>\n<div style=\"display:flex;gap:var(--space-2);flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ doExport }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;background:var(--color-neutral-900);color:var(--color-neutral-100);transition:background .2s ease\" style-hover=\"background:var(--color-neutral-800)\">Export JSON</button>\n<button type=\"button\" sc-camel-on-click=\"{{ doImport }}\" style=\"border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;background:var(--color-surface);color:var(--color-text);transition:background .2s ease\" style-hover=\"background:var(--color-neutral-300)\">Import JSON</button>\n</div>\n<textarea rows=\"12\" value=\"{{ io }}\" sc-camel-on-change=\"{{ onIo }}\" placeholder=\"กด Export เพื่อแสดงข้อมูลเว็บไซต์ หรือวาง JSON แล้วกด Import เพื่อนำเข้า\" style=\"font-family:\"Google Sans\",\"Google Sans Thai\",\"Noto Sans Thai\",system-ui,sans-serif;font-size:11.5px;line-height:1.5;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--color-neutral-300);background:var(--color-surface);color:var(--color-text);resize:vertical\" style-focus=\"border-color:{{ A_base }}\"></textarea>\n<div style=\"font-size:11.5px;line-height:1.55;color:var(--color-neutral-700)\">\n<sc-if value=\"{{ th }}\" hint-placeholder-val=\"{{ true }}\">ข้อมูลจริงอยู่ใน Firestore เป็นหลัก Export/Import ใช้สำหรับสำรองหรือย้าย draft เท่านั้น</sc-if><sc-if value=\"{{ en }}\" hint-placeholder-val=\"{{ false }}\">ข้อมูลหลักอยู่ใน Firestore ใช้ Export/Import สำหรับสำรองหรือย้าย Draft เท่านั้น</sc-if>\n</div>\n</sc-if>\n\n\n<sc-if value=\"{{ tabVersions }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"cm-versions\" data-versions-workspace>\n<div class=\"cm-versions-heading\"><h3>ประวัติเวอร์ชัน</h3><button type=\"button\" class=\"cm-editor-icon-button\" title=\"โหลดประวัติใหม่\" aria-label=\"โหลดประวัติใหม่\" disabled=\"{{ versionsBusy }}\" sc-camel-on-click=\"{{ refreshVersions }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 11a9 9 0 1 1 2.6 7M3 4v7h7\"></path></svg></button></div>\n<sc-if value=\"{{ versionsReady }}\">\n<div class=\"cm-versions-overview\">\n<section><span class=\"cm-version-symbol\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5\"></path></svg></span><div><h4>ฉบับร่างปัจจุบัน</h4><strong>Draft</strong><p>{{ versionDraftStatus }}</p></div></section>\n<section><span class=\"cm-version-symbol\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M2 12h20M12 2a17 17 0 0 1 0 20 17 17 0 0 1 0-20\"></path></svg></span><div><h4>เวอร์ชันที่เผยแพร่</h4><strong>Live</strong><p>{{ versionLiveStamp }}</p></div></section>\n</div>\n<p class=\"cm-versions-scope\">ประวัติ Publish หน้าเว็บ 20 รายการ · แยกจากบทความ</p>\n<div class=\"cm-versions-filters\" role=\"group\" aria-label=\"กรองประวัติเวอร์ชัน\"><sc-for list=\"{{ versionsFilters }}\" as=\"filter\"><button type=\"button\" aria-pressed=\"{{ filter.active }}\" sc-camel-on-click=\"{{ filter.choose }}\">{{ filter.label }} <span>{{ filter.count }}</span></button></sc-for></div>\n<div class=\"cm-versions-tools\">\n<label class=\"cm-editor-search\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"10.5\" cy=\"10.5\" r=\"7.5\"></circle><path d=\"m16 16 5 5\"></path></svg><input type=\"search\" aria-label=\"ค้นหาประวัติเวอร์ชัน\" placeholder=\"ค้นหาเวอร์ชัน ผู้บันทึก หรือส่วนที่แก้ไข\" value=\"{{ versionsQuery }}\" sc-camel-on-input=\"{{ onVersionsQuery }}\"></label>\n<label class=\"cm-editor-field\"><span>เรียงตาม</span><select aria-label=\"เรียงประวัติเวอร์ชัน\" value=\"{{ versionsSort }}\" sc-camel-on-change=\"{{ onVersionsSort }}\"><option value=\"newest\">ล่าสุดก่อน</option><option value=\"oldest\">เก่าสุดก่อน</option></select></label>\n</div>\n</sc-if>\n<sc-if value=\"{{ versionsBusy }}\"><p class=\"cm-version-notice\" role=\"status\">กำลังโหลดประวัติเวอร์ชัน…</p></sc-if>\n<sc-if value=\"{{ versionsFailed }}\"><div class=\"cm-version-notice cm-version-notice--error\" role=\"alert\"><strong>โหลดประวัติไม่สำเร็จ</strong><p>{{ versionsError }} รายการที่มีอยู่อาจไม่ใช่ข้อมูลล่าสุด</p><button type=\"button\" class=\"cm-editor-button\" sc-camel-on-click=\"{{ refreshVersions }}\">ลองใหม่</button></div></sc-if>\n<sc-if value=\"{{ versionsEmpty }}\"><div class=\"cm-version-empty\"><h4>ยังไม่มีประวัติการเผยแพร่</h4><p>เวอร์ชันจะถูกบันทึกเมื่อ Publish เว็บไซต์</p></div></sc-if>\n<sc-if value=\"{{ versionsNoMatch }}\"><div class=\"cm-version-empty\"><h4>ไม่พบเวอร์ชันที่ตรงกัน</h4><button type=\"button\" class=\"cm-editor-button\" sc-camel-on-click=\"{{ clearVersionsFilters }}\">ล้างตัวกรอง</button></div></sc-if>\n<sc-if value=\"{{ versionsHasRows }}\">\n<div class=\"cm-versions-list\" role=\"list\" aria-label=\"รายการประวัติเวอร์ชัน\">\n<div class=\"cm-version-columns\" aria-hidden=\"true\"><span>เวอร์ชัน / วันที่</span><span>ผู้บันทึก / ส่วนที่เปลี่ยน</span><span>การจัดการ</span></div>\n<sc-for list=\"{{ versionsRows }}\" as=\"v\"><article class=\"cm-version-row\" role=\"listitem\" data-version-id=\"{{ v.id }}\" data-selected=\"{{ v.selected }}\">\n<div class=\"cm-version-identity\"><strong title=\"{{ v.id }}\">#{{ v.shortId }}</strong><span class=\"cm-version-badge\" data-live=\"{{ v.isLive }}\">{{ v.status }}</span><time>{{ v.stamp }}</time></div>\n<div class=\"cm-version-description\"><p>{{ v.summary }}</p><span>{{ v.actor }}</span></div>\n<button type=\"button\" class=\"cm-editor-button\" sc-camel-on-click=\"{{ v.open }}\">ดูรายละเอียด<svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"></path></svg></button>\n</article></sc-for>\n</div>\n<div class=\"cm-versions-pagination\"><span>{{ versionsRange }}</span><sc-if value=\"{{ versionsHasPages }}\"><div><button type=\"button\" class=\"cm-editor-icon-button\" aria-label=\"เวอร์ชันหน้าก่อน\" title=\"เวอร์ชันหน้าก่อน\" disabled=\"{{ versionsPrevDisabled }}\" sc-camel-on-click=\"{{ versionsPrev }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"></path></svg></button><button type=\"button\" class=\"cm-editor-icon-button\" aria-label=\"เวอร์ชันหน้าถัดไป\" title=\"เวอร์ชันหน้าถัดไป\" disabled=\"{{ versionsNextDisabled }}\" sc-camel-on-click=\"{{ versionsNext }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5 7 7-7 7\"></path></svg></button></div></sc-if></div>\n</sc-if>\n<p class=\"cm-version-notice\">การกู้คืนจะเปลี่ยนเฉพาะ Draft เว็บจริงยังคงเดิมจนกด Publish</p>\n</div>\n\n</sc-if>\n</div>\n\n\n<footer class=\"cm-editor-footer\">\n<details class=\"cm-editor-footer-more\"><summary><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 6h16M4 12h16M4 18h16\"></path></svg>เพิ่มเติม</summary><div class=\"cm-editor-footer-menu\"><button type=\"button\" sc-camel-on-click=\"{{ openEdit }}\">แก้ไขข้อความบนเว็บ</button><a href=\"/admin\">หน้า Admin</a><button type=\"button\" sc-camel-on-click=\"{{ goPublicSite }}\">ดูเว็บจริง</button><button type=\"button\" sc-camel-on-click=\"{{ signOut }}\">ออกจากระบบ</button></div></details>\n<div class=\"cm-editor-history\" role=\"group\" aria-label=\"ย้อนการแก้ไข Draft\">\n<button type=\"button\" data-editor-undo aria-label=\"Undo\" aria-disabled=\"{{ editorUndoDisabled }}\" title=\"{{ editorUndoTitle }}\" sc-camel-on-click=\"{{ editorUndo }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12\"></path></svg>Undo</button>\n<button type=\"button\" data-editor-redo aria-label=\"Redo\" aria-disabled=\"{{ editorRedoDisabled }}\" title=\"{{ editorRedoTitle }}\" sc-camel-on-click=\"{{ editorRedo }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m15 4 5 5-5 5M20 9H10a6 6 0 0 0 0 12\"></path></svg>Redo</button>\n<button type=\"button\" data-editor-reset sc-camel-on-click=\"{{ requestResetDraft }}\" title=\"กลับไปยัง Publish ล่าสุด · เว็บจริงไม่เปลี่ยน\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 11a9 9 0 1 1 2.6 7M3 4v7h7\"></path></svg>Reset draft</button>\n</div>\n</footer>\n</aside>\n</sc-if>\n\n<sc-if value=\"{{ showVersionDetail }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"cm-version-backdrop\" data-noedit=\"true\">\n<section class=\"cm-version-dialog\" data-version-dialog role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"version-detail-title\">\n<header><div><h2 id=\"version-detail-title\">รายละเอียดเวอร์ชัน</h2><p>#{{ versionDetail.shortId }} · {{ versionDetail.stamp }}</p></div><button type=\"button\" class=\"cm-editor-icon-button\" data-version-close aria-label=\"ปิดรายละเอียดเวอร์ชัน\" sc-camel-on-click=\"{{ closeVersionDetail }}\"><svg sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m6 6 12 12M18 6 6 18\"></path></svg></button></header>\n<div class=\"cm-version-dialog-body\">\n<div class=\"cm-version-detail-meta\"><span class=\"cm-version-badge\" data-live=\"{{ versionDetail.isLive }}\">{{ versionDetail.status }}</span><span>โดย {{ versionDetail.actor }}</span></div>\n<p class=\"cm-version-full-id\">รหัสเวอร์ชัน: {{ versionDetail.id }}</p>\n<sc-if value=\"{{ versionDetail.hasOrigin }}\"><p>{{ versionDetail.origin }}</p></sc-if>\n<div class=\"cm-version-compare-toolbar\"><h3>เปรียบเทียบเนื้อหา <small>{{ versionDifferenceCount }} จุด</small></h3><label class=\"cm-editor-field\"><span>เทียบกับ</span><select aria-label=\"เปรียบเทียบเวอร์ชันกับ\" value=\"{{ versionCompare }}\" sc-camel-on-change=\"{{ onVersionCompare }}\"><option value=\"draft\">Draft ปัจจุบัน</option><option value=\"live\">Live ปัจจุบัน</option></select></label></div>\n<sc-if value=\"{{ versionSame }}\"><p class=\"cm-version-notice\">เนื้อหาเหมือนกับ {{ versionCompareLabel }}</p></sc-if>\n<div class=\"c bligations that would fall to the family should be added as future obligations, not blended into household spending.\"},{\"th\":\"เงินสดสำรองช่วยลดช่องว่างได้\",\"en\":\"Earmarked liquidity reduces the gap\",\"wth\":\"เงินสำรองที่ตั้งใจใช้เพื่อครอบครัวหรือธุรกิจในกรณีฉุกเฉินสามารถนำมาหักได้ แต่เงินทุนหมุนเวียนที่ต้องใช้ทำงานไม่ควรนับซ้ำ\",\"wen\":\"Earmarked emergency liquidity can reduce the gap, but working capital needed by the business should not be double-counted.\"},{\"th\":\"ตรวจ health limit แยกจากทุนชีวิต\",\"en\":\"Review health limits separately from life cover\",\"wth\":\"ค่ารักษาไม่ควรถูกนำไปคูณเป็นทุนชีวิต แต่ควรตรวจเป็น room gap และเงื่อนไขกรมธรรม์แยกต่างหาก\",\"wen\":\"Medical costs should not drive life cover. Review room gap and policy wording separately.\"}]},\"retire\":{\"th\":\"ใกล้เกษียณ\",\"en\":\"Near retirement\",\"icon\":\"clock\",\"recs\":[{\"th\":\"ลดทุนชีวิตเมื่อภาระลดลง\",\"en\":\"Reduce life cover as obligations fall\",\"wth\":\"ถ้าหนี้และคนพึ่งพิงลดลง ทุนชีวิตอาจไม่ต้องสูงเท่าช่วงสร้างครอบครัว แต่สุขภาพและเงินพักฟื้นยังควรตรวจละเอียด\",\"wen\":\"As debts and dependants fall, life cover may not need to be as high as before, while health and recovery buffers deserve closer review.\"},{\"th\":\"ค่าห้องควรตรงกับโรงพยาบาลที่ใช้จริง\",\"en\":\"Room benefits should match likely hospitals\",\"wth\":\"เลือกค่าห้องจากโรงพยาบาลที่มีแนวโน้มใช้จริง แล้วดูว่าส่วนต่างที่ต้องเตรียมรับได้หรือไม่\",\"wen\":\"Choose a likely hospital reference and check whether the resulting room gap is acceptable.\"},{\"th\":\"กันเงินพักฟื้นที่ไม่ใช่ค่ารักษา\",\"en\":\"Set aside non-medical recovery cash\",\"wth\":\"ช่วงพักฟื้นยังมีค่าเดินทาง คนดูแล และรายได้ที่อาจลดลง ซึ่งไม่ใช่ค่ารักษาโดยตรง\",\"wen\":\"Recovery may require transport, caregiving and income replacement beyond hospital bills.\"}]}},\"life\":{\"engineVersion\":\"1.0.0\",\"formula\":\"essential_monthly_household_spending * 12 * support_years + outstanding_debts + future_obligations + transition_final_cos  to decide what to do first. We have set out the key steps in order, then you can contact us for help coordinating with the insurer.\",\"note\":\"If you are unsure what to do, you can contact us for initial guidance at no charge, even if you are not yet a CoverMate client.\"},\"items\":[{\"icon\":\"alert\",\"th\":{\"title\":\"ดูคนก่อนดูรถ\",\"body\":\"มีใครเจ็บไหม ถ้าเจ็บโทร 1669 ทันที ย้ายรถออกจากช่องทางเดินรถถ้าขยับได้ เปิดไฟฉุกเฉิน ตั้งสามเหลี่ยม อย่ายืนอยู่บนถนน\"},\"en\":{\"title\":\"People before cars\",\"body\":\"Anyone hurt? Call 1669 immediately. Move the car out of live traffic if it can be moved, turn hazards on, set a warning triangle and avoid standing in the road.\"}},{\"icon\":\"camera\",\"th\":{\"title\":\"ถ่ายรูปก่อนขยับ\",\"body\":\"ถ่ายให้เห็นตำแหน่งรถทั้งสองคันพร้อมกัน ป้ายทะเบียนคู่กรณี ความเสียหายทุกด้าน และภาพกว้างให้เห็นถนนกับสัญญาณไฟ\"},\"en\":{\"title\":\"Photograph before moving\",\"body\":\"Take photos showing both vehicles in position, the other plate, all visible damage, and a wide view of the road and traffic signals.\"}},{\"icon\":\"phone\",\"th\":{\"title\":\"แจ้งบริษัทประกัน\",\"body\":\"โทรสายด่วนบริษัทที่หน้ากรมธรรม์ แจ้งเลขกรมธรรม์กับสถานที่ รอเจ้าหน้าที่มาออกใบเคลม อย่าตกลงจ่ายเงินสดกันเองข้างถนน\"},\"en\":{\"title\":\"Notify the insurer\",\"body\":\"Call the hotline shown on your policy with the policy number and location, then wait for the surveyor or claim slip. Avoid settling in cash at the roadside.\"}},{\"icon\":\"chat\",\"th\":{\"title\":\"ส่งเอกสารให้เรา\",\"body\":\"ส่งภาพถ่ายและใบเคลมทาง LINE เราจะช่วยติดตามและประสานงานกับบริษัทประกันภัยในประเด็นที่เกี่ยวข้อง เช่น อู่ซ่อม รถใช้ระหว่างซ่อม และค่าเสียหายส่วนแรกตามเงื่อนไขกรมธรรม์\"},\"en\":{\"title\":\"Send the documents to us\",\"body\":\"Send the photos and claim slip on LINE. We can help follow up and coordinate with the insurer on relevant issues such as garages, courtesy cars and excess amounts under the policy conditions.\"}}],\"cards\":[{\"th\":{\"kicker\":\"เจ็บ · ฉุกเฉิน\",\"title\":\"1669\",\"body\":\"ศูนย์การแพทย์ฉุกเฉิน · ฟรี ตลอด 24 ชม.\"},\"en\":{\"kicker\":\"Injury · emergency\",\"title\":\"1669\",\"body\":\"Emergency medical services · free, 24 hours\"}},{\"th\":{\"kicker\":\"ตำรวจ\",\"title\":\"191\",\"body\":\"เมื่อมีข้อพิพาท คู่กรณีหนี หรือต้องลงบันทึกประจำวัน\"},\"en\":{\"kicker\":\"Police\",\"title\":\"191\",\"body\":\"For disputes, a driver leaving the scene, or a police report\"}},{\"th\":{\"kicker\":\"อุบัติเหตุบนทางหลวง\",\"title\":\"1586\",\"body\":\"สายด่วนกรมทางหลวง · แจ้งเหตุและขอความช่วยเหลือบนถนน\"},\"en\":{\"kicker\":\"Highway incidents\",\"title\":\"1586\",\"body\":\"Department of Highways hotline · road incidents and assistance\"}},{\"th\":{\"kicker\":\"ร้องเรียนเรื่องประกัน\",\"title\":\"1186\",\"body\":\"สายด่วน คปภ. · เมื่อบริษัทประกันปฏิเสธหรือประวิงเวลา\"},\"en\":{\"kicker\":\"Insurance complaints\",\"title\":\"1186\",\"body\":\"OIC hotline · when an insurer refuses or delays\"}}]},{\"id\":\"renew\",\"type\":\"renew\",\"on\":true,\"bg\":\"sage\",\"cols\":3,\"th\":{\"kicker\":\"เตือนล่วงหน้า · ยกเลิกได้ทุกเมื่อ\",\"title\":\"ให้ช่วยเตือนวันต่ออายุประกันไหม?\",\"body\":\"แจ้งประเภทกรมธรรม์และเดือนที่หมดอายุไว้กับเรา เราจะเตือนล่วงหน้า 60 วัน และสำหรับประกันรถยนต์จะช่วยเปรียบเทียบข้อเสนอใหม่เพื่อให้คุณพิจารณาว่าควรต่ออายุที่เดิมหรือเปลี่ยนทางเลือก โดยยังไม่ต้องส่งเอกสารในขั้นตอนนี้\",\"note\":\"เราใช้ข้อมูลนี้เพื่อติดตามเรื่องต่ออายุที่คุณแจ้งไว้ หากไม่ต้องการให้เตือนต่อ บอกเราทาง LINE ได้\"},\"en\":{\"kicker\":\"Advance reminders · stop any time\",\"title\":\"Would you like a renewal reminder?\",\"body\":\"Tell us the policy type and expiry month. We will remind you 60 days in advance and, for motor insurance, provide a fresh comparison for the coming renewal. No documents are required at this stage.\",\"note\":\"We use these details to follow up on the renewal you requested. Let us know on LINE if you no longer want reminders.\"},\"items\":[{\"icon\":\"bell\",\"th\":{\"title\":\"แจ้งก่อนถึงวันต่ออายุ\",\"body\":\"ฝากเดือนที่กรมธรรม์หมดอายุไว้ เพื่อให้เราติดต่อกลับและช่วยเตรียมเรื่องต่ออายุ\"},\"en\":{\"title\":\"A reminder before renewal\",\"body\":\"Leave your expiry month so we can get in touch and help you prepare for renewal.\"}},{\"icon\":\"compare\",\"th\":{\"title\":\"ช่วยเปรียบเทียบอีกครั้ง\",\"body\":\"สำหรับรถยนต์ เราช่วยดูเบี้ยและเงื่อนไขที่เสนอในรอบต่ออายุ เทียบกับกรมธรรม์เดิมให้ได้\"},\"en\":{\"title\":\"Compare your options again\",\"body\":\"For car insurance, we can compare renewal quotes and terms with your current policy.\"}},{\"icon\":\"lock\",\"th\":{\"title\":\"ใช้ข้อมูลอะไรบ้าง?\",\"body\":\"เริ่มจากประเภทกรมธรรม์ เดือนที่หมดอายุ และช่องทางติดต่อ โดยยังไม่ต้องส่งเลขกรมธรรม์หรือเลขบัตรประชาชน\"},\"en\":{\"title\":\"What details do you need?\",\"body\":\"We start with the policy type, expiry month and contact channel. No policy number or ID card number is needed at this stage.\"}}]},{\"id\":\"guides\",\"type\":\"guides\",\"on\":true,\"bg\":\"surface\",\"cols\":2,\"th\":{\"kicker\":\"อ่านก่อนตัดสินใจ\",\"title\":\"สี่เรื่องที่ควรรู้\\nก่อนเลือกประกัน\",\"body\":\"สรุปประเด็นสำคัญที่มักถูกมองข้าม เพื่อช่วยให้คุณตั้งคำถามและตรวจสอบเงื่อนไขก่อนตัดสินใจ\"},\"en\":{\"kicker\":\"Read before you decide\",\"title\":\"Four things to know\\nbefore choosing cover\",\"body\":\"Key points that are often missed, written to help you ask better questions and review conditions before deciding.\"},\"items\":[{\"th\":{\"label\":\"สุขภาพ\",\"meta\":\"\",\"title\":\"ควรเลือกค่าห้องวันละเท่าไหร่?\",\"body\":\"ลองดูค่าห้องของโรงพยาบาลที่คุณมีแนวโน้มใช้ แล้วเทียบกับสวัสดิการและประกันที่มีอยู่ รวมถึงงบที่จ่ายเบี้ยไหว ต้องดูด้วยว่ากรมธรรม์กำหนดวงเงินค่าห้องและค่าใช้จ่ายส่วนอื่นไว้อย่างไร ไม่ใช่ดูตัวเลขค่าห้องอย่างเดียว\"},\"en\":{\"label\":\"Health\",\"meta\":\"\",\"title\":\"How much cover do I need for hospital room costs?\",\"body\":\"Check room rates at the hospital you are likely to use, then compare them with your existing benefits and premium budget. Also check how the policy limits room costs and other expenses, rather than looking at the room benefit alone.\"}},{\"th\":{\"label\":\"รถยนต์\",\"meta\":\"\",\"title\":\"ประกันชั้น 3+ ถ้าขับชนเอง เคลมได้ไหม?\",\"body\":\"โดยทั่วไป ความเสียหายของรถตัวเองในประกันชั้น 3+ ต้องเกิดจากการชนกับยานพาหนะและระบุคู่กรณีได้ หากชนเสาหรือกำแพงเอง มักไม่อยู่ในความคุ้มครองส่วนนี้ ควรตรวจเงื่อนไขกรมธรรม์ของคุณก่อนแจ้งเคลม\"},\"en\":{\"label\":\"Motor\",\"meta\":\"\",\"title\":\"Does Class 3+ cover an accident with no other vehicle involved?\",\"body\":\"Class 3+ generally covers damage to your own car only in a collision with an identified vehicle. Hitting a post or wall is generally not covered under this benefit. Check the terms of your own policy.\"}},{\"th\":{\"label\":\"ชีวิต\",\"meta\":\"\",\"title\":\"ควรทำประกันชีวิตวงเงินเท่าไหร่?\",\"body\":\"เริ่มจากดูว่ามีใครต้องพึ่งพารายได้ของคุณ มีหนี้หรือค่าใช้จ่ายที่ต้องดูแลเท่าไหร่ และต้องดูแลอีกนานแค่ไหน จากนั้นดูเงินออมและประกันที่มีอยู่ด้วย วงเงินที่เหมาะจะแตกต่างกัน และควรเลือกเบี้ยที่จ่ายต่อเนื่องไหว\"},\"en\":{\"label\":\"Life\",\"meta\":\"\",\"title\":\"How much life insurance do I need?\",\"body\":\"Consider who depends on your income, the debts and expenses they would need to cover, and for how long. Take your savings and existing insurance into account too. The amount will vary, and premiums need to remain affordable.\"}},{\"th\":{\"label\":\"ภาษี\",\"meta\":\"\",\"title\":\"ประกันแบบไหนลดหย่อนภาษีได้บ้าง?\",\"body\":\"ประกันชีวิต สุขภาพ และบำนาญบางแบบใช้ลดหย่อนได้เมื่อเข้าเงื่อนไขของกรมสรรพากร แต่แต่ละประเภทมีเพดานและเงื่อนไขต่างกัน ควรตรวจหนังสือรับรองเบี้ยประกันและหลักเกณฑ์ของปีภาษีที่จะยื่น หากไม่แน่ใจว่าเบี้ยส่วนไหนใช้สิทธิได้ ให้เราช่วยตรวจข้อมูลกับบริษัทประกันได้\"},\"en\":{\"label\":\"Tax\",\"meta\":\"\",\"title\":\"Which types of insurance qualify for tax deductions?\",\"body\":\"Some life, health and annuity policies qualify under Revenue Department rules. Limits and conditions differ. Check your premium certificate
