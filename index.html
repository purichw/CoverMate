  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 "Google Sans","Google Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    async function hydrateCoverMateContent() {
      if (!/^https?:$/.test(window.location.protocol)) return;
      const owner = ['#admin', '#edit', '#preview'].indexOf(window.location.hash) >= 0;
      if (owner) {
        try {
          const raw = window.localStorage.getItem('covermate-admin-session');
          const session = raw ? JSON.parse(raw) : null;
          if (!session || Number(session.exp || 0) <= Date.now()) {
            window.location.replace('/admin/login');
            return new Promise(() => {});
          }
        } catch (err) {
          window.location.replace('/admin/login');
          return new Promise(() => {});
        }
      }
      const timeoutMs = owner ? 9000 : 5000;
      let timeoutId = 0;
      const timeout = new Promise((resolve) => {
        timeoutId = window.setTimeout(() => resolve({ timedOut: true }), timeoutMs);
      });
      const remote = (async () => {
        setStatus('Loading latest content...');
        await import(window.location.origin + '/covermate-firebase.js');
        if (window.CoverMateFirebase && window.CoverMateFirebase.hydrateLocalContent) {
          return window.CoverMateFirebase.hydrateLocalContent({ draft: owner, versions: owner });
        }
        return null;
      })();
      try {
        const result = await Promise.race([remote, timeout]);
        if (result && result.timedOut) {
          window.__covermateRemoteContent = { source: 'timeout', timeoutMs };
          remote.catch(() => {});
          console.warn('[covermate] Remote content still loading; rendering local fallback cache.');
        }
      } catch (err) {
        window.__covermateRemoteContent = { source: 'fallback', error: err && err.message ? err.message : String(err) };
        console.warn('[covermate] Remote content unavailable; using local fallback cache.', err);
      } finally {
        if (timeoutId) window.clearTimeout(timeoutId);
      }
    }
    await hydrateCoverMateContent();

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);

tle: 'แต่ละชั้น\\nต่างกันตรงไหน', body: 'ทุกชั้นคุ้มครองคู่กรณีเหมือนกัน สิ่งที่ต่างคือรถของคุณเองได้รับความคุ้มครองมากน้อยแค่ไหน อ่านไล่จากซ้ายไปขวาได้เลย', note: 'ตารางนี้เป็นภาพรวมของเงื่อนไขมาตรฐาน วงเงินและข้อยกเว้นต่างกันไปตามกรมธรรม์ของแต่ละบริษัท ก่อนตัดสินใจผมอ่านเงื่อนไขจริงให้ฟังได้ ไม่มีค่าใช้จ่าย' },\n      en: { kicker: 'Motor insurance · comparing the classes', title: 'What actually differs\\nbetween the classes', body: 'Every class covers the other party the same way. What changes is how much of your own car is covered. Read across.', note: 'A standard-terms overview — limits and exclusions vary by insurer. Before you decide I will read the actual policy wording with you, at no charge.' },\n      heads: [\n        { th: 'คุ้มครองรถของผู้เอาประกัน', en: 'Your own car' },\n        { th: 'คุ้มครองคู่กรณี (ชีวิต/ทรัพย์สิน)', en: 'Third party (injury / property)' },\n        { th: 'คุ้มครองอุบัติเหตุส่วนบุคคล', en: 'Personal accident' },\n        { th: 'รถหาย / ไฟไหม้', en: 'Theft & fire' },\n        { th: 'คุ้มครองภัยธรรมชาติ', en: 'Flood & natural disaster' }\n      ],\n      items: [\n        { st: ['y', 'y', 'y', 'y', 'y'],\n          th: { label: 'ชั้น 1', note: '', value: 'เหมาะกับรถใหม่ หรือคนที่อยากคิดเรื่องนี้ให้น้อยที่สุด' },\n          en: { label: 'Class 1', note: '', value: 'New cars, or anyone who wants the least to think about' } },\n        { st: ['p', 'y', 'y', 'y', 'y'],\n          th: { label: 'ชั้น 2+', note: 'เฉพาะชนคู่กรณีที่ระบุได้', value: 'คุ้มค่าที่สุดสำหรับรถมูลค่าปานกลาง' },\n          en: { label: 'Class 2+', note: 'only when the other vehicle is identified', value: 'The best value for a mid-value car' } },\n        { st: ['n', 'y', 'y', 'y', 'n'],\n          th: { label: 'ชั้น 2', note: '', value: 'เหมาะกับรถที่ห่วงเรื่องหายหรือไฟไหม้ มากกว่าเรื่องชน' },\n          en: { label: 'Class 2', note: '', value: 'When theft or fire is the real worry, not collisions' } },\n        { st: ['p', 'y', 'y', 'n', 'n'],\n          th: { label: 'ชั้น 3+', note: 'เฉพาะชนคู่กรณีที่ระบุได้', value: 'ประหยัดงบ แต่ยังคุ้มครองส่วนที่จำเป็น' },\n          en: { label: 'Class 3+', note: 'only when the other vehicle is identified', value: 'The budget option, with the essentials still covered' } },\n        { st: ['n', 'y', 'y', 'n', 'n'],\n          th: { label: 'ชั้น 3', note: '', value: 'เหมาะกับรถใช้งานมานาน หรือรถที่มูลค่าไม่สูง' },\n          en: { label: 'Class 3', note: '', value: 'Older cars, or where the car is not worth much' } }\n      ] },\n    { id: 'claim', type: 'claim', on: true, bg: 'dark', cols: 4,\n      th: { kicker: 'เก็บหน้านี้ไว้ · ใช้ตอนตั้งตัวไม่ทัน', title: 'เกิดอุบัติเหตุ\\nทำอะไรก่อน', body: 'ตอนนั้นไม่มีใครคิดเป็นขั้นตอน เลยเขียนไว้ให้อ่านตอนนี้ — สี่อย่างนี้ทำตามลำดับ แล้วโทรบอกผม ที่เหลือผมประสานกับบริษัทให้', note: 'ถ้าไม่แน่ใจอะไรเลย โทรผมได้ก่อน แม้ยังไม่ได้แจ้งบริษัท ผมจะบอกว่าต้องทำอะไรต่อ — ไม่มีค่าใช้จ่าย และไม่ต้องเป็นลูกค้าผม' },\n      en: { kicker: 'Keep this page · for when you cannot think straight', title: 'An accident just\\nhappened — do this', body: 'Nobody thinks in steps at that moment, so read it now instead. Four things in order, then call me — I coordinate the rest with the insurer.', note: 'If you are unsure about anything, call me before notifying the insurer and I will tell you what to do next. No charge, and you do not have to be my client.' },\n      items: [\n        { icon: 'alert', th: { title: 'ดูคนก่อนดูรถ', body: 'มีใครเจ็บไหม ถ้าเจ็บโทร 1669 ทันที ย้ายรถออกจากช่องทางเดินรถถ้าขยับได้ เปิดไฟฉุกเฉิน ตั้งสามเหลี่ยม อย่ายืนอยู่บนถนน' }, en: { title: 'People before cars', body: 'Anyone hurt? Call 1669 immediately. Move the car out of live traffic if it drives, hazards on, triangle out — do not stand in the road.' } },\n        { icon: 'camera', th: { title: 'ถ่ายรูปก่อนขยับ', body: 'ถ่ายให้เห็นตำแหน่งรถทั้งสองคันพร้อมกัน ป้ายทะเบียนคู่กรณี ความเสียหายทุกด้าน และภาพกว้างให้เห็นถนนกับสัญญาณไฟ' }, en: { title: 'Photograph before moving', body: 'Both cars in one frame showing their positions, the other plate, every damaged panel, and a wide shot showing the road and signals.' } },\n        { icon: 'phone', th: { title: 'แจ้งบริษัทประกัน', body: 'โทรสายด่วนบริษัทที่หน้ากรมธรรม์ แจ้งเลขกรมธรรม์กับสถานที่ รอเจ้าหน้าที่มาออกใบเคลม อย่าตกลงจ่ายเงินสดกันเองข้างถนน' }, en: { title: 'Notify the insurer', body: 'Call the hotline on your policy with the policy number and location, and wait for the claim slip. Never settle in cash at the roadside.' } },\n        { icon: 'chat', th: { title: 'ส่งรูปมาให้ผม', body: 'ส่งรูปกับใบเคลมมาทางไลน์ ผมตามเรื่องกับบริษัทให้ ทั้งเรื่องอู่ รถใช้ระหว่างซ่อม และค่าเสียหายส่วนแรกที่ควรจ่ายหรือไม่ควรจ่าย' }, en: { title: 'Send it all to me', body: 'Send the photos and claim slip on LINE. I chase the insurer — garage, courtesy car, and whether that excess is actually payable.' } }\n      ],\n      cards: [\n        { th: { kicker: 'เจ็บ · ฉุกเฉิน', title: '1669', body: 'ศูนย์การแพทย์ฉุกเฉิน · ฟรี ตลอด 24 ชม.' }, en: { kicker: 'Injury · emergency', title: '1669', body: 'Emergency medical services · free, 24 hours' } },\n        { th: { kicker: 'ตำรวจ', title: '191', body: 'เมื่อมีข้อพิพาท คู่กรณีหนี หรือต้องลงบันทึกประจำวัน' }, en: { kicker: 'Police', title: '191', body: 'For disputes, a driver leaving the scene, or a police report' } },\n        { th: { kicker: 'อุบัติเหตุบนทางหลวง', title: '1586', body: 'สายด่วนกรมทางหลวง · แจ้งเหตุและขอความช่วยเหลือบนถนน' }, en: { kicker: 'Highway incidents', title: '1586', body: 'Department of Highways hotline · road incidents and assistance' } },\n        { th: { kicker: 'ร้องเรียนเรื่องประกัน', title: '1186', body: 'สายด่วน คปภ. · เมื่อบริษัทประกันปฏิเสธหรือประวิงเวลา' }, en: { kicker: 'Insurance complaints', title: '1186', body: 'OIC hotline · when an insurer refuses or delays' } }\n      ] },\n    { id: 'renew', type: 'renew', on: true, bg: 'sage', cols: 3,\n      th: { kicker: 'ฟรี · ยกเลิกได้ทุกเมื่อ', title: 'ไม่ต้องจำวันหมดอายุ\\nให้ผมจำแทน', body: 'บอกแค่ว่ากรมธรรม์ประเภทไหนหมดเดือนไหน ผมจะเตือนล่วงหน้า 60 วัน พร้อมเทียบเบี้ยใหม่มาให้ดูว่าปีนี้ควรอยู่ที่เดิมหรือย้าย ไม่ต้องส่งเอกสารอะไรตอนนี้', note: 'ผมเตือนแค่เรื่องที่คุณบอกไว้ ไม่ส่งโปรโมชั่น และหยุดเตือนได้ด้วยการพิมพ์คำว่า “หยุด” ครั้งเดียว' },\n      en: { kicker: 'Free · stop any time', title: 'Do not remember\\nrenewal dates — I will', body: 'Tell me which policy expires in which month and I will remind you 60 days ahead, with a fresh comparison showing whether to stay or move this year. No documents needed now.', note: 'I only remind you about what you listed here, never promotions, and one message saying “stop” ends it.' },\n      items: [\n        { icon: 'bell', th: { title: 'เตือน 60 วันก่อน', body: 'เร็วพอที่จะเทียบเบี้ยและเปลี่ยนบริษัทได้ทัน ไม่ใช่เตือนตอนเหลือสามวันซึ่งทำได้แค่ต่อที่เดิม' }, en: { title: 'Sixty days ahead', body: 'Early enough to compare and switch, not the three-day warning that leaves you no choice but to renew where you are.' } },\n        { icon: 'compare', th: { title: 'มาพร้อมเบี้ยใหม่', body: 'สำหรับรถยนต์ ผมยิงเทียบใหม่ทุกปี เพราะบริษัทที่ถูกที่สุดเมื่อปีที่แล้วมักไม่ใช่บริษัทเดิม' }, en: { title: 'With this year’s prices', body: 'For motor I re-quote every year — last year’s cheapest insurer is usually not this year’s.' } },\n        { icon: 'lock', th: { title: 'ข้อมูลน้อยที่สุด', body: 'ตอนนี้ขอแค่ประเภทกรมธรรม์ เดือนที่หมด และช่องทางติดต่อ ไม่ต้องมีเลขกรมธรรม์ ไม่ต้องมีเลขบัตรประชาชน' }, en: { title: 'The least data possible', body: 'Only the policy type, the expiry month and how to reach you. No policy number, no ID card number.' } }\n      ] },\n    { id: 'guides', type: 'guides', on: true, bg: 'surface', cols: 2,\n      th: { kicker: 'อ่านก่อนตัดสินใจ', title: 'สี่เรื่องที่คนมัก\\nรู้ตอนสายไปแล้ว', body: 'เขียนไว้ครบในหน้านี้ ไม่ต้องกดไปไหน ไม่ต้องทักมาถามก่อนก็อ่านจบได้' },\n      en: { kicker: 'Read before you decide', title: 'Four things people learn\\ntoo late', body: 'Written out in full here — nothing to click through, and no need to message me first.' },\n      items: [\n        { th: { label: 'สุขภาพ', meta: 'อ่าน 2 นาที', title: 'ค่าห้องที่เลือกไว้ อาจไม่พอกับโรงพยาบาลที่คุณจะไปจริง', body: 'เวลาซื้อประกันสุขภาพ คนมักเลือกค่าห้องตามเบี้ยที่จ่ายไหว แต่ตอนป่วยจริงเราไปโรงพยาบาลที่ใกล้บ้านหรือที่หมอที่ไว้ใจอยู่ ไม่ได้ไปโรงพยาบาลที่ค่าห้องพอดีกับกรมธรรม์\\n\\nวิธีตรวจง่าย ๆ คือเปิดเว็บโรงพยาบาลที่คุณคิดว่าจะไปถ้าป่วยหนัก ดูค่าห้องเดี่ยวต่อคืน แล้วเทียบกับตัวเลขในกรมธรรม์ ถ้ากรมธรรม์ให้ 4,000 แต่ห้องจริง 6,500 ส่วนต่างคืนละ 2,500 คุณจ่ายเอง นอน 10 คืนก็ 25,000\\n\\nแบบเหมาจ่ายวงเงินเดียวแก้ปัญหานี้ได้ตรงกว่าการเพิ่มค่าห้องทีละขั้น เพราะไม่ต้องมานับรายการว่าอะไรเบิกได้เท่าไหร่' }, en: { label: 'Health', meta: '2 min read', title: 'Your room rate probably does not match the hospital you would actually use', body: 'People pick a room rate to fit the premium they can afford. But when you are actually ill you go to the hospital near home, or to the doctor you trust — not to the one whose room rate happens to match your policy.\\n\\nThe check takes a minute: look up the private room rate at the hospital you would choose for something serious, and compare it to the figure on your policy. If the policy pays ฿4,000 and the room is ฿6,500, that ฿2,500 a night is yours. Ten nights is ฿25,000.\\n\\nA single lump-sum limit solves this more directly than nudging the room rate up one step at a time, because nothing has to be itemised.' } },\n        { th: { label: 'รถยนต์', meta: 'อ่าน 2 นาที', title: 'ชั้น 3+ ไม่ได้คุ้มครองทุกการชน และนี่คือช่องที่คนพลาด', body: 'ชั้น 3+ คุ้มครองรถของคุณเมื่อชนกับ “ยานพาหนะทางบกที่มีคู่กรณี” เท่านั้น คำนี้สั้นแต่ตัดหลายเหตุการณ์ออกไป\\n\\nชนเสาไฟ ชนขอบทาง ถอยชนกำแพงบ้าน ชนหมาวิ่งตัด หรือคู่กรณีหนีแล้วหาไม่ได้ — ไม่มีคู่กรณีที่ระบุได้ ก็ไม่เข้าเงื่อนไข รถคุณซ่อมเอง ส่วนความเสียหายของคู่กรณียังคุ้มครองอยู่\\n\\nถ้ารถยังผ่อนอยู่ หรือเป็นรถคันเดียวที่ใช้ทำงาน ส่วนต่างเบี้ยระหว่าง 3+ กับชั้น 1 มักน้อยกว่าค่าซ่อมครั้งเดียวที่ต้องออกเอง ลองให้เทียบตัวเลขจริงก่อนตัดสินใจ' }, en: { label: 'Motor', meta: '2 min read', title: 'Class 3+ does not cover every collision — here is the gap', body: 'Class 3+ covers damage to your car only in a collision with an identified land vehicle. That phrase is short, and it excludes a lot.\\n\\nA lamp post, a kerb, reversing into your own wall, a dog running out, or a driver who leaves the scene and is never traced — with no identified counterparty the condition is not met, and your repair is yours. Damage to the other party stays covered.\\n\\nIf the car is still on finance, or it is the one car you work from, the premium gap between 3+ and Class 1 is often smaller than a single repair you would fund yourself. Ask for both numbers before deciding.' } },\n        { th: { label: 'ชีวิต', meta: 'อ่าน 2 นาที', title: 'ทุนประกันชีวิตไม่ใช่ตัวเลขสวย ๆ แต่คือหนี้บวกเวลา', body: 'คำถามที่ตอบง่ายกว่า “ควรทำทุนเท่าไหร่” คือ “ถ้ารายได้เราหายไปพรุ่งนี้ คนที่บ้านต้องอยู่ต่ออีกกี่ปีก่อนจะยืนได้เอง”\\n\\nเอาค่าใช้จ่ายบ้านต่อเดือนคูณจำนวนเดือนนั้น บวกหนี้ที่ยังเหลือทั้งบ้านทั้งรถ บวกค่าเรียนที่เหลือของลูกจนจบ นั่นคือทุนที่ควรมี ไม่ต้องกลม ไม่ต้องสวย\\n\\nคนส่วนใหญ่ที่คิดแบบนี้จะพบว่าทุนที่มีอยู่น้อยกว่าที่ควร แต่ก็จะพบด้วยว่าแบบชั่วระยะเวลา (term) เติมส่วนที่ขาดได้ด้วยเบี้ยที่ต่ำกว่าที่คิดไว้มาก' }, en: { label: 'Life', meta: '2 min read', title: 'A sum assured is not a round number — it is debt plus time', body: 'An easier question than “how much cover should I have” is “if my income stopped tomorrow, how many years would my family need before they could stand on their own?”\\n\\nTake the household’s monthly costs, multiply by those months, add the outstanding mortgage and car finance, add the school fees still to come. That is the figure. It does not need to be round.\\n\\nMost people who work it out this way find they are underinsured — and also find that term cover fills the gap for far less premium than they expected.' } },\n        { th: { label: 'ภาษี', meta: 'อ่าน 1 นาที', title: 'สิทธิลดหย่อนประกันมีสองก้อน คนมักใช้แค่ก้อนเดียว', body: 'เบี้ยประกันชีวิตทั่วไปลดหย่อนได้ถึง 100,000 บาท และเบี้ยประกันสุขภาพตนเองรวมอยู่ในเพดานนี้ได้ไม่เกิน 25,000 บาท\\n\\nแต่ประกันบำนาญเป็นอีกก้อนแยกออกมา ลดหย่อนเพิ่มได้ถึง 200,000 บาท (ไม่เกิน 15% ของเงินได้ และเมื่อรวมกับ RMF, กองทุนสำรองเลี้ยงชีพ, กบข. ต้องไม่เกิน 500,000 บาท)\\n\\nคนที่ใช้สิทธิ 100,000 เต็มแล้วและยังต้องการลดภาษีเพิ่ม มักไม่รู้ว่าก้อนบำนาญยังว่างอยู่ ตัวเลขปีนี้ควรเช็กกับกรมสรรพากรอีกครั้งก่อนยื่น' }, en: { label: 'Tax', meta: '1 min read', title: 'Insurance relief comes in two pots — most people use one', body: 'Ordinary life premiums are deductible up to ฿100,000, and your own health premiums count inside that ceiling up to ฿25,000.\\n\\nAnnuity cover is a separate pot: a further ฿200,000 (capped at 15% of income, and at ฿500,000 once combined with RMF and provident-fund contributions).\\n\\nPeople who have filled the ฿100,000 and still want relief often do not realise the annuity pot is untouched. Confirm this year’s figures with the Revenue Department before filing.' } }\n      ] },\n    { id: 'voices', type: 'stories', on: true, bg: 'bg', cols: 3,\n      th: { kicker: 'เคสเคลมจริง · รอใส่ข้อมูล', title: 'เคลมจริงหน้าตา\\nเป็นอย่างไร', body: 'แทนที่จะเป็นคำชม ตรงนี้ตั้งใจให้เป็นบันทึกเคลมจริง — เกิดอะไร ผมทำอะไร ใช้เวลากี่วัน ได้เท่าไหร่ สามช่องนี้ยังเป็นโครงรอให้กรอกในระบบหลังบ้าน', note: 'ทุกเคสต้องขออนุญาตลูกค้าก่อนเผยแพร่ ไม่ระบุชื่อ ไม่ใช้รูปจริง และตัวเลขต้องตรงกับเอกสารเคลม — เคสของคนอื่นไม่ได้แปลว่าเคสคุณจะออกมาเหมือนกัน' },\n      en: { kicker: 'Real claims · not filled in yet', title: 'What a claim\\nactually looks like', body: 'Instead of compliments, this is meant to be a claim record — what happened, what I did, how many days, what was paid. These three are the shape, waiting for real cases in the admin portal.', note: 'Every case needs the client\\u2019s permission before it goes up: no names, no real photographs, and figures that match the claim documents. Another person\\u2019s outcome is not a promise about yours.' },\n      items: [\n        { th: { label: '⟨ประเภท เช่น รถยนต์ ชั้น 1⟩', value: '⟨฿000,000⟩', valueNote: '⟨ยอดที่บริษัทจ่าย⟩', title: '⟨เกิดอะไรขึ้น — เล่าสั้น ๆ 1–2 ประโยค ไม่ระบุชื่อ⟩', body: '⟨ผมเข้าไปช่วยตรงไหน เอกสารอะไร ติดตามกับใคร⟩', meta: '⟨จบใน 00 วัน⟩' },\n          en: { label: '⟨Claim type, e.g. motor Class 1⟩', value: '⟨฿000,000⟩', valueNote: '⟨amount the insurer paid⟩', title: '⟨What happened — one or two lines, no names⟩', body: '⟨Where I stepped in, which documents, who I chased⟩', meta: '⟨Settled in 00 days⟩' } },\n        { th: { label: '⟨ประเภท เช่น สุขภาพ IPD⟩', value: '⟨฿000,000⟩', valueNote: '⟨ยอดที่บริษัทจ่าย⟩', title: '⟨เกิดอะไรขึ้น⟩', body: '⟨ผมทำอะไรให้⟩', meta: '⟨จบใน 00 วัน⟩' },\n          en: { label: '⟨Claim type, e.g. health IPD⟩', value: '⟨฿000,000⟩', valueNote: '⟨amount the insurer paid⟩', title: '⟨What happened⟩', body: '⟨What I did⟩', meta: '⟨Settled in 00 days⟩' } },\n        { th: { label: '⟨ประเภท เช่น ชีวิต⟩', value: '⟨฿000,000⟩', valueNote: '⟨ยอดที่บริษัทจ่าย⟩', title: '⟨เกิดอะไรขึ้น⟩', body: '⟨ผมทำอะไรให้⟩', meta: '⟨จบใน 00 วัน⟩' },\n          en: { label: '⟨Claim type, e.g. life⟩', value: '⟨฿000,000⟩', valueNote: '⟨amount the insurer paid⟩', title: '⟨What happened⟩', body: '⟨What I did⟩', meta: '⟨Settled in 00 days⟩' } }\n      ] },\n    { id: 'about', type: 'about', on: true, bg: 'surface', cols: 2,\n      th: { kicker: 'เกี่ยวกับ CoverMate', title: 'ดูแลด้วยความเข้าใจ\\nและความรอบคอบ', body: 'CoverMate ก่อตั้งขึ้นจากการได้เห็นหลายคนพบในวันที่ต้องเคลมว่าความคุ้มครองไม่ตรงกับที่เข้าใจไว้ แนวทางของเราคืออธิบายทุกทางเลือกให้ชัดเจน แล้วให้คุณตัดสินใจตามจังหวะของคุณเอง\\n\\nเราเป็นตัวแทน AIA สำหรับประกันชีวิตและสุขภาพ และจัดการประกันรถยนต์ในฐานะนายหน้า จึงเปรียบเทียบตลาดในส่วนที่เป็นประโยชน์ พร้อมดูแลความคุ้มครองหลักอย่างต่อเนื่อง' },\n      en: { kicker: 'About CoverMate', title: 'A considered approach\\nto protection', body: 'CoverMate was founded after seeing how often people discover, only at claim time, that their cover did not match their expectations. Our approach is to explain each option clearly and let you decide at your own pace.\\n\\nWe represent AIA for life and health insurance, and arrange motor insurance as a broker — comparing the market where it adds value, while standing behind a single insurer for the cover that matters most.' },\n      items: [\n        { th: { label: 'ความเชี่ยวชาญ', value: 'ชีวิต สุขภาพ และรถยนต์' }, en: { label: 'Focus', value: 'Life, health and motor' } },\n        { th: { label: 'ใบอนุญาต', value: 'ตัวแทนประกันชีวิต 6401006221 · นายหน้าประกันวินาศภัย 6804008544' }, en: { label: 'Licences', value: 'Life agent No. 6401006221 · Non-life broker No. 6804008544' } },\n        { th: { label: 'ภาษา', value: 'ไทย · English' }, en: { label: 'Languages', value: 'Thai · English' } },\n        { th: { label: 'พื้นที่ดูแล', value: 'กรุงเทพฯ และปริมณฑล' }, en: { label: 'Area', value: 'Bangkok & surrounding' } }\n      ] },\n    { id: 'faq', type: 'faq', on: true, bg: 'bg', cols: 1,\n      th: { kicker: 'คำถามที่ถูกถามบ่อย', title: 'คำถามที่พบบ่อย', body: '' },\n      en: { kicker: 'Asked most often', title: 'Questions, answered plainly', body: '' },\n      items: [\n        { th: { q: 'ต้องจ่ายค่าที่ปรึกษาให้คุณไหม', a: 'ไม่ต้องครับ ค่าตอบแทนของผมมาจากบริษัทประกันเมื่อกรมธรรม์ออก เบี้ยที่คุณจ่ายเท่ากับซื้อเองทุกบาท แต่คุณได้คนคอยตามเรื่องให้เพิ่มมาฟรี' }, en: { q: 'Do I pay you a fee?', a: 'No. I am paid by the insurer when a policy is issued. Your premium is exactly the same as buying direct — you just get someone chasing things for you at no extra cost.' } },\n        { th: { q: 'มีประกันอยู่แล้ว ย้ายมาให้คุณดูแลได้ไหม', a: 'ได้สำหรับประกันรถยนต์ เปลี่ยนนายหน้าตอนต่ออายุได้เลย ส่วนประกันชีวิตที่ทำไว้แล้วยังอยู่กับตัวแทนเดิม แต่ผมอ่านกรมธรรม์ให้ฟรีและบอกได้ว่าขาดหรือซ้ำตรงไหน' }, en: { q: 'I already have cover — can you take it over?', a: 'For motor insurance, yes — you can switch broker at renewal. Existing life policies stay with their agent, but I will read them for free and tell you where you are short or doubled up.' } },\n        { th: { q: 'จะถูกติดต่อซ้ำ ๆ หรือไม่', a: 'ไม่ครับ ผมให้ข้อมูลและปล่อยให้เป็นการตัดสินใจของคุณ หากยังไม่สะดวก ผมจะไม่ติดต่อซ้ำ เว้นแต่คุณขอให้แจ้งเตือน' }, en: { q: 'Will I be contacted repeatedly?', a: 'No. I provide the information and leave the decision with you. If you prefer not to proceed, I will not follow up unless you ask me to.' } },\n        { th: { q: 'เบี้ยผ่านคุณแพงกว่าซื้อออนไลน์ไหม', a: 'ไม่แพงกว่าครับ เบี้ยถูกกำหนดโดยบริษัทและ คปภ. บ่อยครั้งผมหาโปรโมชันหรือส่วนลดที่หน้าเว็บทั่วไปไม่ได้ให้ด้วยซ้ำ' }, en: { q: 'Is it more expensive than buying online?', a: 'No. Premiums are set by the insurer and the regulator. Often I can find promotions or discounts that public sites do not show.' } },\n        { th: { q: 'เคลมยากไหม ถ้าเคลมแล้วไม่ได้ล่ะ', a: 'เคลมเป็นงานของผม คุณส่งเอกสารมาที่ผม ผมคุยกับบริษัทเอง ถ้าถูกปฏิเสธผมช่วยอุทธรณ์และหาเหตุผลว่าทำไม ไม่ปล่อยให้คุณสู้คนเดียว' }, en: { q: 'What if a claim gets refused?', a: 'Claims are my job. You send me the documents and I deal with the insurer. If it is refused I help appeal it and find out why — you do not fight it alone.' } }\n      ] },\n    { id: 'fees', type: 'fees', on: true, bg: 'surface', cols: 3,\n      th: { kicker: 'เรื่องเงิน พูดตรง ๆ ก่อน', title: 'ผมได้ค่าตอบแทน\\nจากตรงไหน', body: 'คำถามนี้คนอยากถามแต่ไม่ค่อยถาม ผมเลยตอบไว้เลยโดยไม่ต้องรอถาม เพราะถ้าไม่รู้ว่าที่ปรึกษาได้เงินจากไหน ก็ยากที่จะเชื่อคำแนะนำ', note: 'เบี้ยประกันเป็นอัตราที่บริษัทยื่นและได้รับความเห็นชอบจาก คปภ. ซื้อผ่านผมหรือซื้อตรงกับบริษัท เบี้ยเท่ากันครับ' },\n      en: { kicker: 'Money, said plainly', title: 'Where my\\ncommission comes from', body: 'People want to ask this and rarely do, so here it is unprompted — advice is hard to trust when you cannot see how the adviser is paid.', note: 'Premiums are filed with and approved by the OIC. Buying through me or direct from the insurer costs you exactly the same.' },\n      cards: [\n        { n: '1', th: { kicker: 'คุณจ่าย', title: 'เบี้ยประกัน', body: 'จ่ายให้บริษัทประกันโดยตรง ไม่ผ่านบัญชีผม และไม่มีค่าที่ปรึกษาแยกต่างหาก' },\n          en: { kicker: 'You pay', title: 'The premium', body: 'Paid to the insurer directly — never into my account, and never with a separate advice fee attached.' } },\n        { n: '2', th: { kicker: 'บริษัทจ่าย', title: 'ค่าตอบแทนถึงผม', body: 'บริษัทประกันแบ่งส่วนหนึ่งของเบี้ยเป็นค่าตอบแทน ซึ่งรวมอยู่ในเบี้ยอยู่แล้วไม่ว่าคุณจะซื้อผ่านใคร' },\n          en: { kicker: 'The insurer pays', title: 'My commission', body: 'A share of the premium, already priced in whether you buy through me, another agent, or nobody at all.' } },\n        { n: '3', th: { kicker: 'แปลว่า', title: 'ราคาไม่ต่างกัน', body: 'ซื้อผ่านผมไม่แพงกว่า ต่างกันแค่ตอนต่ออายุและตอนเคลม คุณมีคนรับสาย' },\n          en: { kicker: 'Which means', title: 'The price is the same', body: 'Going through me costs no more. The difference shows up at renewal and at claim time, when someone answers the phone.' } }\n      ],\n      items: [\n        { th: { label: 'ทำไมถึงต่างกันในแต่ละแบบ', value: 'ประกันชีวิตจ่ายค่าตอบแทนสูงในปีแรกแล้วลดลงมาก ประกันรถจ่ายใกล้เคียงกันทุกปี ผมจึงไม่มีเหตุผลจะเชียร์ให้เปลี่ยนกรมธรรม์บ่อย ๆ' },\n          en: { label: 'Why it differs by product', value: 'Life pays most in year one then drops sharply; motor pays about the same every year. So I have no reason to push you to keep switching policies.' } },\n        { th: { label: 'สิ่งที่ผมไม่ทำ', value: 'ไม่แนะนำแบบที่ค่าตอบแทนสูงกว่าถ้ามันไม่ตรงกับสิ่งที่คุณต้องการ และไม่เร่งให้ตัดสินใจด้วยโปรโมชั่นที่กำลังจะหมด' },\n          en: { label: 'What I will not do', value: 'Recommend the higher-paying product when it is not the right one, or rush you with a promotion that is about to expire.' } },\n        { th: { label: 'ถามได้ตรง ๆ', value: 'อยากรู้ว่าแบบที่ผมเสนอ ผมได้เท่าไหร่ ถามได้เลยครับ ผมบอกได้ และไม่ถือว่าเสียมารยาท' },\n          en: { label: 'Ask me outright', value: 'If you want to know what I earn on what I have proposed, ask. I will tell you, and it is not a rude question.' } },\n        { th: { label: 'ถ้าไม่ซื้อล่ะ', value: 'ตรวจกรมธรรม์เดิม ตอบคำถาม หรือช่วยดูตอนเคลม ไม่มีค่าใช้จ่าย และผมไม่ตามต่อถ้าคุณไม่ได้ขอ' },\n          en: { label: 'And if you do not buy', value: 'Reading your existing policy, answering questions, helping at claim time — no charge, and no follow-up unless you ask for one.' } }\n      ] },\n    { id: 'privacy', type: 'pdpa', on: true, bg: 'bg', cols: 2,\n      th: { kicker: 'พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคล', title: 'ข้อมูลที่คุณส่งมา\\nถูกใช้ทำอะไร', body: 'เขียนไว้ตรงนี้ก่อนที่คุณจะกรอกอะไร ไม่ใช่ซ่อนไว้ในลิงก์ท้ายหน้า — สั้น ๆ ตามที่ควรเป็น', note: 'ต้องการขอดู แก้ไข หรือให้ลบข้อมูลของคุณ ทักมาทางไลน์หรือโทรมาได้เลย ไม่ต้องให้เหตุผล ผมดำเนินการให้ภายใน 30 วันตามที่กฎหมายกำหนด' },\n      en: { kicker: 'Thai PDPA', title: 'What happens to\\nwhat you send me', body: 'Stated here before you fill anything in, rather than hidden in a link at the bottom of the page. Short, as it should be.', note: 'To see, correct or delete your data, message me on LINE or call — no reason needed. I action it within the 30 days the law allows.' },\n      items: [\n        { th: { label: 'เก็บอะไร', value: 'ชื่อที่ให้เรียก ช่องทางติดต่อ และสิ่งที่คุณเล่าให้ฟังเองเท่านั้น เช่น อายุ รายได้โดยประมาณ หรือกรมธรรม์ที่ถืออยู่' }, en: { label: 'What is collected', value: 'The name you give, how to reach you, and only what you choose to tell me — age, approximate income, or the policies you hold.' } },\n        { th: { label: 'ใช้ทำอะไร', value: 'ใช้เพื่อตอบคำถามและจัดทำข้อเสนอให้คุณอย่างเดียว ไม่ขาย ไม่แลก และไม่ส่งต่อให้ใครเพื่อการตลาด' }, en: { label: 'What it is used for', value: 'Answering your question and preparing your options — nothing else. Never sold, traded, or passed on for marketing.' } },\n        { th: { label: 'ส่งต่อให้ใคร', value: 'ส่งให้บริษัทประกันที่คุณเลือกเท่านั้น และเฉพาะเมื่อคุณตัดสินใจขอใบเสนอราคาหรือทำกรมธ
