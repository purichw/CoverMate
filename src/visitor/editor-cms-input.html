<label class="cm-editor-field"><span>{{ field.inputLabel }}</span><sc-if value="{{ !field.big }}"><input data-cms-field="{{ field.path }}" value="{{ field.value }}" aria-invalid="{{ !!field.error }}" aria-describedby="{{ field.errorId }}" sc-camel-on-change="{{ field.change }}" sc-camel-on-blur="{{ field.commit }}"></sc-if><sc-if value="{{ field.big }}"><textarea rows="3" data-cms-field="{{ field.path }}" value="{{ field.value }}" aria-invalid="{{ !!field.error }}" aria-describedby="{{ field.errorId }}" sc-camel-on-change="{{ field.change }}" sc-camel-on-blur="{{ field.commit }}"></textarea></sc-if><small id="{{ field.errorId }}" role="status">{{ field.validationHint }}</small></label>
