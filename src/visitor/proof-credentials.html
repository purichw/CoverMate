<div class="hm-licences" data-noedit>
  <sc-if value="{{ heroProof.life }}"><sc-if value="{{ hasLifeLicence }}"><p>{{ s.heroLifeLicense }}</p></sc-if></sc-if>
  <sc-if value="{{ hasNonLifeLicence }}"><p>{{ s.heroNonLifeLicense }}</p></sc-if>
  <sc-if value="{{ hasVerifyLink }}"><a class="hm-text-link" href="{{ footerOicHref }}" target="_blank" rel="noopener">{{ s.heroVerifyLabel }} <span aria-hidden="true">↗</span></a></sc-if>
</div>
<sc-if value="{{ hours }}"><div class="hm-proof-service"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><p data-cms-copy="contact.hours">{{ hours }}</p></div></sc-if>
