<!DOCTYPE html>
<html lang="th-TH">
<head>
  <meta charset="utf-8">
  <title>CoverMate Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#c67139">
  <link rel="canonical" href="https://covermate.vercel.app/admin/login/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/covermate-fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: #f5ead8; }
    body { min-height: 100vh; font-family: "Google Sans", "Google Sans Thai", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_thumbnail,
    #__bundler_loading,
    #__bundler_placeholder {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; background: #f5ead8; z-index: -1; }
    #__bundler_thumbnail svg { width: 0; height: 0; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 &quot;Google Sans&quot;,&quot;Google Sans Thai&quot;,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 100 100"><rect width="100" height="100" fill="#c67139"></rect><g fill="none" stroke="#f5ead8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="46" width="40" height="30" rx="7"></rect><path d="M39 46v-8a11 11 0 0 1 22 0v8"></path></g></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 "Google Sans","Google Sans Thai","Noto Sans Thai",system-ui,sans-serif;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    async function hydrateCoverMateContent() {
      if (!/^https?:$/.test(window.location.protocol)) return;
      const timeoutMs = 5000;
      let timeoutId = 0;
      const timeout = new Promise((resolve) => {
        timeoutId = window.setTimeout(() => resolve({ timedOut: true }), timeoutMs);
      });
      const remote = (async () => {
        setStatus('Loading latest content...');
        await import(window.location.origin + '/covermate-firebase.js');
        if (window.CoverMateFirebase && window.CoverMateFirebase.hydrateLocalContent) {
          return window.CoverMateFirebase.hydrateLocalContent({ draft: false, versions: false });
        }
        return null;
      })();
      try {
        const result = await Promise.race([remote, timeout]);
        if (result && result.timedOut) {
          window.__covermateRemoteContent = { source: 'timeout', timeoutMs };
          remote.catch(() => {});
          console.warn('[covermate] Remote content still loading; rendering local fallback cache.');
        }
      } catch (err) {
        window.__covermateRemoteContent = { source: 'fallback', error: err && err.message ? err.message : String(err) };
        console.warn('[covermate] Remote content unavailable; using local fallback cache.', err);
      } finally {
        if (timeoutId) window.clearTimeout(timeoutId);
      }
    }
    await hydrateCoverMateContent();

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const layoutPolish = [
      '<style id="covermate-login-layout-polish">',
      '@media (min-width: 701px) {',
      '  main { padding: clamp(48px, 7vw, 92px) !important; }',
      '  main > div:nth-of-type(3) { max-width: 520px !important; gap: 26px !important; padding: 48px 56px 44px !important; }',
      '  main > div:nth-of-type(3) > div:first-child { gap: 14px !important; }',
      '  main > div:nth-of-type(3) > div:nth-child(2) { gap: 10px !important; }',
      '  main > div:nth-of-type(3) > div:nth-child(2) p { max-width: 42ch !important; }',
      '  main > div:nth-of-type(3) button { min-height: 56px !important; }',
      '  main > div:nth-of-type(3) > div:last-child { gap: 8px !important; padding-top: 20px !important; }',
      '}',
      '@media (max-width: 700px) {',
      '  main { align-items: center !important; padding: max(24px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)) !important; }',
      '  main > div:nth-of-type(1) { width: 360px !important; height: 360px !important; top: -124px !important; left: -140px !important; }',
      '  main > div:nth-of-type(2) { width: 360px !important; height: 360px !important; bottom: -156px !important; right: -172px !important; }',
      '  main > div:nth-of-type(3) { max-width: 390px !important; gap: 22px !important; padding: 32px 28px 34px !important; }',
      '  main > div:nth-of-type(3) > div:first-child { gap: 12px !important; }',
      '  main > div:nth-of-type(3) > div:nth-child(2) { gap: 8px !important; }',
      '  main > div:nth-of-type(3) > div:last-child { gap: 7px !important; padding-top: 18px !important; }',
      '}',
      '</style>'
    ].join('');
    const headClose = template.match(/<\/head>/i);
    if (headClose) {
      template = template.slice(0, headClose.index) + layoutPolish + template.slice(headClose.index);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"th-TH\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CoverMate Admin Login</title>\n  <meta name=\"robots\" content=\"noindex,nofollow,noarchive\">\n  <meta name=\"googlebot\" content=\"noindex,nofollow,noarchive\">\n  <meta name=\"theme-color\" content=\"#c67139\">\n  <link rel=\"canonical\" href=\"https://covermate.vercel.app/admin/login/\">\n  <link rel=\"icon\" href=\"/favicon.svg\" type=\"image/svg+xml\">\n<script src=\"82b89d87-3304-480e-9fba-ea1f348d5566\"><\/script>\n<style id=\"covermate-template-cloak\">html,body{min-height:100%;background:#f5ead8}x-dc{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>\n<style id=\"covermate-responsive-touch-policy\">\n@media (max-width: 700px), (pointer: coarse) {\n  button,\n  input,\n  select,\n  textarea,\n  [role=\"button\"] {\n    min-height: 44px !important;\n  }\n\n  button,\n  [role=\"button\"] {\n    min-width: 44px !important;\n  }\n\n  input,\n  select,\n  textarea {\n    font-size: 16px !important;\n  }\n\n  header a[href],\n  nav a[href],\n  footer a[href],\n  aside a[href],\n  main > a[href],\n  [data-admin-owner-bar] a[href] {\n    display: inline-flex !important;\n    align-items: center !important;\n    min-height: 44px !important;\n  }\n}\n</style>\n<link rel=\"stylesheet\" href=\"/assets/fonts/covermate-fonts.css\">\n</head>\n<body>\n<x-dc>\n<helmet>\n<style>/* Organic — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Google Sans\", \"Google Sans Thai\", \"Noto Sans Thai\", system-ui, sans-serif;\n  --font-heading-weight: 700;\n  --font-body: \"Google Sans\", \"Google Sans Thai\", \"Noto Sans Thai\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-5: 22px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: 0; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2)           <div style=\"font-size:13px;line-height:1.5;color:var(--color-accent-800)\">Firebase Auth could not load. Check your connection and authorised domains in Firebase Authentication settings.</div>\n          </sc-if>\n        </sc-if>\n\n        <sc-if value=\"{{ demoMode }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ demoSignIn }}\" style=\"display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;border:1.5px solid var(--color-neutral-400);cursor:pointer;font:inherit;font-size:15px;font-weight:600;border-radius:999px;background:var(--color-neutral-100);color:var(--color-neutral-900);transition:background .2s ease,border-color .2s ease\" style-hover=\"background:var(--color-neutral-200);border-color:var(--color-neutral-500)\">\n            <svg sc-camel-view-box=\"0 0 48 48\" style=\"width:20px;height:20px;flex:0 0 auto\"><path fill=\"#EA4335\" d=\"M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z\"></path><path fill=\"#4285F4\" d=\"M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z\"></path><path fill=\"#FBBC05\" d=\"M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z\"></path><path fill=\"#34A853\" d=\"M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z\"></path></svg>\n            Sign in with Google\n          </button>\n          <div style=\"display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.55;color:var(--color-neutral-700);padding:11px 13px;border-radius:var(--radius-sm);background:var(--color-accent-2-100)\">\n            <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;flex:0 0 auto;margin-top:1px;fill:none;stroke:var(--color-accent-2-800);stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M12 16v-4\"></path><path d=\"M12 8h.01\"></path></svg>\n            <span><strong>Firebase Auth.</strong> Google sign-in is active. Access opens only for accounts listed in Firestore at <code>admins/{uid}</code>.</span>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{ denied }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--color-accent-800);padding:11px 13px;border-radius:var(--radius-sm);background:var(--color-accent-200)\">\n            <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:16px;height:16px;flex:0 0 auto;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"m15 9-6 6\"></path><path d=\"m9 9 6 6\"></path></svg>\n            <span>{{ deniedMsg }}</span>\n          </div>\n        </sc-if>\n      </div>\n    </sc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:4px;padding-top:var(--space-2);border-top:1px solid var(--color-neutral-300)\">\n      <p style=\"margin:0;font-size:12px;line-height:1.55;color:var(--color-neutral-700)\">Your session is kept in this browser for 7 days.</p><a href=\"/?view=public\" style=\"display:inline-flex;align-items:center;min-height:44px;width:max-content;max-width:100%;font-size:12px;font-weight:700;color:var(--color-accent-700);text-decoration:underline;text-underline-offset:2px\">View the public site →</a>\n    </div>\n  </div>\n</main>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:720},&quot;googleClientId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Google Auth&quot;},&quot;allowedEmails&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Google Auth&quot;},&quot;redirectTo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/admin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Google Auth&quot;}}\">\nconst K_LIVE = 'purich-live-config-v3';\nconst ACCENTS = {\n  terracotta: { base: 'var(--color-accent)', deep: 'var(--color-accent-900)' },\n  sage: { base: 'var(--color-accent-2)', deep: 'var(--color-accent-2-900)' },\n  ink: { base: 'var(--color-neutral-800)', deep: 'var(--color-neutral-900)' }\n};\n\nclass Component extends DCLogic {\n  state = { session: null, denied: false, deniedMsg: '', checking: true };\n\n  liveConfig() { try { return JSON.parse(window.localStorage.getItem(K_LIVE) || 'null'); } catch (e) { return null; } }\n  redirect() { return (this.props.redirectTo || '').trim() || '/admin'; }\n\n  componentDidMount() { this.bootstrapAuth(); }\n\n  async firebase() {\n    await import(window.location.origin + '/covermate-firebase.js');\n    if (!window.CoverMateFirebase) throw new Error('Firebase could not initialise.');\n    return window.CoverMateFirebase;\n  }\n\n  async bootstrapAuth() {\n    try {\n      const cm = await this.firebase();\n      const cached = cm.readSession();\n      if (cached) this.setState({ session: cached, denied: false, checking: false });\n      const user = await cm.waitForAuth();\n      if (!user) { this.setState({ checking: false }); return; }\n      const result = await cm.syncSessionFromCurrentUser();\n      if (result.ok) {\n        this.setState({ session: result.session, denied: false, deniedMsg: '', checking: false });\n      } else {\n        this.setState({ session: null, denied: true, deniedMsg: this.deniedCopy(user.email), checking: false });\n      }\n    } catch (e) {\n      this.setState({ checking: false, denied: true, deniedMsg: this.errorCopy(e) });\n    }\n  }\n\n  deniedCopy(email) {\n    return (email || 'This account') + ' is not on the CoverMate admin allowlist yet. Add this user UID under Firestore admins/{uid}, then sign in again.';\n  }\n\n  errorCopy(error) {\n    const code = error && error.code ? String(error.code) : '';\n    if (code === 'auth/unauthorized-domain') return 'This domain is not authorised for Firebase Auth. Add it in Authentication settings, then try again.';\n    if (code === 'auth/popup-closed-by-user') return 'Google sign-in was closed before it finished.';\n    if (code === 'permission-denied') return 'Firestore denied the admin allowlist check. Re-check the published Firestore rules.';\n    return (error && error.message) ? error.message : 'Firebase sign-in could not start. Please try again.';\n  }\n\n  async signIn() {\n    this.setState({ checking: true, denied: false, deniedMsg: '' });\n    try {\n      const cm = await this.firebase();\n      const result = await cm.signInAdmin();\n      if (result.ok) { window.location.href = this.redirect(); return; }\n      this.setState({ checking: false, denied: true, deniedMsg: result.message || this.deniedCopy(result.user && result.user.email) });\n    } catch (e) {\n      this.setState({ checking: false, denied: true, deniedMsg: this.errorCopy(e) });\n    }\n  }\n\n  async signOut() {\n    try { const cm = await this.firebase(); await cm.signOut(); } catch (e) { try { window.localStorage.removeItem('covermate-admin-session'); } catch (err) {} }\n    this.setState({ session: null, denied: false, deniedMsg: '', checking: false });\n  }\n\n  renderVals() {\n    const S = this.state;\n    const email = S.session ? (S.session.email || '') : '';\n    const c = this.liveConfig() || {};\n    const b = c.brand || {};\n    const pick = (v, d) => { if (v == null) return d; if (typeof v === 'object') return v.en || v.th || d; return v; };\n    const A = ACCENTS[(c.theme && c.theme.accent)] || ACCENTS.terracotta;\n    return {\n      brandInitial: b.initial || 'C',\n      brandName: pick(b.name, 'CoverMate'),\n      accentBase: A.base, accentDeep: A.deep,\n      signedIn: !!S.session, signedOut: !S.session,\n      sessionEmail: email,\n      sessionInitial: (email.charAt(0) || 'A').toUpperCase(),\n      realMode: false, demoMode: true,\n      googleError: false,\n      denied: S.denied, deniedMsg: S.deniedMsg,\n      continueIn: () => { window.location.href = this.redirect(); },\n      signOut: () => this.signOut(),\n      demoSignIn: () => this.signIn()\n    };\n  }\n}\n<\/script>\n\n\n</body></html>"</script>
