<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#c67139" />
  <title>CoverMate Admin Portal</title>
  <link rel="canonical" href="https://covermate.vercel.app/admin/" />
  <link rel="icon" href="/favicon.svg?v=20260913-mate-gold" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico?v=20260913-mate-gold" sizes="any" />
  <link rel="stylesheet" href="/assets/fonts/covermate-fonts.css" />
  <script defer src="/assets/telemetry.js"></script>
  <script>
    (function () {
      function loginPath() {
        try {
          var params = new URLSearchParams(window.location.search);
          var loginParams = new URLSearchParams();
          if (params.get("cm_env") === "uat") loginParams.set("cm_env", "uat");
          if (params.has("case")) loginParams.set("case", /^[\w-]{1,128}$/.test(params.get("case")) ? params.get("case") : "");
          if (params.get("followUp") === "overdue") loginParams.set("followUp", "overdue");
          return "/admin/login" + (loginParams.toString() ? "?" + loginParams : "");
        } catch (error) {
          // Fall through to the production-shaped login URL.
        }
        return "/admin/login";
      }
      try {
        var raw = window.localStorage.getItem("covermate-admin-session");
        var session = raw ? JSON.parse(raw) : null;
        if (!session || Number(session.exp || 0) <= Date.now()) {
          window.location.replace(loginPath());
        }
      } catch (error) {
        window.location.replace(loginPath());
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4eadb;
      --bg-strong: #eee0cb;
      --surface: #fbf7f0;
      --surface-soft: #f1e7d7;
      --line: #dfd1bd;
      --line-strong: #cabaa2;
      --text: #25221f;
      --muted: #766d62;
      --faint: #9a9082;
      --sidebar: #2c281f;
      --sidebar-muted: #c7bdad;
      --accent: #cf7135;
      --accent-strong: #a4511d;
      --accent-soft: #ffe1cf;
      --sage: #60724a;
      --sage-soft: #dfedcb;
      --warning-soft: #ffe8d9;
      --neutral-soft: #e6dccb;
      --danger: #8f2f1f;
      --danger-soft: #ffe7e1;
      --shadow: 0 16px 36px rgba(88, 68, 39, 0.08);
      --radius: 22px;
      --radius-sm: 14px;
      --sidebar-w: 292px;
      --topbar-h: 86px;
      --font: "Google Sans", "Google Sans Thai", "Noto Sans Thai", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      text-rendering: optimizeLegibility;
    }

    body[data-boot="pending"] .app {
      visibility: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
    }

    a {
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px 18px;
      overflow-y: auto;
      color: #f6efe5;
      background: var(--sidebar);
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 0 10px 6px;
      color: inherit;
      text-decoration: none;
    }

    .brand-logo-plate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(230px, 100%);
      padding: 5px 8px;
      border-radius: 14px;
      background: #f6efe5;
      box-shadow: inset 0 0 0 1px rgba(46, 43, 37, 0.08);
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .brand-sub {
      display: block;
      color: #e8a06b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2em;
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav-button {
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--sidebar-muted);
      background: transparent;
      text-align: left;
      font-weight: 800;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .nav-button.active {
      color: #fff;
      background: var(--accent);
    }

    .nav-icon,
    .round-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
    }

    .nav-icon svg,
    .search svg,
    .round-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .badge {
      min-width: 25px;
      height: 25px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--accent-strong);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .nav-button.active .badge {
      background: #fff;
      color: var(--accent-strong);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.13);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a99f8f;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .role-select,
    .module-select {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 0 14px;
      color: #fff;
      background: #474137;
      font-weight: 800;
    }

    .user {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      color: #fff;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: var(--sage);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
    }

    .user strong {
      display: block;
      font-size: 15px;
    }

    .user span span {
      display: block;
      color: #a99f8f;
      font-size: 12px;
    }

    .logout {
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      color: var(--sidebar-muted);
      background: transparent;
      font-weight: 800;
    }

    .logout:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto;
      gap: 14px;
      align-items: center;
      padding: 17px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 247, 240, 0.93);
      backdrop-filter: blur(18px);
    }

    .search {
      position: relative;
    }

    .search span {
      position: absolute;
      left: 18px;
      top: 50%;
      color: var(--muted);
      transform: translateY(-50%);
    }

    .search input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 18px 0 48px;
      color: var(--text);
      background: var(--surface-soft);
      outline: none;
    }

    .pill,
    .chip,
    .ghost-button,
    .primary-button,
    .danger-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      padding: 0 16px;
      border: 1px solid transparent;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .pill {
      background: var(--sage-soft);
      color: #344427;
      font-size: 14px;
    }

    .pill.warn {
      border-color: #ffb58f;
      background: #fff6ed;
      color: #79421e;
    }

    .pill.error {
      border-color: #e9a39a;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: none;
      border-radius: 999px;
      background: currentColor;
    }

    .primary-button {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .primary-button:hover {
      background: #bd6129;
    }

    .ghost-button,
    .chip {
      border-color: var(--line);
      background: var(--surface);
      color: #4f4940;
    }

    .ghost-button:hover,
    .chip:hover {
      border-color: var(--line-strong);
      background: #fffaf4;
    }

    .ghost-button:disabled,
    .primary-button:disabled,
    .danger-button:disabled,
    .chip:disabled {
      border-color: var(--line);
      background: #ddd5c8;
      color: #8e8375;
      box-shadow: none;
    }

    .chip {
      min-height: 38px;
      padding: 0 14px;
      font-size: 14px;
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .danger-button {
      border-color: #e2a27f;
      background: #fff3eb;
      color: #914917;
    }

    .mobilebar {
      display: none;
    }

    .screen {
      width: min(100%, 1600px);
      padding: 42px 36px 70px;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .lede {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.metrics,
    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid.two {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card,
    .panel,
    .filterbar,
    .table-shell,
    .notice {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .card,
    .panel,
    .notice {
      padding: 24px;
    }

    .metric {
      min-height: 172px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .metric .label {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .metric .value {
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
    }

    .metric.status-metric .value {
      font-size: 25px;
      line-height: 1.2;
    }

    .metric p,
    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .metric button {
      justify-self: start;
      min-height: 0;
      border: 0;
      padding: 0;
      color: var(--accent-strong);
      background: transparent;
      font-weight: 900;
    }

    .filterbar {
      display: grid;
      gap: 14px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      margin-right: 6px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .record-count {
      margin-left: auto;
      color: var(--muted);
      font-weight: 900;
    }

    .table-shell {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      height: 54px;
      padding: 0 22px;
      color: var(--muted);
      background: var(--bg-strong);
      text-align: left;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    td {
      min-height: 70px;
      padding: 18px 22px;
      border-top: 1px solid #eadfce;
      vertical-align: middle;
      font-size: 16px;
    }

    tr[data-open-lead],
    tr[data-open-customer],
    tr[data-open-policy] {
      cursor: pointer;
    }

    tr[data-open-lead]:hover td,
    tr[data-open-customer]:hover td,
    tr[data-open-policy]:hover td {
      background: #fff8f0;
    }

    tr:focus-visible,
    button:focus-visible,
    a:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(207, 113, 53, 0.45);
      outline-offset: 2px;
    }

    .cell-title {
      display: block;
      color: #111;
      font-weight: 900;
      line-height: 1.25;
    }

    .cell-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      line-height: 1.35;
    }

    .status {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      border-radius: 999px;
      padding: 0 12px;
      background: var(--neutral-soft);
      color: #4b443b;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status.new,
    .status.contacting,
    .status.awaiting,
    .status.renewal,
    .status.overdue {
      background: var(--warning-soft);
      color: #6f3715;
    }

    .status.consultation,
    .status.converted,
    .status.active,
    .status.completed {
      background: var(--sage-soft);
      color: #344427;
    }

    .status.dim,
    .status.later,
    .status.notinterested,
    .status.lost {
      background: #e3d8c8;
      color: #655d52;
    }

    .timeline {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline li {
      position: relative;
      padding-left: 28px;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--sage);
    }

    .timeline li::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 20px;
      bottom: -20px;
      width: 2px;
      background: var(--line);
    }

    .timeline li:last-child::after {
      display: none;
    }

    .timeline strong {
      display: block;
      line-height: 1.3;
    }

    .timeline li > span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.35;
    }

    .progress-list {
      display: grid;
      gap: 12px;
    }

    .progress-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(160px, 2fr) 76px;
      gap: 14px;
      align-items: center;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: var(--neutral-soft);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .bar.sage span {
      background: var(--sage);
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(330px, .95fr);
      gap: 18px;
      align-items: start;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 28px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .field-value {
      font-size: 17px;
      font-weight: 850;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--surface-soft);
      outline: none;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    .checkbox {
      display: flex;
      flex-direction: row;
      gap: 10px;
      align-items: center;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .empty {
      padding: 36px 22px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .rail-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rail-list a,
    .rail-action,
    .rail-row {
      min-height: 48px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      background: var(--surface-soft);
      color: var(--text);
      text-align: left;
      text-decoration: none;
      font-weight: 850;
    }

    .rail-list a:hover,
    .rail-action:hover {
      background: #fffaf4;
    }

    .rail-list span,
    .rail-action span,
    .rail-row span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .module-card {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
      color: var(--text);
      text-align: left;
      text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .module-card:hover {
      border-color: var(--line-strong);
      background: #fffaf4;
      transform: translateY(-2px);
    }

    .module-card .round-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }

    .module-card.sage .round-icon {
      background: var(--sage);
    }

    .module-card.ink .round-icon {
      background: var(--sidebar);
    }

    .module-status {
      display: inline-flex;
      width: fit-content;
      min-height: 30px;
      align-items: center;
      border-radius: 999px;
      padding: 0 11px;
      background: var(--sage-soft);
      color: #344427;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .module-action {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-top: auto;
      color: var(--accent-strong);
      font-weight: 900;
    }

    .permission-table .yes,
    .permission-table .no {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 999px;
      font-weight: 900;
    }

    .permission-table .yes {
      background: var(--sage-soft);
      color: #344427;
    }

    .permission-table .no {
      background: var(--neutral-soft);
      color: var(--muted);
    }

    .notice {
      line-height: 1.5;
    }

    .notice.error {
      border-color: #e9a39a;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(37, 34, 31, 0.46);
    }

    .modal-root.open {
      display: grid;
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .modal-head,
    .modal-body,
    .modal-actions {
      padding: 22px 24px;
    }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      border-bottom: 1px solid var(--line);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 90;
      width: min(420px, calc(100vw - 40px));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text);
      font-weight: 800;
    }

    .toast.error {
      border-color: #e9a39a;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1260px) {
      .grid.metrics,
      .grid.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split,
      .grid.three {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1039px) {
      :root {
        --topbar-h: auto;
      }

      .app {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .mobilebar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: 1fr minmax(180px, 45%);
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--sidebar);
        color: #fff;
      }

      .mobilebar .brand {
        padding: 0;
      }

      .mobilebar .brand-logo-plate {
        width: min(174px, 56vw);
        padding: 4px 6px;
      }

      .workspace {
        display: block;
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px 16px;
      }

      .topbar .primary-button,
      .topbar .pill {
        width: 100%;
      }

      .screen {
        padding: 28px 16px 56px;
      }

      .page-head {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .grid.metrics,
      .grid.two,
      .grid.four {
        grid-template-columns: 1fr;
      }

      .detail-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .table-shell {
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: var(--surface);
      }

      td {
        display: grid;
        grid-template-columns: minmax(104px, 34%) 1fr;
        gap: 12px;
        min-height: auto;
        padding: 13px 16px;
        border-top: 1px solid #eadfce;
      }

      td:first-child {
        border-top: 0;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .progress-row {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 600px) {
      body:not([data-module="operations"]) .mobilebar {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      body:not([data-module="operations"]) .mobilebar .brand-logo-plate {
        width: 100%;
        max-width: 174px;
      }

      .rail-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
