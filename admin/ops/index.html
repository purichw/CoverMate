<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CoverMate Operations Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/fonts/covermate-fonts.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4eadb;
      --bg-strong: #eee0cb;
      --surface: #fbf7f0;
      --surface-soft: #f1e7d7;
      --surface-warm: #f8efe3;
      --line: #dfd1bd;
      --line-strong: #cabaa2;
      --text: #25221f;
      --muted: #766d62;
      --faint: #9a9082;
      --sidebar: #2c281f;
      --sidebar-muted: #c7bdad;
      --accent: #cf7135;
      --accent-strong: #a4511d;
      --accent-soft: #ffe1cf;
      --sage: #60724a;
      --sage-soft: #dfedcb;
      --warning: #a25a1f;
      --warning-soft: #ffe8d9;
      --neutral-soft: #e6dccb;
      --shadow: 0 16px 36px rgba(88, 68, 39, 0.08);
      --radius: 22px;
      --radius-sm: 14px;
      --sidebar-w: 292px;
      --topbar-h: 86px;
      --font: "Google Sans", "Noto Sans Thai", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      font-family: var(--font);
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body[data-boot="pending"] .app {
      visibility: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
    }

    a {
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px 18px;
      overflow-y: auto;
      color: #f6efe5;
      background: var(--sidebar);
    }

    .brand {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: center;
      padding: 0 10px 4px;
      text-decoration: none;
    }

    .brand-mark,
    .avatar {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-name {
      display: block;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.05;
    }

    .brand-sub {
      display: block;
      margin-top: 3px;
      color: #e8a06b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2em;
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav-button {
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--sidebar-muted);
      background: transparent;
      text-align: left;
      font-weight: 800;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .nav-button.active {
      color: #fff;
      background: var(--accent);
    }

    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: currentColor;
    }

    .nav-icon svg,
    .search svg,
    .round-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .badge {
      min-width: 25px;
      height: 25px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: var(--accent-strong);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .nav-button.active .badge {
      background: #fff;
      color: var(--accent-strong);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.13);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a99f8f;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .role-select {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 0 14px;
      color: #fff;
      background: #474137;
      font-weight: 800;
    }

    .user {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      color: #fff;
    }

    .avatar {
      width: 42px;
      height: 42px;
      background: var(--sage);
      font-size: 15px;
    }

    .user strong {
      display: block;
      font-size: 15px;
    }

    .user span {
      display: block;
      color: #a99f8f;
      font-size: 12px;
    }

    .logout {
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      color: var(--sidebar-muted);
      background: transparent;
      font-weight: 800;
    }

    .logout:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto;
      gap: 14px;
      align-items: center;
      padding: 17px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 247, 240, 0.93);
      backdrop-filter: blur(18px);
    }

    .search {
      position: relative;
    }

    .search span {
      position: absolute;
      left: 18px;
      top: 50%;
      color: var(--muted);
      transform: translateY(-50%);
    }

    .search input {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 18px 0 48px;
      color: var(--text);
      background: var(--surface-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      outline: none;
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(207, 113, 53, 0.15);
    }

    .pill,
    .chip,
    .ghost-button,
    .primary-button,
    .danger-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      padding: 0 16px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .pill {
      border: 1px solid transparent;
      background: var(--sage-soft);
      color: #344427;
      font-size: 14px;
    }

    .pill.warn {
      border-color: #ffb58f;
      background: #fff6ed;
      color: #79421e;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: none;
      border-radius: 999px;
      background: currentColor;
    }

    .primary-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset;
    }

    .primary-button:hover {
      background: #bd6129;
    }

    .ghost-button,
    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: #4f4940;
    }

    .ghost-button:hover,
    .chip:hover {
      border-color: var(--line-strong);
      background: #fffaf4;
    }

    .ghost-button:disabled,
    .primary-button:disabled,
    .danger-button:disabled,
    .chip:disabled {
      border-color: var(--line);
      background: #ddd5c8;
      color: #8e8375;
      box-shadow: none;
    }

    .chip {
      min-height: 38px;
      padding: 0 14px;
      font-size: 14px;
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .chip.sage.active {
      border-color: var(--sage);
      background: var(--sage);
    }

    .danger-button {
      border: 1px solid #e2a27f;
      background: #fff3eb;
      color: #914917;
    }

    .mobilebar {
      display: none;
    }

    .screen {
      width: min(100%, 1600px);
      padding: 42px 36px 70px;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .lede {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid.two {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card,
    .panel,
    .filterbar,
    .table-shell {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .card,
    .panel {
      padding: 24px;
    }

    .metric {
      min-height: 176px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .metric .label {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .metric .value {
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
    }

    .metric p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .metric a {
      align-self: end;
      color: var(--accent-strong);
      font-weight: 900;
      text-decoration: none;
    }

    .filterbar {
      display: grid;
      gap: 14px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      margin-right: 6px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .record-count {
      margin-left: auto;
      color: var(--muted);
      font-weight: 900;
    }

    .table-shell {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      height: 54px;
      padding: 0 22px;
      color: var(--muted);
      background: var(--bg-strong);
      text-align: left;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    td {
      min-height: 70px;
      padding: 18px 22px;
      border-top: 1px solid #eadfce;
      vertical-align: middle;
      font-size: 16px;
    }

    tr[data-open-lead],
    tr[data-open-customer],
    tr[data-open-policy] {
      cursor: pointer;
    }

    tr[data-open-lead]:hover td,
    tr[data-open-customer]:hover td,
    tr[data-open-policy]:hover td {
      background: #fff8f0;
    }

    tr:focus-visible,
    button:focus-visible,
    a:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(207, 113, 53, 0.45);
      outline-offset: 2px;
    }

    .cell-title {
      display: block;
      color: #111;
      font-weight: 900;
      line-height: 1.25;
    }

    .cell-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      line-height: 1.35;
    }

    .status {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      border-radius: 999px;
      padding: 0 12px;
      background: var(--neutral-soft);
      color: #4b443b;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status.new,
    .status.contacting,
    .status.awaiting,
    .status.renewal-pending,
    .status.overdue {
      background: var(--warning-soft);
      color: #6f3715;
    }

    .status.consultation,
    .status.converted,
    .status.active,
    .status.completed {
      background: var(--sage-soft);
      color: #344427;
    }

    .status.draft {
      background: #e7eed9;
      color: #344427;
    }

    .status.dim {
      background: #e3d8c8;
      color: #655d52;
    }

    .timeline {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline li {
      position: relative;
      padding-left: 28px;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--sage);
    }

    .timeline li::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 20px;
      bottom: -20px;
      width: 2px;
      background: var(--line);
    }

    .timeline li:last-child::after {
      display: none;
    }

    .timeline strong {
      display: block;
      line-height: 1.3;
    }

    .timeline li > span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.35;
    }

    .timeline .status {
      display: inline-flex;
      margin-left: 8px;
      vertical-align: middle;
    }

    .progress-list {
      display: grid;
      gap: 12px;
    }

    .progress-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(160px, 2fr) 76px;
      gap: 14px;
      align-items: center;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: var(--neutral-soft);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .bar.sage span {
      background: var(--sage);
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(330px, .95fr);
      gap: 18px;
      align-items: start;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 28px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .field-value {
      font-size: 17px;
      font-weight: 850;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--surface-soft);
      outline: none;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    .checkbox {
      display: flex;
      flex-direction: row;
      gap: 10px;
      align-items: center;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .empty {
      padding: 36px 22px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .module-card {
      min-height: 190px;
    }

    .module-card .round-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }

    .permission-table .yes,
    .permission-table .no {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 999px;
      font-weight: 900;
    }

    .permission-table .yes {
      background: var(--sage-soft);
      color: #344427;
    }

    .permission-table .no {
      background: var(--neutral-soft);
      color: var(--muted);
    }

    .notice {
      border: 1px solid #ffbd98;
      border-radius: var(--radius);
      padding: 16px 18px;
      background: #fff5ee;
      color: #70401f;
      line-height: 1.5;
    }

    .notice.sage {
      border-color: #c8d8b1;
      background: #f0f8e5;
      color: #354828;
    }

    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(37, 34, 31, 0.46);
    }

    .modal-root.open {
      display: grid;
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .modal-head,
    .modal-body,
    .modal-actions {
      padding: 22px 24px;
    }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      border-bottom: 1px solid var(--line);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--line);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 1260px) {
      .grid.metrics,
      .grid.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split,
      .grid.three {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1039px) {
      :root {
        --topbar-h: auto;
      }

      .app {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .mobilebar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: 1fr minmax(180px, 45%);
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--sidebar);
        color: #fff;
      }

      .mobilebar .brand {
        padding: 0;
        grid-template-columns: 40px 1fr;
      }

      .mobilebar .brand-mark {
        width: 40px;
        height: 40px;
        font-size: 19px;
      }

      .mobilebar .brand-name {
        font-size: 17px;
      }

      .module-select {
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 0 12px;
        color: #fff;
        background: #474137;
        font-weight: 800;
      }

      .workspace {
        display: block;
      }

      .topbar {

      document.getElementById("userMeta").textContent = `${state.session.role || "admin"} · verified`;

    async function loadRemoteLeads() {
      state.remoteState = "loading";
      renderTopStatus();
      try {
        if (!window.CoverMateFirebase || !window.CoverMateFirebase.loadOperationalLeads) {
          throw new Error("Operational lead reader is unavailable.");
        }
        const rows = await window.CoverMateFirebase.loadOperationalLeads(120);
        state.remoteLeads = rows.map(normalizeRemoteLead);
        state.remoteState = "live";
      } catch (error) {
        state.remoteLeads = [];
        state.remoteState = "fallback";
        state.remoteError = error && error.message ? error.message : "Could not load contactLeads.";
      }
      renderTopStatus();
    }

    function bindEvents() {
      document.addEventListener("click", handleClick);
      document.addEventListener("submit", handleSubmit);
      document.addEventListener("keydown", handleKeydown);
      document.addEventListener("input", handleInput);
      roleSelect.addEventListener("change", () => {
        state.role = roleSelect.value;
        render();
      });
      mobileModuleSelect.addEventListener("change", () => setModule(mobileModuleSelect.value));
      globalSearch.addEventListener("input", () => {
        state.query = globalSearch.value.trim().toLowerCase();
        state.recordId = null;
        renderScreen();
      });
      window.addEventListener("hashchange", () => {
        const next = hashModule();
        if (next && next !== state.module) {
          state.module = next;
          state.recordId = null;
          render();
        }
      });
    }

    function handleClick(event) {
      const actionEl = event.target.closest("[data-action]");
      if (actionEl) {
        const action = actionEl.dataset.action;
        if (action === "logout") signOutAdmin();
        if (action === "open-new-lead") openNewLeadModal();
        if (action === "close-modal") closeModal();
        if (action === "module") setModule(actionEl.dataset.module);
        if (action === "back-leads") {
          state.recordId = null;
          renderScreen();
        }
        if (action === "lead-filter") {
          state.filters[actionEl.dataset.filter] = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "status-change") {
          setLeadStatus(actionEl.dataset.id, actionEl.dataset.status);
        }
        if (action === "add-note") addLeadNote(actionEl.dataset.id);
        if (action === "task-filter") {
          state.filters.taskView = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "complete-task") completeTask(actionEl.dataset.id);
        if (action === "reopen-task") reopenTask(actionEl.dataset.id);
        if (action === "settings-tab") {
          state.filters.settingsTab = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "analytics-tab") {
          state.filters.analyticsTab = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "policy-filter") {
          state.filters[actionEl.dataset.filter] = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "renewal-filter") {
          state.filters.renewalWindow = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "document-filter") {
          state.filters.documentCategory = actionEl.dataset.value;
          renderScreen();
        }
        if (action === "customer-filter") {
          state.filters.customerHold = actionEl.dataset.value;
          renderScreen();
        }
      }

      const leadRow = event.target.closest("[data-open-lead]");
      if (leadRow && !event.target.closest("button, a, input, select, textarea")) {
        openLead(leadRow.dataset.openLead);
      }
    }

    function handleSubmit(event) {
      const form = event.target.closest("[data-form]");
      if (!form) return;
      event.preventDefault();
      if (form.dataset.form === "new-lead") saveNewLead(form);
    }

    function handleKeydown(event) {
      const row = event.target.closest("[data-open-lead]");
      if (row && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openLead(row.dataset.openLead);
      }
      if (event.key === "Escape" && modalRoot.classList.contains("open")) {
        closeModal();
      }
    }

    function handleInput(event) {
      if (event.target.matches("[data-note]")) {
        const id = event.target.dataset.note;
        state.local.drafts[id] = event.target.value;
        writeLocal();
      }
    }

    function render() {
      renderChrome();
      renderTopStatus();
      renderScreen();
    }

      sideNav.innerHTML = modules.map((item) => {
        const count = item.count ? Number(item.count() || 0) : 0;
        return `
          <button class="nav-button ${item.id === state.module ? "active" : ""}" type="button" data-action="module" data-module="${item.id}">
            <span class="nav-icon" aria-hidden="true">${iconSvg(item.icon)}</span>
            <span>${escapeHTML(item.label)}</span>
            ${count ? `<span class="badge">${count}</span>` : ""}
          </button>
        `;
      }).join("");
      mobileModuleSelect.innerHTML = modules.map((item) => `<option value="${item.id}" ${item.id === state.module ? "selected" : ""}>${escapeHTML(item.label)}</option>`).join("");
      roleSelect.value = state.role;
      document.getElementById("newLeadButton").disabled = !canWrite();
      document.getElementById("newLeadButton").title = canWrite() ? "Create a local Phase A lead" : "Read-only preview role cannot create leads";
    }

    function renderTopStatus() {
      const text = state.remoteState === "live"
        ? `Live contactLeads · ${state.remoteLeads.length}`

    function settingsAudit() {

      return `
        <section class="panel">
          <h2>Audit trail</h2>
          <div class="notice">These are local Phase A audit events for prototype verification. The production backend should write immutable opsAudit documents server-side.</div>

                <label>Interest
                  <select name="interest">
                    <option value="motor">Motor</option>

      modalRoot.querySelector("input[name='name']").focus();

    function closeModal() {
      modalRoot.classList.remove("open");
      modalRoot.innerHTML = "";
    }

    function saveNewLead(form) {
      const data = new FormData(form);
      const now = Date.now();
      const id = `local-${now}`;
      const lead = {
        id,
        displayId: `LOCAL-${String(state.local.leads.length + 1).padStart(3, "0")}`,
        name: clean(data.get("name")),
        phone: clean(data.get("contact")),
        email: "",
        line: "",
        source: clean(data.get("source")),
        status: "new",
        interest: clean(data.get("interest")),
        nextAction: "First contact task created",
        nextDate: new Date(now + 2 * 60 * 60 * 1000).toISOString(),
        assigned: state.session && state.session.name || "CoverMate admin",
        priority: "High",
        submittedMessage: clean(data.get("message")) || "No message recorded.",
        createdAt: now,
        consent: data.get("consent") === "on",
        local: true
      };
      state.local.leads.unshift(lead);
      state.local.tasks.unshift({
        id: `task-${now}`,
        task: `First contact — ${lead.name}`,
        due: "Today",
        dueDate: lead.nextDate,
        priority: "High",
        related: `Lead ${lead.displayId}`,
        owner: lead.assigned,
        local: true
      });
      audit("Lead created", lead.displayId, "Local Phase A record plus first-contact task");
      writeLocal();
      closeModal();
      state.module = "leads";
      state.recordId = lead.id;
      render();
    }

    function openLead(id) {
      state.module = "leads";
      state.recordId = id;
      history.replaceState(null, "", "#leads");
      render();
    }

    function setModule(moduleId) {
      if (!modules.some((item) => item.id === moduleId)) return;
      state.module = moduleId;
      state.recordId = null;
      history.replaceState(null, "", `#${moduleId}`);
      render();
    }

    function setLeadStatus(id, next) {
      if (!canWrite()) return;
      const lead = allLeads().find((item) => item.id === id);
      if (!lead) return;
      state.local.leadStatus[id] = next;
      audit("Lead status changed", lead.displayId, `${labelFor(leadStatuses, effectiveLeadStatus(lead))} → ${labelFor(leadStatuses, next)}`);
      writeLocal();
      renderScreen();
      renderChrome();
    }

    function addLeadNote(id) {
      if (!canWrite()) return;
      const lead = allLeads().find((item) => item.id === id);
      const text = clean(state.local.drafts[id] || "");
      if (!lead || !text) return;
      state.local.notes[id] = state.local.notes[id] || [];
      state.local.notes[id].unshift({
        title: text,
        meta: `Just now · ${state.session && state.session.name || "CoverMate admin"}`
      });
      state.local.drafts[id] = "";
      audit("Interaction note added", lead.displayId, text);
      writeLocal();
      renderScreen();
    }

    function completeTask(id) {
      if (!canWrite()) return;
      state.local.taskState[id] = "completed";
      audit("Task completed", id, "Marked complete in Phase A local state");
      writeLocal();
      render();
    }

    function reopenTask(id) {
      if (!canWrite()) return;
      state.local.taskState[id] = "open";
      audit("Task reopened", id, "Reopened in Phase A local state");
      writeLocal();
      render();
    }

    function allLeads() {
      const base = state.remoteState === "live" ? state.remoteLeads : seed.leads;
      return state.local.leads.concat(base).map((lead) => ({
        ...lead,
        status: state.local.leadStatus[lead.id] || lead.status
      }));
    }

    function filteredLeads() {
      return allLeads().filter((lead) => {
        const statusPass = state.filters.leadStatus === "all" || effectiveLeadStatus(lead) === state.filters.leadStatus;
        const interestPass = state.filters.leadInterest === "all" || lead.interest === state.filters.leadInterest;
        return statusPass && interestPass && matchesSearch(lead);
      }).sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
    }

    function effectiveLeadStatus(lead) {
      return state.local.leadStatus[lead.id] || lead.status || "new";
    }

    function leadCounts() {
      const rows = allLeads();
      return {
        needsContact: rows.filter((lead) => ["new", "contacting"].includes(effectiveLeadStatus(lead))).length,
        contacted: rows.filter((lead) => !["new"].includes(effectiveLeadStatus(lead))).length,
        consultation: rows.filter((lead) => ["consultation", "quotation", "considering", "converted"].includes(effectiveLeadStatus(lead))).length,
        quoted: rows.filter((lead) => ["quotation", "considering", "converted"].includes(effectiveLeadStatus(lead))).length,
        converted: rows.filter((lead) => effectiveLeadStatus(lead) === "converted").length
      };
    }

    function taskRows() {
      return state.local.tasks.concat(seed.tasks).map((task) => ({
        ...task,
        completed: state.local.taskState[task.id] === "completed" || (state.local.taskState[task.id] !== "open" && task.completed === true)
      }));
    }

    function filteredTasks() {
      const view = state.filters.taskView;
      return taskRows().filter((task) => {
        if (view === "completed") return task.completed;
        if (task.completed) return view === "all";
        if (view === "today") return sameDay(task.dueDate, today);
        if (view === "upcoming") return !isOverdue(task.dueDate) && !sameDay(task.dueDate, today);
        if (view === "overdue") return isOverdue(task.dueDate);
        return matchesSearch(task);
      }).filter(matchesSearch);
    }

    function renewalRows() {
      return seed.policies
        .filter((policy) => policy.status === "Renewal pending" || policy.days <= 365)
        .sort((a, b) => a.days - b.days)
        .map((policy) => ({
          policy: `${policy.owner} · ${policy.type}`,
          meta: `${policy.id} · ${policy.insurer}`,
          days: policy.days,
          expires: policy.expires,
          renewalStatus: policy.days <= 14 ? "Comparison overdue" : policy.days <= 30 ? "Comparison due" : "Not started",
          lastContact: policy.days <= 14 ? "19 days ago" : "—",
          decision: "Awaiting customer"
        }));
    }

    function quoteRows() {
      return seed.quotes.slice();
    }

    function normalizeRemoteLead(item, index) {
      const createdAt = timestampMs(item.createdAt) || timestampMs(item.updatedAt) || fallbackDate - index * 3600000;
      const source = item.sourcePath ? sourceLabel(item.sourcePath) : "Public form";
      return {
        id: `remote-${item.id}`,
        remoteId: item.id,
        displayId: `CL-${String(item.id || "").slice(0, 7).toUpperCase()}`,
        name: item.name || "Unnamed lead",
        phone: item.contact || "",
        contact: item.contact || "",
        email: "",
        line: "",
        source,
        status: safeStatus(item.status, item.read),
        interest: item.coverage || item.qtype || "unsure",
        nextAction: item.read ? "Review record" : "First contact",
        nextDate: new Date(createdAt + 2 * 60 * 60 * 1000).toISOString(),
        assigned: "CoverMate admin",
        priority: item.read ? "Medium" : "High",
        submittedMessage: item.topic || item.summary || "No submitted message stored.",
        createdAt,
        updatedAt: timestampMs(item.updatedAt),
        consent: item.consent === true,
        language: item.language || "th",
        live: true
      };
    }

    function leadHistory(lead) {
      const local = state.local.notes[lead.id] || [];
      return local.concat([
        { title: lead.live ? "Lead loaded from contactLeads" : "Lead created", meta: `${formatDateTime(lead.createdAt)} · ${lead.source || "System"}` },
        { title: lead.consent ? "Consent captured" : "Consent not captured", meta: lead.consent ? "Public form checkbox · insurance advice and quotation" : "Needs follow-up before advice or quotation" }
      ]);
    }

    function pageHead(title, description, aside = "") {
      return `
        <div class="page-head">
          <div>
            <h1>${escapeHTML(title)}</h1>
            <p class="lede">${escapeHTML(description)}</p>
          </div>
          <div>${aside}</div>
        </div>
      `;
    }

    function livePill(text) {
      return `<span class="pill"><span class="dot"></span>${escapeHTML(text || (state.remoteState === "live" ? "Live contactLeads" : "Local demo"))}</span>`;
    }

    function backendPill(text) {
      return `<span class="pill warn"><span class="dot"></span>${escapeHTML(text || "UI ready · backend required")}</span>`;
    }

    function metric(label, value, copy, cta, moduleId, sage = false) {
      return `
        <section class="card metric">
          <span class="label"><span class="dot"></span>${escapeHTML(label)}</span>
          <span class="value">${escapeHTML(String(value))}</span>
          <p>${escapeHTML(copy)}</p>
          <a href="#${moduleId}" data-action="module" data-module="${moduleId}">${escapeHTML(cta)} →</a>
        </section>
      `;
    }

    function analyticMetric(label, value, copy) {
      return `
        <section class="card">
          <span class="field-label">${escapeHTML(label)}</span>
          <strong style="display:block;font-size:34px;line-height:1.1;margin:10px 0;">${escapeHTML(String(value))}</strong>
          <p class="note" style="margin:0;">${escapeHTML(copy)}</p>
        </section>
      `;
    }

    function pipelineRow(label, value, pct, sage = false) {
      const width = Number.isFinite(Number(pct)) ? Math.max(0, Math.min(100, Number(pct))) : 0;
      const meta = value === "—" ? "—" : `${value} · ${Math.round(width)}%`;
      return `
        <div class="progress-row">
          <strong>${escapeHTML(label)}</strong>
          <span class="bar ${sage ? "sage" : ""}"><span style="width:${width}%;"></span></span>
          <span class="cell-meta">${escapeHTML(meta)}</span>
        </div>
      `;
    }

    function filterBar(groups, count) {
      return `
        <div class="filterbar">
          ${groups.map(([label, key, values]) => `
            <div class="filter-row">
              <span class="filter-label">${escapeHTML(label)}</span>
              ${values.map(([value, text]) => {
                const action = key.startsWith("policy") ? "policy-filter" : key === "documentCategory" ? "document-filter" : key === "customerHold" ? "customer-filter" : "lead-filter";
                return `<button class="chip ${state.filters[key] === value ? "active" : ""}" type="button" data-action="${action}" data-filter="${key}" data-value="${value}">${escapeHTML(text)}</button>`;
              }).join("")}
              ${label === groups[0][0] ? `<span class="record-count">${count} records</span>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renewalFilterBar(count) {
      return `
        <div class="filterbar">
          <div class="filter-row">
            <span class="filter-label">Expiring within</span>
            ${[["7", "7 days"], ["14", "14 days"], ["30", "30 days"], ["60", "60 days"], ["90", "90 days"], ["all", "All"]].map(([value, label]) => `

            `).join("")}
            <span class="record-count">${count} records</span>
          </div>
        </div>
      `;
    }

    function simpleInfoBar(text, count) {
      return `<div class="filterbar"><div class="filter-row"><span>${escapeHTML(text)}</span><span class="record-count">${count} records</span></div></div>`;
    }

    function leadRow(lead) {
      const statusValue = effectiveLeadStatus(lead);
      return `
        <tr data-open-lead="${escapeHTML(lead.id)}" tabindex="0" role="button" aria-label="Open ${escapeHTML(lead.name)}">
          <td data-label="Lead">${titleMeta(lead.name, `${lead.phone || lead.contact || "No phone"} · ${lead.source || "Unknown"}`)}</td>
          <td data-label="Status">${status(labelFor(leadStatuses, statusValue), statusValue)}</td>
          <td data-label="Interest"><strong>${interestLabel(lead.interest)}</strong></td>
          <td data-label="Last interaction"><strong>${relativeTime(lead.createdAt)}</strong></td>
          <td data-label="Next action">${titleMeta(lead.nextAction || "—", lead.assigned || "Unassigned")}</td>

    }

    function simpleTable(headers, rows, raw = false) {
      return `
        <div class="table-shell">
          <table>
            <thead><tr>${headers.map((head) => `<th>${escapeHTML(head)}</th>`).join("")}</tr></thead>
            <tbody>
              ${rows.length ? rows.map((cells) => `
                <tr>${cells.map((cell, index) => `<td data-label="${escapeHTML(headers[index])}">${raw ? cell : String(cell).includes("<") ? cell : escapeHTML(String(cell))}</td>`).join("")}</tr>
              `).join("") : emptyRow("No records.")}
            </tbody>
          </table>
        </div>
      `;
    }

    function emptyRow(text) {
      return `<tr><td colspan="8"><div class="empty">${escapeHTML(text)}</div></td></tr>`;
    }

    function contentCard(title, copy, href, disabled) {
      return `
        <section class="card module-card">
          <span class="round-icon" aria-hidden="true">${iconSvg("edit")}</span>
          <h2>${escapeHTML(title)}</h2>
          <p class="note" style="margin:0 0 18px;">${escapeHTML(copy)}</p>
          ${disabled
            ? `<button class="ghost-button" type="button" disabled title="Read-only preview role cannot edit website content">Read-only</button>`
            : `<a class="ghost-button" href="${escapeHTML(href)}" target="_blank" rel="noreferrer">Open</a>`}
        </section>
      `;
    }

    function field(label, value) {
      return `<div><span class="field-label">${escapeHTML(label)}</span><span class="field-value">${escapeHTML(String(value || "—"))}</span></div>`;
    }

    function titleMeta(title, meta) {
      return `<span class="cell-title">${escapeHTML(String(title))}</span>${meta ? `<span class="cell-meta">${escapeHTML(String(meta))}</span>` : ""}`;
    }

    function status(label, value) {
      const className = value || slug(label);
      return `<span class="status ${escapeHTML(className)}">${escapeHTML(label)}</span>`;
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return {
          leads: Array.isArray(parsed && parsed.leads) ? parsed.leads : [],
          tasks: Array.isArray(parsed && parsed.tasks) ? parsed.tasks : [],
          leadStatus: parsed && parsed.leadStatus && typeof parsed.leadStatus === "object" ? parsed.leadStatus : {},
          taskState: parsed && parsed.taskState && typeof parsed.taskState === "object" ? parsed.taskState : {},
          notes: parsed && parsed.notes && typeof parsed.notes === "object" ? parsed.notes : {},
          drafts: parsed && parsed.drafts && typeof parsed.drafts === "object" ? parsed.drafts : {},
          audit: Array.isArray(parsed && parsed.audit) ? parsed.audit : []
        };
      } catch {
        return { leads: [], tasks: [], leadStatus: {}, taskState: {}, notes: {}, drafts: {}, audit: [] };
      }
    }

    function writeLocal() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(state.local));
    }

    function audit(action, record, detail) {
      state.local.audit.unshift({
        ts: Date.now(),
        actor: state.session && (state.session.name || state.session.email) || "CoverMate admin",
        action,
        record,
        detail
      });
      state.local.audit = state.local.audit.slice(0, 80);
    }

    function canWrite() {
      return state.role !== "readonly";
    }

    function hashModule() {
      const id = (location.hash || "").replace("#", "");
      return modules.some((item) => item.id === id) ? id : "";
    }

    function matchesSearch(row) {
      if (!state.query) return true;
      return JSON.stringify(row).toLowerCase().includes(state.query);
    }

    function clean(value) {
      return String(value || "").replace(/\s+/g, " ").trim().slice(0, 600);
    }

    function escapeHTML(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function iconSvg(name) {

        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h6"></path>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path>',
        refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 21v-5h5"></path>',
        check: '<path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>',
        folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>',
        edit: '<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"></path>',
        building: '<path d="M4 21V8l8-5 8 5v13"></path><path d="M9 21v-6h6v6"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path>',
        chart: '<path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M8 16v-5"></path><path d="M12 16V8"></path><path d="M16 16v-3"></path>',
        settings: '<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>'
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.home}</svg>`;
    }

    function slug(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function safeStatus(statusValue, read) {
      const value = slug(statusValue || "");
      return leadStatuses.some(([statusId]) => statusId === value) ? value : read ? "contacted" : "new";
    }

    function labelFor(list, value) {
      const found = list.find(([id]) => id === value);
      return found ? found[1] : titleCase(String(value || "").replace(/-/g, " "));
    }

    function titleCase(value) {
      return String(value || "").replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function interestLabel(value) {
      const found = interests.find(([id]) => id === value);
      return found ? (found[0] === "all" ? "All" : found[1]) : titleCase(value || "unsure");
    }

    function sourceLabel(path) {
      if (/line/i.test(path)) return "LINE";
      if (/referral/i.test(path)) return "Referral";
      if (/google/i.test(path)) return "Google search";
      return "Website form";
    }

    function timestampMs(value) {
      if (!value) return 0;
      if (typeof value === "number") return value;
      if (value instanceof Date) return value.getTime();
      if (typeof value.toMillis === "function") return value.toMillis();
      if (typeof value.seconds === "number") return value.seconds * 1000;
      const parsed = Date.parse(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function sameDay(value, date) {
      const a = new Date(value);
      return a.getFullYear() === date.getFullYear() && a.getMonth() === date.getMonth() && a.getDate() === date.getDate();
    }

    function isOverdue(value) {
      const ms = timestampMs(value);
      return ms > 0 && ms < today.getTime();
    }

    function relativeTime(value) {
      const ms = timestampMs(value);
      if (!ms) return "Unknown";
      const delta = Math.max(0, today.getTime() - ms);
      const hours = Math.floor(delta / 3600000);
      if (hours < 1) return "Just now";
      if (hours < 24) return `${hours} hours ago`;
      const days = Math.floor(hours / 24);
      if (days === 1) return "Yesterday";
      if (days < 7) return `${days} days ago`;
      if (days < 35) return `${Math.floor(days / 7)} weeks ago`;
      return formatDate(ms);
    }

    function formatDate(value) {
      const ms = timestampMs(value);
      if (!ms) return "—";
      return new Intl.DateTimeFormat("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "Asia/Bangkok" }).format(ms);
    }

    function formatDateTime(value) {
      const ms = timestampMs(value);
      if (!ms) return "—";
      return new Intl.DateTimeFormat("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Bangkok" }).format(ms);
    }

    function toDateInput(value) {
      const ms = timestampMs(value);
      if (!ms) return "";
      return new Date(ms).toISOString().slice(0, 10);
    }

    function percent(value, total) {
      return total > 0 ? value / total * 100 : 0;
    }

    function statusMeaning(value) {
      const meanings = {
        new: "Arrived but no outbound contact has happened.",
        contacting: "A first contact attempt is underway.",
        contacted: "Customer has replied or spoken with CoverMate.",
        consultation: "Advice session is booked or completed.",
        quotation: "A comparison or proposal is being prepared or sent.",
        considering: "Customer is deciding after receiving options.",
        converted: "Policy record exists.",
        "follow-up-later": "Customer asked to pause until a future date.",
        "not-interested": "Customer declined for now.",
        lost: "Closed without a policy."
      };
      return meanings[value] || "";
    }

    function nextStatuses(value) {
      const map = {
        new: ["contacting", "not-interested", "lost"],
        contacting: ["contacted", "follow-up-later", "not-interested"],
        contacted: ["consultation", "quotation", "follow-up-later"],
        consultation: ["quotation", "considering", "lost"],
        quotation: ["considering", "converted", "lost"],
        considering: ["converted", "follow-up-later", "lost"],
        converted: ["follow-up-later"],
        "follow-up-later": ["contacting", "lost"],
        "not-interested": ["follow-up-later", "lost"],
        lost: ["follow-up-later"]
      };
      return (map[value] || []).map((id) => [id, labelFor(leadStatuses, id)]);
    }
  </script>
