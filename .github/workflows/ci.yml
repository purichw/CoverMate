name: CoverMate CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: covermate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Ubuntu archive for browser dependencies
        run: |
          # Keep Ubuntu's signed package indexes; avoid the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Playwright browser
        run: |
          npx playwright install --with-deps chromium webkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run CoverMate gate
        run: npm run check:ci

      - name: Real Auth, Rules, API and Publish E2E
        run: npm run check:emulators

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfr-evidence
          path: |
            uat-results/nfr/
            uat-results/articles-cloud/
          retention-days: 7
