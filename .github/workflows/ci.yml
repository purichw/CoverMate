name: CoverMate CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: covermate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          npx playwright install --with-deps chromium webkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run CoverMate gate
        run: npm run check:ci

      - name: Real Auth, Rules, API and Publish E2E
        run: npm run check:emulators

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfr-evidence
          path: uat-results/nfr/
          retention-days: 7
