name: CoverMate production availability
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
jobs:
  check:
    # This credential-bearing monitor never checks out pull-request/fork code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Use Ubuntu archive for browser dependencies
        run: |
          # Match CI's signed Ubuntu archive instead of the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install Playwright browser
        # uptime-check uses Playwright's default headless Chromium, no channel.
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check production pages
        timeout-minutes: 3
        env:
          COVERMATE_REQUIRE_BYPASS: '1'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/uptime-check.mjs
