ergency medical services · free, 24 hours\"}},{\"th\":{\"kicker\":\"ตำรวจ\",\"title\":\"191\",\"body\":\"เมื่อมีข้อพิพาท คู่กรณีหนี หรือต้องลงบันทึกประจำวัน\"},\"en\":{\"kicker\":\"Police\",\"title\":\"191\",\"body\":\"For disputes, a driver leaving the scene, or a police report\"}},{\"th\":{\"kicker\":\"อุบัติเหตุบนทางหลวง\",\"title\":\"1586\",\"body\":\"สายด่วนกรมทางหลวง · แจ้งเหตุและขอความช่วยเหลือบนถนน\"},\"en\":{\"kicker\":\"Highway incidents\",\"title\":\"1586\",\"body\":\"Department of Highways hotline · road incidents and assistance\"}},{\"th\":{\"kicker\":\"ร้องเรียนเรื่องประกัน\",\"title\":\"1186\",\"body\":\"สายด่วน คปภ. · เมื่อบริษัทประกันปฏิเสธหรือประวิงเวลา\"},\"en\":{\"kicker\":\"Insurance complaints\",\"title\":\"1186\",\"body\":\"OIC hotline · when an insurer refuses or delays\"}}]},{\"id\":\"renew\",\"type\":\"renew\",\"on\":true,\"bg\":\"sage\",\"cols\":3,\"th\":{\"kicker\":\"เตือนล่วงหน้า · ยกเลิกได้ทุกเมื่อ\",\"title\":\"ให้ช่วยเตือนวันต่ออายุประกันไหม?\",\"body\":\"แจ้งประเภทกรมธรรม์และเดือนที่หมดอายุไว้กับเรา เราจะเตือนล่วงหน้า 60 วัน และสำหรับประกันรถยนต์จะช่วยเปรียบเทียบข้อเสนอใหม่เพื่อให้คุณพิจารณาว่าควรต่ออายุที่เดิมหรือเปลี่ยนทางเลือก โดยยังไม่ต้องส่งเอกสารในขั้นตอนนี้\",\"note\":\"เราใช้ข้อมูลนี้เพื่อติดตามเรื่องต่ออายุที่คุณแจ้งไว้ หากไม่ต้องการให้เตือนต่อ บอกเราทาง LINE ได้\"},\"en\":{\"kicker\":\"Advance reminders · stop any time\",\"title\":\"Would you like a renewal reminder?\",\"body\":\"Tell us the policy type and expiry month. We will remind you 60 days in advance and, for motor insurance, provide a fresh comparison for the coming renewal. No documents are required at this stage.\",\"note\":\"We use these details to follow up on the renewal you requested. Let us know on LINE if you no longer want reminders.\"},\"items\":[{\"icon\":\"bell\",\"th\":{\"title\":\"แจ้งก่อนถึงวันต่ออายุ\",\"body\":\"ฝากเดือนที่กรมธรรม์หมดอายุไว้ เพื่อให้เราติดต่อกลับและช่วยเตรียมเรื่องต่ออายุ\"},\"en\":{\"title\":\"A reminder before renewal\",\"body\":\"Leave your expiry month so we can get in touch and help you prepare for renewal.\"}},{\"icon\":\"compare\",\"th\":{\"title\":\"ช่วยเปรียบเทียบอีกครั้ง\",\"body\":\"สำหรับรถยนต์ เราช่วยดูเบี้ยและเงื่อนไขที่เสนอในรอบต่ออายุ เทียบกับกรมธรรม์เดิมให้ได้\"},\"en\":{\"title\":\"Compare your options again\",\"body\":\"For car insurance, we can compare renewal quotes and terms with your current policy.\"}},{\"icon\":\"lock\",\"th\":{\"title\":\"ใช้ข้อมูลอะไรบ้าง?\",\"body\":\"เริ่มจากประเภทกรมธรรม์ เดือนที่หมดอายุ และช่องทางติดต่อ โดยยังไม่ต้องส่งเลขกรมธรรม์หรือเลขบัตรประชาชน\"},\"en\":{\"title\":\"What details do you need?\",\"body\":\"We start with the policy type, expiry month and contact channel. No policy number or ID card number is needed at this stage.\"}}]},{\"id\":\"guides\",\"type\":\"guides\",\"on\":true,\"bg\":\"surface\",\"cols\":2,\"th\":{\"kicker\":\"อ่านก่อนตัดสินใจ\",\"title\":\"สี่เรื่องที่ควรรู้\\nก่อนเลือกประกัน\",\"body\":\"สรุปประเด็นสำคัญที่มักถูกมองข้าม เพื่อช่วยให้คุณตั้งคำถามและตรวจสอบเงื่อนไขก่อนตัดสินใจ\"},\"en\":{\"kicker\":\"Read before you decide\",\"title\":\"Four things to know\\nbefore choosing cover\",\"body\":\"Key points that are often missed, written to help you ask better questions and review conditions before deciding.\"},\"items\":[{\"th\":{\"label\":\"สุขภาพ\",\"meta\":\"\",\"title\":\"ควรเลือกค่าห้องวันละเท่าไหร่?\",\"body\":\"ลองดูค่าห้องของโรงพยาบาลที่คุณมีแนวโน้มใช้ แล้วเทียบกับสวัสดิการและประกันที่มีอยู่ รวมถึงงบที่จ่ายเบี้ยไหว ต้องดูด้วยว่ากรมธรรม์กำหนดวงเงินค่าห้องและค่าใช้จ่ายส่วนอื่นไว้อย่างไร ไม่ใช่ดูตัวเลขค่าห้องอย่างเดียว\"},\"en\":{\"label\":\"Health\",\"meta\":\"\",\"title\":\"How much cover do I need for hospital room costs?\",\"body\":\"Check room rates at the hospital you are likely to use, then compare them with your existing benefits and premium budget. Also check how the policy limits room costs and other expenses, rather than looking at the room benefit alone.\"}},{\"th\":{\"label\":\"รถยนต์\",\"meta\":\"\",\"title\":\"ประกันชั้น 3+ ถ้าขับชนเอง เคลมได้ไหม?\",\"body\":\"โดยทั่วไป ความเสียหายของรถตัวเองในประกันชั้น 3+ ต้องเกิดจากการชนกับยานพาหนะและระบุคู่กรณีได้ หากชนเสาหรือกำแพงเอง มักไม่อยู่ในความคุ้มครองส่วนนี้ ควรตรวจเงื่อนไขกรมธรรม์ของคุณก่อนแจ้งเคลม\"},\"en\":{\"label\":\"Motor\",\"meta\":\"\",\"title\":\"Does Class 3+ cover an accident with no other vehicle involved?\",\"body\":\"Class 3+ generally covers damage to your own car only in a collision with an identified vehicle. Hitting a post or wall is generally not covered under this benefit. Check the terms of your own policy.\"}},{\"th\":{\"label\":\"ชีวิต\",\"meta\":\"\",\"title\":\"ควรทำประกันชีวิตวงเงินเท่าไหร่?\",\"body\":\"เริ่มจากดูว่ามีใครต้องพึ่งพารายได้ของคุณ มีหนี้หรือค่าใช้จ่ายที่ต้องดูแลเท่าไหร่ และต้องดูแลอีกนานแค่ไหน จากนั้นดูเงินออมและประกันที่มีอยู่ด้วย วงเงินที่เหมาะจะแตกต่างกัน และควรเลือกเบี้ยที่จ่ายต่อเนื่องไหว\"},\"en\":{\"label\":\"Life\",\"meta\":\"\",\"title\":\"How much life insurance do I need?\",\"body\":\"Consider who depends on your income, the debts and expenses they would need to cover, and for how long. Take your savings and existing insurance into account too. The amount will vary, and premiums need to remain affordable.\"}},{\"th\":{\"label\":\"ภาษี\",\"meta\":\"\",\"title\":\"ประกันแบบไหนลดหย่อนภาษีได้บ้าง?\",\"body\":\"ประกันชีวิต สุขภาพ และบำนาญบางแบบใช้ลดหย่อนได้เมื่อเข้าเงื่อนไขของกรมสรรพากร แต่แต่ละประเภทมีเพดานและเงื่อนไขต่างกัน ควรตรวจหนังสือรับรองเบี้ยประกันและหลักเกณฑ์ของปีภาษีที่จะยื่น หากไม่แน่ใจว่าเบี้ยส่วนไหนใช้สิทธิได้ ให้เราช่วยตรวจข้อมูลกับบริษัทประกันได้\"},\"en\":{\"label\":\"Tax\",\"meta\":\"\",\"title\":\"Which types of insurance qualify for tax deductions?\",\"body\":\"Some life, health and annuity policies qualify under Revenue Department rules. Limits and conditions differ. Check your premium certificate and the rules for the relevant tax year. We can help check with the insurer which part of your premium is eligible.\"}}]},{\"id\":\"voices\",\"type\":\"stori \":\"\",\"title\":\"คำถามที่พบบ่อย\",\"body\":\"\"},\"en\":{\"kicker\":\"\",\"title\":\"Frequently asked questions\",\"body\":\"\"},\"items\":[{\"th\":{\"q\":\"ปรึกษาเรื่องประกัน มีค่าใช้จ่ายไหม?\",\"a\":\"ไม่มีค่าปรึกษาจาก CoverMate คุณถามหรือให้ช่วยอ่านกรมธรรม์เดิมได้ โดยไม่จำเป็นต้องซื้อประกัน หากมีการทำประกัน เราได้รับค่าตอบแทนจากบริษัทประกันตามเงื่อนไขของแต่ละผลิตภัณฑ์\"},\"en\":{\"q\":\"Is there a fee for advice?\",\"a\":\"We don't charge for advice or for reviewing an existing policy. You don't need to buy insurance. If a policy is arranged, we receive commission from the insurer under the terms for that product.\"}},{\"th\":{\"q\":\"มีประกันอยู่แล้ว ให้ช่วยดูได้ไหม?\",\"a\":\"ได้ ส่งหน้าตารางกรมธรรม์มาและบอกเรื่องที่สงสัย เราช่วยอธิบายความคุ้มครองและเงื่อนไขให้ได้ ส่วนการเปลี่ยนผู้ดูแลหรือนายหน้าเป็นอีกเรื่องหนึ่ง ต้องตรวจขั้นตอนกับบริษัทประกันของกรมธรรม์นั้นก่อน\"},\"en\":{\"q\":\"Can you help me review a policy I already have?\",\"a\":\"Yes. Send your policy schedule and tell us what you'd like to check. We can explain the cover and terms. Changing the servicing agent or broker is a separate process that needs to be checked with your insurer.\"}},{\"th\":{\"q\":\"ถ้าแค่สอบถาม จะมีคนโทรมาตามไหม?\",\"a\":\"คุณสอบถามก่อนได้ เราจะตอบเรื่องที่คุณถามผ่านช่องทางที่แจ้งไว้ หากยังไม่ต้องการทำประกันต่อ บอกเราได้ เราจะไม่โทรติดตามการซื้อ เว้นแต่คุณขอให้ติดต่อกลับ\"},\"en\":{\"q\":\"Will I get follow-up calls if I only ask a question?\",\"a\":\"You can ask a question without committing to a purchase. We'll reply through the channel you provide. If you're not looking to proceed, let us know. We won't make sales follow-up calls unless you ask us to contact you.\"}},{\"th\":{\"q\":\"ซื้อผ่าน CoverMate แพงกว่าซื้อออนไลน์ไหม?\",\"a\":\"ราคาอาจต่างกันตามแผน ความคุ้มครอง ส่วนลด และช่องทางขาย จึงควรเทียบใบเสนอราคาที่มีเงื่อนไขเดียวกัน หากมีราคาที่ดูไว้อยู่แล้ว ส่งมาให้ช่วยเทียบได้ โดย CoverMate ไม่มีค่าปรึกษาเพิ่มเติม\"},\"en\":{\"q\":\"Does buying through CoverMate cost more ment bills or claim eligibility.\"],[\"healthMethod\",\"เทียบค่าห้องอ้างอิงกับสิทธิค่าห้องเดิมเท่านั้น หากมีส่วนต่างหรือร่วมจ่าย ควรตรวจเพิ่ม หากข้อมูลไม่ครบ ยังสรุปไม่ได้ เงินที่พร้อมจ่ายเองไม่ถูกหักจากค่าห้องต่อวัน เพราะเป็นคนละหน่วย\",\"Compare the reference room rate with existing daily room benefits. A gap or cost-sharing prompts further review; missing details prevent a conclusion. A per-episode budget is not deducted from a daily room rate.\"],[\"privacy\",\"คำนวณได้โดยไม่ต้องให้ข้อมูลติดต่อ ข้อมูลอยู่บนหน้านี้เท่านั้น หากขอคำแนะนำต่อ สรุปจะถูกแนบไว้และส่งเมื่อคุณยินยอมและกดส่งฟอร์ม\",\"No contact details are needed to calculate. Figures stay on this page. Continuing prepares an attachment that is sent only when you consent and submit the contact form.\"],[\"pending\",\"กำลังคำนวณ\",\"Updating estimate\"],[\"completePrompt\",\"กรอกข้อมูลหลักให้ครบเพื่อดูผลประเมิน\",\"Complete the core fields to see your estimate\"],[\"invalid\",\"กรุณาใส่ตัวเลขจำนวนเต็ม\",\"Please enter a whole number\"],[\"warning\",\"ค่านี้สูงกว่าช่วงทั่วไป ลองตรวจสอบอีกครั้ง\",\"Above the usual range. Please double-check.\"],[\"reset\",\"เริ่มใหม่เฉพาะแท็บนี้\",\"Reset this tab\"],[\"attached\",\"แนบสรุปจากเครื่องคำนวณแล้ว\",\"Calculator summary attached\"]].map(([n,e,t])=>({path:\"calculatorDesign.\"+n,label:n.replace(/([A-Z])/g,\" $1\"),group:\"Calculator design\",localized:true,seed:{th:e,en:t}})),...[[\"known\",\"ระบุจำนวนเงิน\",\"Enter amount\"],[\"notSure\",\"ไม่ทราบวงเงิน\",\"I do not know the amount\"],[\"notSureValue\",\"ยังไม่ทราบ\",\"Not sure\"],[\"choose\",\"เลือกคำตอบ\",\"Choose an answer\"],[\"partial\",\"ยังไม่ทราบส่วนขาดสุดท้าย\",\"Final shortfall is not yet known\"],[\"provisionalGap\",\"ยอดก่อนหักประกันเดิม\",\"Amount before existing cover\"],[\"partialNote\",\"ยอดนี้ยังไม่ได้หักประกันเดิมที่คุณไม่ทราบ จึงยังไม่ใช่จำนวนที่ควรซื้อเพิ่ม\",\"Unknown existing cover has not been deducted. This is not an amount to purchase.\"],[\"debtDoubleCount\",\"หากรวมยอดปิดหนี้แล้ว อย่านับ
